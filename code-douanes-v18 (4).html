  <!-- ===== Cache offline : Méthode 2 — Cache API directe (sans Service Worker) ===== -->
  <script>
    // Le SW blob: n'est pas supporté par les navigateurs.
    // On utilise directement la Cache API pour sauvegarder la page courante.
    (async function cachePage() {
      if (!('caches' in window)) return;
      try {
        const CACHE_NAME = 'douanes-sn-v1';
        const url = location.href;
        const cache = await caches.open(CACHE_NAME);
        // Vérifie si déjà en cache
        const cached = await cache.match(url);
        if (!cached && navigator.onLine) {
          // Met en cache la page complète (HTML + tout son contenu)
          await cache.add(url);
          console.log('[Cache] Page mise en cache pour usage hors ligne ✓');
        }
        // Met aussi en cache les scripts React/Babel depuis unpkg
        const deps = [
          'https://unpkg.com/react@18/umd/react.production.min.js',
          'https://unpkg.com/react-dom@18/umd/react-dom.production.min.js',
          'https://unpkg.com/@babel/standalone/babel.min.js'
        ];
        for (const dep of deps) {
          const hit = await cache.match(dep);
          if (!hit && navigator.onLine) {
            try { await cache.add(dep); } catch(e) { /* CORS ignoré */ }
          }
        }
      } catch(e) {
        console.warn('[Cache] Mise en cache échouée:', e);
      }
    })();
  </script>

/* ===================== DATA: TITRE II — ARTICLES 27-61 COMPLETS ===================== */
const TITRE2_ARTICLES = [
  { num:27, titre:"Champ d'action du service des douanes", chapitre:"I — Champ d'action", section:"",
    texte:`1. L'action du service des douanes s'exerce sur l'ensemble du territoire douanier dans les conditions fixées par les dispositions légales et règlementaires.\n\n2. Une zone de surveillance spéciale est organisée le long des frontières terrestres et maritimes. Elle constitue le rayon des douanes.`,
    exemple:"Les agents des douanes de Kaolack exercent leur mission à la fois dans les bureaux de douane (dédouanement) et dans les zones rurales environnantes qui font partie du rayon des douanes. Une camionnette suspecte interceptée à 40 km de la frontière gambienne est dans le rayon terrestre (60 km) et peut légalement être contrôlée par la douane sans mandat.",
    motscles:["champ d'action","territoire douanier","rayon des douanes","frontières","surveillance"] },

  { num:28, titre:"Le rayon des douanes — Zone maritime et terrestre", chapitre:"I — Champ d'action", section:"",
    texte:`1. Le rayon des douanes comprend une zone maritime et une zone terrestre.\n\n2. La zone maritime est comprise entre le littoral et la limite des eaux territoriales.\n\n3. La zone terrestre s'étend :\na) sur les frontières maritimes, entre le littoral et une ligne tracée à 20 kilomètres en deçà du rivage de la mer et des rives des fleuves, rivières et canaux affluant à la mer jusqu'au dernier bureau de douane situé en amont, ainsi que dans un rayon de 20 kilomètres autour dudit bureau ;\nb) sur les frontières de terre, entre la limite du territoire douanier et une ligne tracée à 60 kilomètres en deçà.\n\n4. Pour faciliter la répression de la fraude, la profondeur de la zone terrestre peut être augmentée par des arrêtés du Ministre chargé des finances.\n\n5. Les distances sont calculées à vol d'oiseau, sans égard aux sinuosités des routes.`,
    exemple:"Frontière maritime (Dakar) : la zone terrestre du rayon couvre 20 km à l'intérieur des terres. Un entrepôt à Rufisque (15 km du rivage) est dans le rayon → contrôle légal sans mandat. Frontière terrestre (Tambacounda-Mali) : rayon de 60 km. Un camion intercepté à 50 km de la frontière malienne est dans le rayon terrestre → contrôle légal. Les distances se calculent à vol d'oiseau, non en suivant la route.",
    motscles:["rayon des douanes","zone maritime","zone terrestre","20 km","60 km","à vol d'oiseau","frontières maritimes","frontières terrestres"] },

  { num:29, titre:"Tracé de la limite intérieure du rayon terrestre", chapitre:"I — Champ d'action", section:"",
    texte:`Le tracé de la limite intérieure de la zone terrestre du rayon des douanes est fixé par arrêté du Ministre chargé des finances.`,
    exemple:"Le Ministre des Finances prend un arrêté délimitant précisément sur une carte officielle la frontière intérieure du rayon terrestre autour de Ziguinchor, proche de la Gambie. Cette délimitation permet aux agents et aux commerçants de savoir exactement quels villages et axes routiers sont soumis aux contrôles renforcés du rayon des douanes.",
    motscles:["limite intérieure","rayon terrestre","arrêté","Ministre des Finances","cartographie douanière"] },

  { num:30, titre:"Zone contiguë — Contrôle entre 12 et 24 milles marins", chapitre:"I — Champ d'action", section:"",
    texte:`Dans la zone contiguë comprise entre 12 et 24 milles marins mesurés à partir des lignes de base et sous réserve d'accords de délimitation avec les Etats voisins, le service des douanes peut exercer les contrôles nécessaires en vue de :\na) prévenir les infractions aux lois et règlements que l'administration des douanes est chargée d'appliquer sur le territoire douanier ;\nb) poursuivre les infractions à ces mêmes lois et règlements commises sur le territoire douanier.`,
    exemple:"Un patrouilleur des douanes sénégalaises détecte un bateau suspect à 18 milles marins au large de Dakar (zone contiguë : entre 12 et 24 milles). Les douaniers peuvent légalement l'intercepter pour prévenir une contrebande (al.a), ou poursuivre un trafiquant qui a fui depuis les eaux territoriales (al.b). En dehors de 24 milles, la douane sénégalaise n'a plus compétence.",
    motscles:["zone contiguë","12 milles","24 milles","lignes de base","contrôle maritime","prévention","poursuite"] },

  { num:31, titre:"Accomplissement des formalités douanières — Lieux autorisés", chapitre:"II — Organisation des bureaux, postes et brigades", section:"I — Établissement des bureaux, postes et brigades",
    texte:`1. Les formalités douanières ne peuvent être accomplies que dans les bureaux et postes de douane.\n\n2. Toutefois, des opérations de dédouanement peuvent être effectuées dans des brigades de douane ou dans tout autre lieu désigné par décision du Directeur général des douanes.`,
    exemple:"Un importateur ne peut pas dédouaner sa cargaison dans son entrepôt privé (al.1). Il doit aller au Bureau de Douane du Port. Cependant, si le Directeur général a désigné le parc industriel de Diamniadio comme lieu de dédouanement pour certains opérateurs agréés, ces derniers peuvent y accomplir leurs formalités (al.2) sans se déplacer au port.",
    motscles:["formalités douanières","bureaux de douane","postes de douane","brigades","lieux autorisés","Directeur général"] },

  { num:32, titre:"Création et suppression des bureaux de douane", chapitre:"II — Organisation des bureaux, postes et brigades", section:"I — Établissement des bureaux, postes et brigades",
    texte:`1. La création et la suppression des bureaux de douane font l'objet d'arrêtés du Ministre chargé des finances sur proposition du Directeur général des douanes.\n\n2. Le fonctionnement desdits bureaux fait l'objet de décisions du Directeur général des douanes.`,
    exemple:"Avec l'ouverture de l'aéroport Blaise Diagne à Diass, le Directeur général propose au Ministre la création d'un nouveau bureau de douane aéroportuaire. Le Ministre prend un arrêté de création (al.1). Le Directeur général prend ensuite des décisions fixant les effectifs, les procédures et les équipements de ce bureau (al.2) — deux niveaux de compétence distincts.",
    motscles:["création","suppression","bureaux de douane","arrêté","Ministre des Finances","Directeur général","proposition"] },

  { num:33, titre:"Création et fonctionnement des postes et brigades de douane", chapitre:"II — Organisation des bureaux, postes et brigades", section:"I — Établissement des bureaux, postes et brigades",
    texte:`La création, la suppression ainsi que le fonctionnement des postes et brigades de douane font l'objet de décisions du Directeur général des douanes.`,
    exemple:"Face à la recrudescence du trafic de médicaments sur l'axe Dakar-Mbour, le Directeur général crée par simple décision une brigade mobile sur cet axe — sans passer par un arrêté ministériel (contrairement aux bureaux). Il peut également supprimer un poste de douane devenu obsolète par la même voie décisionnelle plus souple.",
    motscles:["postes de douane","brigades de douane","création","suppression","fonctionnement","décision Directeur général"] },

  { num:34, titre:"Heures d'ouverture des bureaux et postes de douane", chapitre:"II — Organisation des bureaux, postes et brigades", section:"I — Établissement des bureaux, postes et brigades",
    texte:`1. Des décisions du Directeur général des douanes fixent les heures d'ouverture et de fermeture des bureaux et postes de douane.\n\n2. La durée d'ouverture des bureaux et postes de douane ne peut toutefois être inférieure à huit (08) heures par jour ouvrable.`,
    exemple:"Le Bureau de Douane du Port de Dakar est ouvert de 7h30 à 20h00 (12h30 d'ouverture) pour absorber le trafic portuaire intense. Un poste de douane à Kédougou est ouvert de 8h00 à 16h00 (minimum légal de 8 heures, al.2). Un importateur qui se présente à 17h à Kédougou devra attendre le lendemain — les formalités ne peuvent être accomplies hors des heures fixées.",
    motscles:["heures d'ouverture","fermeture","8 heures","jour ouvrable","bureaux","postes de douane"] },

  { num:35, titre:"Signalisation obligatoire des unités de douane", chapitre:"II — Organisation des bureaux, postes et brigades", section:"I — Établissement des bureaux, postes et brigades",
    texte:`L'Administration des douanes est tenue de matérialiser la présence de chaque bureau, poste et brigade de douane par une signalisation appropriée de la mention « Douanes sénégalaises » dont la disposition sur le terrain doit permettre aux usagers l'accomplissement correct de leurs opérations en douane et d'obtempérer aux injonctions qui leurs sont faites, notamment en matière de conduite et de mise en douane.`,
    exemple:"Sur la RN1 entre Dakar et Thiès, un poste de douane doit obligatoirement être signalé par des panneaux visibles portant la mention 'Douanes sénégalaises', placés suffisamment en amont pour permettre aux conducteurs de s'arrêter. L'absence de signalisation appropriée pourrait être invoquée comme circonstance atténuante par un conducteur sanctionné pour défaut d'arrêt.",
    motscles:["signalisation","Douanes sénégalaises","matérialisation","bureaux","postes","brigades","injonctions"] },

  { num:36, titre:"Mise à disposition de locaux administratifs en cas de fraude", chapitre:"II — Organisation des bureaux, postes et brigades", section:"II — Dispositions spéciales",
    texte:`1. Dans le cadre de la lutte contre la fraude et lorsque les circonstances l'exigent, l'autorité administrative locale doit, à la demande du service des douanes, mettre à sa disposition et à titre temporaire les locaux administratifs disponibles, propres à l'établissement des bureaux et à l'hébergement des agents.\n\n2. L'autorité administrative locale doit prendre, sans délai, les mesures nécessaires pour que lesdits locaux soient mis à la disposition des agents des douanes.`,
    exemple:"Lors d'une grande opération anti-contrebande à Tambacounda, le chef de brigade constate que ses locaux sont insuffisants pour traiter les marchandises saisies et héberger les agents renforts. Il sollicite le Préfet du département qui est légalement tenu de mettre immédiatement à disposition une salle de la Préfecture (al.1 et 2) — sans pouvoir refuser ou temporiser.",
    motscles:["locaux administratifs","autorité locale","fraude","mise à disposition","temporaire","hébergement","Préfet"] },

  { num:37, titre:"Protection des agents des douanes — Sauvegarde spéciale de la loi", chapitre:"III — Sauvegarde, obligations et privilèges des agents", section:"",
    texte:`1. Les agents des douanes sont sous la sauvegarde spéciale de la loi.\n\n2. Il est interdit à toute personne :\na) de les maltraiter, diffamer, outrager, menacer et injurier dans l'exercice de leurs fonctions ;\nb) de se livrer sur leur personne à des violences ou voies de fait ;\nc) de s'opposer d'une manière quelconque à l'exercice de leurs fonctions.\n\n3. L'Etat doit protéger les agents contre toute attaque dans l'exercice de leurs fonctions.\n\n4. Les autorités civiles et militaires sont tenues, à la première réquisition, de prêter main-forte aux agents des douanes.\n\n5. Les infractions commises par les agents dans l'exercice de leurs fonctions sont connues des juridictions ordinaires à formation spéciale.`,
    exemple:"Lors d'un contrôle au marché Sandaga, un agent des douanes est insulté et bousculé par un commerçant refusant la vérification. Ce commerçant commet trois infractions simultanées (al.2a, b et c). L'agent peut requérir immédiatement l'assistance de la police (al.4) — obligée d'intervenir. Le commerçant sera jugé devant une juridiction à formation spéciale (al.5). L'État prend en charge la défense de l'agent (al.3).",
    motscles:["sauvegarde","protection agents","violences","opposition fonctions","main-forte","juridictions spéciales","diffamation"] },

  { num:38, titre:"Serment des agents des douanes", chapitre:"III — Sauvegarde, obligations et privilèges des agents", section:"",
    texte:`1. Les agents des douanes de tout grade doivent prêter serment devant le tribunal compétent.\n\n2. La prestation de serment est enregistrée sans frais au greffe du tribunal. L'acte de ce serment est dispensé de timbre et d'enregistrement. Il est transcrit gratuitement sur les commissions d'emploi visées à l'article 39 du présent code.`,
    exemple:"Un jeune inspecteur des douanes fraîchement recruté ne peut pas encore exercer ses fonctions opérationnelles. Il doit obligatoirement prêter serment devant le Tribunal Régional de Dakar (al.1). Ce serment solennel est enregistré gratuitement au greffe, exonéré de tout droit de timbre (al.2). La mention 'a prêté serment' est inscrite sur sa commission d'emploi, document qu'il devra présenter lors de ses contrôles.",
    motscles:["serment","prestation de serment","tribunal compétent","greffe","commission d'emploi","grade","sans frais"] },

  { num:39, titre:"Commission d'emploi — Obligation d'exhiber", chapitre:"III — Sauvegarde, obligations et privilèges des agents", section:"",
    texte:`1. Dans l'exercice de leurs fonctions, les agents des douanes doivent être munis de leur commission d'emploi faisant mention de leur prestation de serment.\n\n2. Ils sont tenus de l'exhiber à la première réquisition.`,
    exemple:"Un agent des douanes en civil effectue un contrôle à Kaolack. Le conducteur d'un véhicule suspect demande à voir ses papiers. L'agent doit immédiatement présenter sa commission d'emploi (al.1 et 2) mentionnant son grade, son affectation et son serment. S'il ne peut la produire, le conducteur est en droit de refuser le contrôle et de porter plainte pour usurpation de fonctions.",
    motscles:["commission d'emploi","prestation de serment","exhibition","première réquisition","exercice fonctions","identification"] },

  { num:40, titre:"Droit au port et à l'usage d'armes des agents des douanes", chapitre:"III — Sauvegarde, obligations et privilèges des agents", section:"",
    texte:`1. Les agents des douanes ont, pour l'exercice de leurs fonctions, le droit au port d'armes.\n\n2. Outre le cas de légitime défense, ils peuvent en faire usage :\na) lorsque des violences ou voies de fait sont exercées contre eux ou lorsqu'ils sont menacés par des individus armés ;\nb) lorsqu'ils ne peuvent immobiliser autrement les véhicules dont les conducteurs n'obtempèrent pas à l'ordre d'arrêt ;\nc) lorsqu'ils ne peuvent autrement s'opposer au passage d'une réunion de personnes ne s'arrêtant pas aux sommations ;\nd) lorsqu'ils ne peuvent capturer vivants les animaux employés pour transporter des marchandises frauduleuses.\n\n3. Les modalités sont définies par décisions du Directeur général des douanes.`,
    exemple:"Sur la RN1, une brigade tente d'intercepter un camion de contrebande. Le conducteur accélère malgré les signaux (al.2b) : les agents peuvent déployer des herses ou tirer dans les pneus. Autre cas : des trafiquants utilisent des ânes chargés de cigarettes ; si les animaux fuient, les agents peuvent les neutraliser (al.2d) pour saisir la marchandise frauduleuse.",
    motscles:["port d'armes","usage d'armes","légitime défense","immobiliser véhicule","sommations","animaux frauduleux","herses"] },

  { num:41, titre:"Obligations de l'agent quittant ses fonctions", chapitre:"III — Sauvegarde, obligations et privilèges des agents", section:"",
    texte:`Tout agent des douanes qui est destitué de son emploi ou qui le quitte est tenu de remettre immédiatement à son administration sa commission d'emploi, les attributs de la tenue, les registres, sceaux, armes et objets d'équipement dont il est chargé pour son service et de rendre ses comptes.`,
    exemple:"Un contrôleur des douanes prend sa retraite. Le jour de cessation de service, il remet immédiatement : sa commission d'emploi, son uniforme complet, son arme de service, les registres de son poste, le sceau officiel du bureau, et tout autre équipement. Il rend aussi ses comptes financiers si son poste comportait des responsabilités comptables. Un agent destitué pour faute doit faire de même dès notification de la décision.",
    motscles:["destitution","cessation de service","commission d'emploi","tenue","armes","registres","sceaux","reddition de comptes"] },

  { num:42, titre:"Interdiction de corruption des agents des douanes", chapitre:"III — Sauvegarde, obligations et privilèges des agents", section:"",
    texte:`Il est interdit aux agents des douanes, sous les peines prévues par le code pénal contre les fonctionnaires publics, de se laisser corrompre.`,
    exemple:"Un importateur propose 500 000 FCFA en espèces à un inspecteur des douanes pour fermer les yeux sur une sous-déclaration de valeur. L'inspecteur qui accepte commet la corruption passive — punie par le Code pénal. Il encourt emprisonnement, amende et révocation. L'importateur est poursuivi pour corruption active. L'agent qui refuse et dénonce l'offre est protégé par la loi.",
    motscles:["corruption","fonctionnaires publics","code pénal","corruption passive","pot-de-vin","interdiction"] },

  { num:43, titre:"Secret professionnel des agents des douanes", chapitre:"III — Sauvegarde, obligations et privilèges des agents", section:"",
    texte:`Sont tenus au secret professionnel dans les conditions et sous les peines prévues par l'article 363 du code pénal, les agents des douanes ainsi que toutes personnes appelées, à l'occasion de leurs fonctions ou de leurs attributions à exercer à quelque titre que ce soit, des fonctions auprès de l'administration des douanes ou à intervenir dans l'application de la législation des douanes.`,
    exemple:"Un vérificateur des douanes effectue un contrôle chez un grand importateur et constate un chiffre d'affaires de 2 milliards FCFA. Il est strictement tenu au secret professionnel (Art. 43 → Art. 363 Code pénal) : il ne peut divulguer ces informations à des concurrents, à la presse ou à sa famille. Un expert-comptable mandaté par la douane pour un audit est soumis au même secret, même après la fin de sa mission.",
    motscles:["secret professionnel","article 363","code pénal","confidentialité","divulgation","informations commerciales"] },

  { num:44, titre:"Communication d'informations — Coopération interadministrative et internationale", chapitre:"III — Sauvegarde, obligations et privilèges des agents", section:"",
    texte:`1. L'administration des douanes est autorisée, sous réserve de réciprocité, à communiquer les informations qu'elle détient en matière de commerce extérieur et de relations financières avec l'étranger aux services des autres départements ministériels et de la BCEAO participant aux missions de service public auxquelles concourt la douane. La communication ne peut être effectuée qu'à des fonctionnaires de hiérarchie A ou assimilés, tenus au secret professionnel.\n\n2. L'administration des douanes est autorisée, sous réserve de réciprocité, à fournir aux autorités qualifiées des pays étrangers tous renseignements, certificats, procès-verbaux et autres documents susceptibles d'établir la violation des lois et règlements à l'entrée ou à la sortie de leur territoire.`,
    exemple:"La BCEAO enquête sur des transferts suspects vers Dubaï. Elle demande à la douane des données sur les importations déclarées (al.1) — transmises uniquement à un fonctionnaire catégorie A de la BCEAO. Parallèlement, les douanes françaises enquêtant sur un trafiquant ayant transité par Dakar peuvent recevoir les procès-verbaux de saisie sénégalais (al.2), sous réserve de réciprocité.",
    motscles:["communication informations","BCEAO","coopération interadministrative","réciprocité","hiérarchie A","pays étrangers","secret professionnel"] },

  { num:45, titre:"Droit de visite des marchandises, moyens de transport et personnes", chapitre:"IV — Pouvoirs des agents des douanes", section:"I — Droit de visite",
    texte:`Pour l'application des dispositions du présent code et en vue de la recherche de la fraude ou pour des raisons de sécurité, les agents des douanes peuvent procéder à la visite des marchandises, des moyens de transport et à celle des personnes, à l'entrée, à la sortie, en transit ou en transbordement.`,
    exemple:"À la frontière de Kidira (Sénégal-Mali), les agents des douanes peuvent légalement : (1) visiter le chargement d'un camion en transit vers Bamako (marchandises) ; (2) inspecter l'habitacle et la carrosserie pour trouver des cachettes (moyen de transport) ; (3) fouiller les bagages à main des passagers (personnes). Ces visites ne nécessitent pas de mandat judiciaire — elles s'exercent de plein droit à l'entrée, à la sortie, en transit et en transbordement.",
    motscles:["droit de visite","marchandises","moyens de transport","personnes","fraude","sécurité","transit","transbordement"] },

  { num:46, titre:"Dépistage des drogues dissimulées dans l'organisme", chapitre:"IV — Pouvoirs des agents des douanes", section:"I — Droit de visite",
    texte:`1. Lorsque des indices sérieux laissent présumer qu'une personne transporte des drogues dissimulées dans son organisme, les officiers de police judiciaire et les fonctionnaires de douanes habilités peuvent saisir les services médicaux en vue de soumettre la personne à des examens médicaux de dépistage.\n\n2. Le refus de se soumettre à l'examen médical est puni d'un emprisonnement de trois (03) mois à un (01) an et d'une amende de 500.000 à 3.000.000 francs, ou de l'une de ces deux peines seulement.\n\n3. Des décisions du Directeur général des douanes déterminent les modalités de mise en œuvre de cette procédure.`,
    exemple:"À l'aéroport Blaise Diagne, un passager en provenance d'Amérique latine transpire abondamment et a le ventre distendu : indices sérieux de transport de cocaïne par ingestion (technique des 'mules'). L'agent saisit le médecin de l'aéroport pour une radio abdominale (al.1). Si le passager refuse l'examen, il encourt jusqu'à 1 an de prison et 3 millions FCFA d'amende (al.2) — peine autonome, indépendante du trafic lui-même.",
    motscles:["drogues","organisme","indices sérieux","examen médical","dépistage","mules","refus","3 mois à 1 an","500.000 à 3.000.000 FCFA"] },

  { num:47, titre:"Obligation d'obtempérer aux injonctions d'arrêt", chapitre:"IV — Pouvoirs des agents des douanes", section:"I — Droit de visite",
    texte:`1. Tout conducteur de moyens de transport doit se soumettre aux injonctions ou signaux d'arrêt des agents des douanes.\n\n2. Ces derniers peuvent faire usage de tous engins ou moyens appropriés pour immobiliser les moyens de transport lorsque les conducteurs n'obtempèrent pas à leurs injonctions ou à leurs signaux.`,
    exemple:"Sur la RN1, des agents lèvent la main et actionnent leur avertisseur lumineux pour ordonner l'arrêt d'un camion. Le chauffeur accélère. Les agents peuvent légalement déployer des herses sur la chaussée ou tirer dans les pneus pour immobiliser le véhicule (al.2). Le refus d'obtempérer constitue en lui-même une infraction douanière grave, aggravant les poursuites.",
    motscles:["injonctions d'arrêt","signaux","immobiliser","herses","refus d'obtempérer","conducteur"] },

  { num:48, titre:"Visite des navires dans la zone maritime et la zone contiguë", chapitre:"IV — Pouvoirs des agents des douanes", section:"I — Droit de visite",
    texte:`Les agents des douanes peuvent visiter tout navire se trouvant dans la zone maritime du rayon des douanes et dans la zone contiguë définie à l'article 30 du présent code et dans les conditions prévues audit article.`,
    exemple:"Un patrouilleur des douanes repère un cargo battant pavillon panaméen ancré à 10 milles marins au large de Dakar (zone maritime du rayon). Les agents montent à bord et inspectent la cargaison sans autorisation judiciaire préalable. Si le même navire est à 20 milles marins (zone contiguë), ils peuvent l'intercepter en cas de suspicion d'infraction aux lois douanières sénégalaises (conditions Art. 30).",
    motscles:["visite navires","zone maritime","rayon des douanes","zone contiguë","patrouilleur","pavillon étranger"] },

  { num:49, titre:"Accès à bord des bâtiments — Droits et obligations", chapitre:"IV — Pouvoirs des agents des douanes", section:"I — Droit de visite",
    texte:`1. Les agents des douanes peuvent aller à bord de tous bâtiments, y compris les navires militaires, dans les ports ou rades ou qui montent ou descendent les fleuves. Ils peuvent y demeurer jusqu'au déchargement ou à la sortie.\n\n2. Les capitaines doivent recevoir les agents, les accompagner et faire ouvrir les écoutilles, chambres, armoires et tous locaux désignés pour la visite.\n\n3. Les agents peuvent retenir les bâtiments dont les capitaines refusent de satisfaire aux prescriptions de l'alinéa 2. En cas de refus d'ouverture, un juge peut être requis — procès-verbal aux frais du capitaine.\n\n4. Les agents peuvent fermer et sceller les écoutilles à la fin de leurs heures légales de travail.\n\n5. Les bâtiments militaires ne peuvent être visités que de jour et sur ordre express du chef de bureau ou de subdivision des douanes.`,
    exemple:"Un cargo turc arrive au Port de Dakar déclaré 'pièces détachées'. Des agents montent à bord (al.1), demandent l'ouverture de la cale (al.2) et trouvent des cigarettes non déclarées. Le capitaine refuse d'ouvrir les autres soutes : les agents font retenir le navire (al.3) et apposent des scellés (al.4) jusqu'au lendemain. Un navire de guerre en escale ne peut être inspecté que de jour sur ordre exprès du chef de bureau (al.5).",
    motscles:["bord des bâtiments","écoutilles","scellés","retenir navire","capitaine","navires militaires","de jour seulement"] },

  { num:50, titre:"Visite des installations du plateau continental et de la ZEE", chapitre:"IV — Pouvoirs des agents des douanes", section:"I — Droit de visite",
    texte:`Les agents des douanes peuvent, à tout moment, visiter les installations et dispositifs du plateau continental et de la zone économique. Ils peuvent également visiter les moyens de transport concourant à leur exploration ou à l'exploitation de leurs ressources naturelles, à l'intérieur des zones de sécurité prévues par la loi et dans la zone maritime du rayon des douanes.`,
    exemple:"Dans le cadre de l'exploitation pétrolière du champ Grand Tortue Ahmeyim (GTA) au large des côtes sénégalo-mauritaniennes, des agents des douanes peuvent inspecter à tout moment les plateformes offshore, les navires de forage et les bateaux ravitailleurs. Ils vérifient que les équipements importés temporairement sous admission temporaire correspondent aux déclarations douanières effectuées.",
    motscles:["plateau continental","ZEE","zone économique exclusive","installations offshore","pétrole","ressources naturelles","exploration","GTA"] },

  { num:51, titre:"Accès aux locaux professionnels — Investigations douanières", chapitre:"IV — Pouvoirs des agents des douanes", section:"I — Droit de visite",
    texte:`1. Les agents des douanes de la hiérarchie A ou B, ainsi que ceux de la hiérarchie C ayant qualité de chef de bureau, de brigade ou de poste, ont accès aux locaux et lieux à usage professionnel, terrains et entrepôts où les marchandises et documents se rapportant à des infractions sont susceptibles d'être détenus, ainsi qu'aux moyens de transport professionnels et leur chargement.\n\n2. Cet accès a lieu entre 08 heures et 18 heures ou, en dehors de ces heures, lorsque l'accès au public est autorisé ou lorsque des activités de production, fabrication, conditionnement, transport, manutention, entreposage ou commercialisation sont en cours.\n\n3. Le respect de ces horaires demeure obligatoire, hormis les cas de visites effectuées après poursuite à vue, ou commencées pendant la journée.\n\n4. Les agents peuvent effectuer un prélèvement d'échantillons et procéder à la retenue de documents pour les besoins de l'enquête ou en prendre copie.`,
    exemple:"Des inspecteurs (grade A) soupçonnent un grossiste de Sandaga d'importer des téléphones contrefaits. Entre 8h et 18h (al.2), ils pénètrent dans son magasin sans mandat (al.1), prélèvent des téléphones suspects (al.4) et photocopient les factures. Si le grossiste travaille encore à 20h (commercialisation en cours), ils peuvent prolonger la visite (al.2). Un chef de brigade catégorie C dispose du même droit d'accès.",
    motscles:["locaux professionnels","hiérarchie A B C","8h-18h","entrepôts","prélèvement échantillons","retenue documents","infractions"] },

  { num:52, titre:"Droit de traversée des propriétés privées et embuscades", chapitre:"IV — Pouvoirs des agents des douanes", section:"I — Droit de visite",
    texte:`1. Lorsque les besoins de leur service l'exigent et s'il n'existe pas de passage public immédiat, les agents des douanes ont le droit de traverser les propriétés privées situées sur le terrain où s'exerce leur action. Ils ont droit d'établir éventuellement des embuscades dans les propriétés privées non clôturées.\n\n2. Le fait d'élever un obstacle ou de refuser de laisser passer les agents des douanes constitue une opposition à l'exercice de leurs fonctions.`,
    exemple:"Des agents pourchassent un convoi de contrebande dans des champs de mil à la périphérie de Diourbel. Aucune route publique ne permet de couper la route aux trafiquants : les agents traversent légalement les champs privés non clôturés (al.1) et se postent en embuscade dans un bosquet appartenant à un particulier. Si un propriétaire installe une barrière ou refuse le passage, il commet une opposition aux fonctions douanières (al.2).",
    motscles:["propriétés privées","traversée","embuscades","non clôturées","opposition fonctions","obstacle","poursuite"] },

  { num:53, titre:"Visites domiciliaires — Conditions et procédures", chapitre:"IV — Pouvoirs des agents des douanes", section:"II — Visites domiciliaires",
    texte:`1. Pour la recherche des marchandises détenues frauduleusement, les agents des douanes habilités peuvent procéder à des visites en tous lieux, même privés, accompagnés d'un OPJ ou, à défaut, du Chef de la circonscription administrative, d'un officier municipal, du Président de communauté rurale, du Chef de village ou du délégué de quartier.\n\n2. Ces visites ne peuvent être commencées avant 04 heures ou après 21 heures, hormis : a) l'assentiment exprès de l'occupant ; b) la visite après poursuite à vue ; c) la visite commencée de jour et poursuivie la nuit. La visite se fait en présence de l'occupant. Un inventaire est annexé au procès-verbal signé par toutes les parties.\n\n3. Les agents peuvent intervenir sans assistance s'il y a consentement de l'occupant ou poursuite à vue.\n\n4. En cas de refus d'ouverture des portes, les agents ne peuvent ouvrir qu'en présence d'une autorité habilitée.\n\n5. Agents habilités : inspecteurs, contrôleurs, chefs de bureaux, brigades ou postes, agents de constatation désignés par arrêté conjoint des Ministres des Finances et de la Justice.`,
    exemple:"Un informateur signale des marchandises de contrebande dans une villa privée de Rufisque (rayon maritime). À 14h, des inspecteurs des douanes (habilités, al.5) se rendent sur place avec un OPJ (al.1). L'occupant refuse d'ouvrir la porte (al.4) : l'OPJ ordonne l'ouverture forcée. On trouve alcools et cigarettes non dédouanés. L'inventaire est annexé au procès-verbal signé par les parties. La visite ne pouvait avoir lieu avant 4h ni après 21h (al.2).",
    motscles:["visites domiciliaires","4h-21h","OPJ","assentiment","inspecteurs","contrôleurs","chef de village","procès-verbal","scellés","inventaire"] },

  { num:54, titre:"Droit de communication — Accès aux documents professionnels", chapitre:"IV — Pouvoirs des agents des douanes", section:"III — Droit de communication",
    texte:`1. Les agents des douanes ayant le grade d'inspecteur, ceux exerçant les fonctions de chef de bureau, de brigade ou de poste et ceux spécialement mandatés, peuvent exiger la communication des documents relatifs aux opérations intéressant leur service dans les gares, compagnies de navigation maritime et aérienne, entreprises de transport routier, agences d'expédition, commissionnaires en douane agréés, concessionnaires d'entrepôts, destinataires ou expéditeurs réels, opérateurs de télécommunications et en général toutes personnes physiques ou morales intéressées aux opérations douanières.\n\n2. Les agents d'un grade inférieur disposent également du droit de communication sur ordre écrit d'un inspecteur.\n\n3. Ces documents doivent être conservés pendant trois (03) ans.\n\n4. Les agents peuvent saisir des documents de toute nature ainsi que des pièces d'identité et passeports propres à faciliter leur mission.`,
    exemple:"Un inspecteur enquête sur une fraude à la valeur impliquant un importateur de climatiseurs. Il exige : (1) de l'armateur, les connaissements originaux ; (2) du commissionnaire en douane, les dossiers des 3 dernières années (al.3) ; (3) d'Orange Money, les relevés de transferts vers le fournisseur chinois (al.1 : opérateurs de télécommunications). L'importateur ne peut refuser. L'inspecteur peut saisir les passeports des dirigeants pour empêcher une fuite (al.4).",
    motscles:["droit de communication","documents","3 ans","commissionnaire","opérateurs télécommunications","saisie documents","passeports","inspecteur"] },

  { num:55, titre:"Contrôle des avantages accordés dans le cadre des CEI", chapitre:"IV — Pouvoirs des agents des douanes", section:"IV — Contrôle des opérations dans le cadre des CEI",
    texte:`L'administration des douanes est habilitée à contrôler sur le territoire douanier les bénéficiaires d'avantages alloués en application de mesures spécifiques arrêtées par les communautés économiques régionales. Ces contrôles sont effectués dans le cadre de l'article 44 alinéa 2 du présent code.`,
    exemple:"Une entreprise sénégalaise bénéficie d'une exonération douanière accordée dans le cadre du Code des Investissements CEDEAO pour ses équipements industriels. Deux ans après l'importation, la douane contrôle que les équipements exonérés sont effectivement utilisés à des fins de production industrielle et non revendus ou détournés à d'autres usages. Ce contrôle peut impliquer une coopération avec les autorités douanières de la CEDEAO (Art. 44 al.2).",
    motscles:["communautés économiques régionales","CEDEAO","avantages","exonération","contrôle","bénéficiaires","mesures spécifiques"] },

  { num:56, titre:"Contrôle douanier des envois par la poste", chapitre:"IV — Pouvoirs des agents des douanes", section:"V — Contrôle douanier des envois par la poste",
    texte:`1. Les fonctionnaires des douanes ont accès aux bureaux de poste, y compris les salles de tri, en correspondance directe avec l'étranger, pour y rechercher, en présence des agents des postes, les envois renfermant ou paraissant renfermer des objets prohibés ou soumis à droits et taxes.\n\n2. Les services de poste sont tenus de soumettre au contrôle douanier les envois frappés de prohibition à l'importation, passibles de droits et taxes ou soumis à des restrictions à l'entrée.\n\n3. Les services de poste sont également tenus de soumettre au contrôle douanier les envois prohibés à l'exportation, passibles de droits et taxes à la sortie.\n\n4. Il ne peut, en aucun cas, être porté atteinte au secret des correspondances.`,
    exemple:"Un colis des Pays-Bas arrive au Centre de Tri Postal de Dakar, déclaré 'vêtements' mais de poids anormal. Les agents de La Poste alertent les douanes. Les fonctionnaires accèdent à la salle de tri en présence des agents postaux (al.1) et ouvrent le colis (al.2) : il contient des médicaments prohibés. Nota bene : le secret des correspondances (al.4) protège les lettres et courriers, mais pas les colis contenant des marchandises soumises aux droits et taxes.",
    motscles:["bureaux de poste","salle de tri","envois","secret des correspondances","prohibition","droits et taxes","colis","agents postaux"] },

  { num:57, titre:"Contrôle d'identité dans le territoire douanier", chapitre:"IV — Pouvoirs des agents des douanes", section:"VI — Vérification d'identité",
    texte:`Les agents des douanes peuvent contrôler l'identité des personnes qui entrent dans le territoire douanier ou qui en sortent, ou qui circulent dans le rayon des douanes.`,
    exemple:"Au poste-frontière de Rosso (Sénégal-Mauritanie), les agents des douanes peuvent demander leurs pièces d'identité aux voyageurs. Ce contrôle est distinct du contrôle de police et peut être exercé indépendamment de toute suspicion d'infraction douanière. Il permet de croiser les informations avec les listes de personnes recherchées pour fraude douanière ou de contrôler les mouvements dans le rayon des douanes (60 km depuis la frontière).",
    motscles:["contrôle d'identité","entrée","sortie","rayon des douanes","pièces d'identité","frontière"] },

  { num:58, titre:"Livraisons surveillées", chapitre:"IV — Pouvoirs des agents des douanes", section:"VII — Livraisons surveillées",
    texte:`1. Afin de constater les délits douaniers dont la peine maximale est égale ou supérieure à deux (02) ans d'emprisonnement, les agents des douanes habilités par le Ministre chargé des finances, après information du Directeur général des douanes et sauf opposition de celui-ci, peuvent procéder à la surveillance de personnes soupçonnées d'être auteurs d'un délit douanier ou d'y avoir participé comme complices ou intéressés à la fraude.\n\n2. Les mêmes dispositions sont applicables pour la surveillance de l'acheminement ou du transport des objets, biens ou produits tirés de ces infractions ou servant à les commettre.\n\n3. L'information préalable au Directeur général doit être donnée par tout moyen.`,
    exemple:"Des agents des douanes ont identifié un réseau de trafic de faux billets importés du Nigéria. Plutôt que de saisir immédiatement la première livraison, ils pratiquent une livraison surveillée (al.1) : ils laissent le colis parvenir à destination sous surveillance discrète, afin d'identifier tous les membres et démanteler l'organisation complète. Cette technique est autorisée car le trafic de faux billets est puni de plus de 2 ans. Le Directeur général est informé préalablement (al.3).",
    motscles:["livraisons surveillées","délits douaniers","2 ans d'emprisonnement","Directeur général","surveillance réseau","techniques d'enquête"] },

  { num:59, titre:"Opération d'infiltration", chapitre:"IV — Pouvoirs des agents des douanes", section:"VIII — Infiltration",
    texte:`1. Le procureur de la République peut autoriser, sous son contrôle, une opération d'infiltration pour constater des infractions douanières. L'infiltration consiste, pour un agent spécialement habilité, à surveiller des personnes suspectées en se faisant passer pour un de leurs coauteurs, complices ou intéressés à la fraude, en utilisant une identité d'emprunt.\n\n2. Les agents autorisés peuvent sans responsabilité pénale : acquérir, détenir, transporter, livrer des substances ou biens tirés des infractions ; mettre à disposition des personnes impliquées des moyens de transport, d'hébergement ou de télécommunication.\n\n3. L'autorisation est délivrée par écrit, motivée, pour une durée maximale de quatre (04) mois, renouvelable.\n\n4. L'identité réelle de l'agent infiltré ne doit apparaître à aucun stade de la procédure. Sa révélation est punie de 5 ans d'emprisonnement et 20.000.000 FCFA d'amende (jusqu'à 10 ans et 30.000.000 FCFA en cas de mort).\n\n5. Aucune condamnation ne peut être prononcée sur le seul fondement des déclarations d'agents infiltrés (sauf dépôt sous véritable identité).\n\n6. L'agent sous la responsabilité duquel se déroule l'opération peut seul être entendu comme témoin.\n\n7. Possibilité d'infiltration transfrontalière avec accord du Ministre de la Justice.`,
    exemple:"Le Procureur autorise (par écrit, al.3) une opération de 4 mois pour démanteler un réseau de trafic d'ivoire à Dakar. Un inspecteur habilité (al.1) prend une fausse identité, rencontre les trafiquants, assiste à des transactions illicites sans responsabilité pénale (al.2). À l'issue, les trafiquants sont arrêtés. L'agent témoigne sous pseudonyme (al.4 et 6). Une condamnation ne peut reposer sur ses seules déclarations (al.5) — des éléments objectifs sont nécessaires.",
    motscles:["infiltration","identité d'emprunt","procureur","4 mois","agent infiltré","secret identité","20.000.000 FCFA","révélation identité","transfrontalière"] },

  { num:60, titre:"Incitation à la vente dans le cadre de l'infiltration", chapitre:"IV — Pouvoirs des agents des douanes", section:"IX — Incitation à la vente",
    texte:`1. Dans le cadre de l'opération d'infiltration, peut être autorisée l'incitation à la vente illicite de marchandises frauduleuses par un agent des douanes intervenant directement ou par l'intermédiaire d'une personne agissant conformément à ses instructions.\n\n2. La provocation à l'achat illicite émanant directement de l'agent infiltré ou par l'intermédiaire d'une personne agissant conformément à ses instructions est interdite, sous peine de poursuite du chef du délit d'incitation et de nullité de la procédure établie à cet effet.`,
    exemple:"Dans l'opération d'infiltration sur le réseau d'ivoire, l'agent infiltré peut légalement inciter les trafiquants à lui vendre de l'ivoire (al.1 : incitation à la VENTE autorisée). Mais il lui est strictement interdit de leur proposer lui-même de l'ivoire à acheter (al.2 : provocation à l'ACHAT interdite). Cette distinction cruciale : si l'agent provoque l'achat, toute la procédure est nulle et les trafiquants relaxés. La règle : l'agent stimule la vente, il ne crée pas artificiellement le crime.",
    motscles:["incitation à la vente","provocation à l'achat","infiltration","interdit","nullité de procédure","marchandises frauduleuses","distinction vente/achat"] },

  { num:61, titre:"Contrôle des voyageurs et de leurs bagages", chapitre:"IV — Pouvoirs des agents des douanes", section:"X — Contrôle des voyageurs et bagages",
    texte:`1. La visite des voyageurs et de leurs bagages ne peut être effectuée que dans les lieux désignés à cet effet par le service des douanes.\n\n2. La conduite des bagages sur les lieux de visite incombe au voyageur ou au transporteur dont il utilise les services.\n\n3. L'ouverture des bagages est effectuée sous la responsabilité du voyageur ou de son mandataire.\n\n4. En cas de refus d'ouverture, les agents des douanes peuvent demander l'assistance d'un OPJ, de l'autorité administrative ou locale, ou procéder à l'ouverture en présence du transporteur. Procès-verbal aux frais du voyageur.\n\n5. Les bagages conduits sur les lieux de visite depuis plus de huit (08) jours et non vérifiés en raison de l'absence du voyageur sont constitués d'office en dépôt (Art. 252).\n\n6. Les bagages ne peuvent être enlevés sans autorisation du service des douanes.`,
    exemple:"À l'aéroport Blaise Diagne, dans la zone douanière désignée (al.1), une voyageuse en provenance de Dubaï refuse d'ouvrir son bagage à main (al.4) : les agents appellent un OPJ qui ordonne l'ouverture forcée aux frais de la voyageuse — des bijoux en or non déclarés sont découverts. Un passager ayant raté son vol oublie sa valise en zone douane : après 8 jours sans réclamation (al.5), la douane constitue la valise en dépôt officiel (Art. 252). Aucun bagage ne peut être sorti sans visa douanier (al.6).",
    motscles:["voyageurs","bagages","lieux désignés","refus d'ouverture","OPJ","8 jours","dépôt","autorisation","procès-verbal","frais du voyageur"] },
];

/* ===================== DATA: TITRE III — ARTICLES 62–93 COMPLETS ===================== */
const TITRE3_ARTICLES = [
  { num:62, titre:"Manifeste maritime — Contenu et obligations", chapitre:"I — Importation", section:"I §I — Transport maritime (Dispositions générales)",
    texte:`1. Les marchandises arrivant par voie maritime doivent être inscrites sur le manifeste ou état général du chargement du navire.\n\n2. Le manifeste doit être daté et signé par le capitaine du navire ou son représentant. Il doit comporter des indications suffisantes pour établir l'espèce, la qualité et les prohibitions éventuelles relatives aux marchandises, notamment :\n— le nombre de colis ;\n— les marques et numéros desdits colis ;\n— la nature des marchandises ;\n— les lieux de chargement et de destination.\n\n3. Le Directeur général des douanes peut, en tant que de besoin, modifier la liste desdites indications.\n\n4. Il est interdit de présenter comme unité, dans le même manifeste, plusieurs colis fermés, réunis de quelque manière que ce soit.`,
    exemple:"Un cargo MSC arrive au Port de Dakar avec 450 conteneurs. Son manifeste, signé par le capitaine (al.2), liste pour chaque conteneur : le nombre de colis, les marques (ex. MSCU1234567), la nature des marchandises (ex. 'riz en sacs de 50 kg') et les ports de chargement (Marseille) et de destination (Dakar). Si un chargeur a regroupé 5 cartons fermés dans un seul lot déclaré comme une unité au manifeste, cela constitue une infraction à l'al.4 — chaque colis fermé doit être individuellement listé.",
    motscles:["manifeste","état général de chargement","capitaine","nombre de colis","marques","nature marchandises","ports de chargement","ports de destination"] },

  { num:63, titre:"Voies d'accès des navires aux eaux intérieures", chapitre:"I — Importation", section:"I §I — Transport maritime (Dispositions générales)",
    texte:`1. Il est interdit aux navires et embarcations de toute sorte de pénétrer dans les eaux intérieures autrement que par les estuaires, passes ou rivières conduisant au premier bureau ou poste de douane.\n\n2. Dans le cas où plusieurs voies navigables également directes conduisent à un même bureau, la voie autorisée est indiquée par arrêté du Ministre chargé des Finances.`,
    exemple:"Un bateau de pêche artisanal en provenance de la Guinée-Bissau tente de remonter un bras secondaire du fleuve Casamance pour éviter le contrôle douanier de Ziguinchor. C'est illégal (al.1) : les navires doivent impérativement passer par les voies navigables officielles menant directement au premier bureau de douane. Si deux chenaux conduisent tous deux au Bureau de Douane de Ziguinchor, le Ministre des Finances désigne par arrêté celui qui est autorisé (al.2).",
    motscles:["eaux intérieures","estuaires","passes","rivières","bureau de douane","voies navigables","arrêté Ministre"] },

  { num:64, titre:"Obligation d'accostage dans les ports pourvus d'un bureau de douane", chapitre:"I — Importation", section:"I §I — Transport maritime (Dispositions générales)",
    texte:`Sauf cas de force majeure dûment justifié, les navires ne peuvent accoster que dans les ports pourvus d'un bureau de douane.`,
    exemple:"Un navire marchand en provenance du Maroc décide d'accoster à Joal-Fadiouth pour décharger une partie de sa cargaison, alors que ce port n'est pas doté d'un bureau de douane permanent. C'est interdit par l'article 64 : le navire doit obligatoirement se rendre au Port de Dakar ou à un autre port douanier agréé. Exception : si le navire est en perdition (tempête, avarie grave), il peut accoster en urgence à tout port et en justifier — c'est le cas de force majeure.",
    motscles:["accostage","ports douaniers","bureau de douane","force majeure","obligation","navires marchands"] },

  { num:65, titre:"Pirogues et petites embarcations — Formalités simplifiées", chapitre:"I — Importation", section:"I §I — Transport maritime (Dispositions générales)",
    texte:`Les pirogues et autres embarcations de moins de dix (10) tonneaux de jauge brute sont tenues de présenter leur chargement au bureau ou poste de douane le plus voisin du lieu de leur provenance pour y accomplir les formalités exigées et recevoir un récépissé.\n\nSont dispensés de cette obligation, les bateaux et pirogues de nationalité sénégalaise se livrant à la pêche et dont les opérations ne sont soumises à aucune formalité de douane.`,
    exemple:"Une pirogue gambienne de 5 tonneaux arrive à Saint-Louis chargée de pagnes et de produits artisanaux. Elle doit impérativement se présenter au poste de douane de Saint-Louis le plus proche pour déclarer son chargement et obtenir un récépissé de dédouanement. En revanche, une pirogue sénégalaise de Saint-Louis qui revient de la mer avec sa pêche du jour (poissons frais) est totalement dispensée de ces formalités — la pêche artisanale sénégalaise n'est soumise à aucune formalité douanière.",
    motscles:["pirogues","embarcations","10 tonneaux","jauge brute","récépissé","pêche artisanale","dispense","formalités"] },

  { num:66, titre:"Débarquement — Lieux autorisés et autorisations exceptionnelles", chapitre:"I — Importation", section:"I §I — Transport maritime (Dispositions générales)",
    texte:`1. Le débarquement des navires ne peut avoir lieu que sur les quais des ports où les bureaux de douane sont établis.\n\n2. Sur la demande des intéressés et à leurs frais, les autorisations exceptionnelles de débarquement et de transbordement peuvent être accordées en dehors des lieux et heures fixés par arrêté du Ministre chargé des finances.\n\n3. Les indemnités pour frais de surveillance et les modalités de délivrance des autorisations exceptionnelles sont fixées par arrêté du Ministre chargé des finances.`,
    exemple:"Un importateur de matériaux de construction reçoit un grand cargo qui doit décharger le week-end, alors que le bureau de douane ferme à 17h et que les quais ordinaires sont saturés. Il peut demander une autorisation exceptionnelle de débarquement hors heures (al.2) à ses propres frais : il devra payer les indemnités de surveillance des agents des douanes dépêchés spécialement (al.3), dont les montants sont fixés par arrêté du Ministre des Finances.",
    motscles:["débarquement","quais","ports","autorisation exceptionnelle","frais de surveillance","hors heures","transbordement","Ministre des Finances"] },

  { num:67, titre:"Navires de la Marine militaire — Assujettissement aux formalités", chapitre:"I — Importation", section:"I §I — Transport maritime (Dispositions générales)",
    texte:`Les commandants des navires de la Marine militaire sont tenus de remplir à l'entrée, toutes les formalités auxquelles sont assujettis les capitaines des navires marchands.`,
    exemple:"Un navire de la Marine nationale sénégalaise rentre d'une mission au Gabon avec à son bord des équipements militaires et des marchandises pour l'équipage. Son commandant doit, comme tout capitaine de navire marchand, déposer un manifeste au bureau de douane, déclarer la cargaison et soumettre le navire à la visite douanière. L'appartenance à la Marine nationale ne confère aucune immunité douanière, conformément au principe de l'article 3 al.2 du Code des Douanes.",
    motscles:["Marine militaire","commandants","navires militaires","formalités","navires marchands","égalité de traitement","manifeste"] },

  { num:68, titre:"Manifeste maritime — Support papier ou électronique", chapitre:"I — Importation", section:"I §I — Transport maritime (Dispositions spécifiques)",
    texte:`Le manifeste peut se présenter sur support papier ou électronique.`,
    exemple:"Depuis la dématérialisation des procédures douanières via le système GAINDE, les armateurs et consignataires ont le choix entre déposer le manifeste CARGO sous forme papier au guichet du bureau de douane, ou le télécharger électroniquement sur la plateforme de dépôt en ligne connectée au système GAINDE 2000. En pratique, depuis la décision du DGD sur la date de basculement (Art. 91), le manifeste électronique est devenu la norme pour les navires de commerce, le papier étant une alternative de secours.",
    motscles:["manifeste","support papier","support électronique","GAINDE","dématérialisation","consignataire","armateur"] },

  { num:69, titre:"Manifeste électronique — Obligations du capitaine à l'arrivée", chapitre:"I — Importation", section:"I §I — Transport maritime (A — Manifeste électronique)",
    texte:`1. Le capitaine d'un navire arrivé dans la zone maritime du rayon des douanes doit, à la première réquisition du service des douanes :\na. mettre les agents des douanes en mesure de consulter utilement le manifeste électronique ;\nb. soumettre si possible, le manifeste électronique au visa des agents des douanes qui se rendent à bord.`,
    exemple:"Un navire porte-conteneurs arrive à l'entrée de la rade de Dakar (dans la zone maritime du rayon des douanes). Un inspecteur des douanes monte à bord et demande à consulter le manifeste électronique. Le capitaine doit immédiatement lui donner accès au terminal informatique de bord pour consultation (al.1a) et, si le système le permet, soumettre le fichier électronique au visa numérique des agents (al.1b). Si l'accès informatique est impossible pour raison technique, le capitaine doit le justifier.",
    motscles:["manifeste électronique","zone maritime","rayon des douanes","première réquisition","consultation","visa électronique","capitaine"] },

  { num:70, titre:"Délais de chargement et d'enregistrement du manifeste électronique", chapitre:"I — Importation", section:"I §I — Transport maritime (A — Manifeste électronique)",
    texte:`Le capitaine du navire ou son représentant doit, quarante huit (48) heures avant l'arrivée du navire, télécharger le manifeste électronique dans la plate-forme prévue à cet effet.\n\nAu plus tard, vingt quatre (24) heures après l'arrivée du navire et sous peine de sanctions, le capitaine du navire ou son représentant doit enregistrer le manifeste CARGO dans le système de dédouanement du service des douanes.\n\nEn cas d'inaction du consignataire au-delà d'un délai de trente six (36) heures après l'arrivée du navire, la plate-forme de téléchargement transfère automatiquement le manifeste dans le système de dédouanement, pour enregistrement.\n\nLes demandes de transfert peuvent être effectuées avant l'arrivée du navire, dans les conditions fixées par décision du Directeur général des douanes.`,
    exemple:"Le MSC Dakar est attendu au Port de Dakar le lundi à 8h00. Son consignataire doit : (1) télécharger le manifeste électronique sur la plateforme GAINDE au plus tard le samedi à 8h00 (48h avant, al.1) ; (2) enregistrer le manifeste CARGO dans le système douanier au plus tard le mardi à 8h00 (24h après arrivée, al.2) sous peine de sanctions. Si le consignataire est inactif jusqu'au mardi à 20h00 (36h après arrivée), la plateforme transfère automatiquement le manifeste pour enregistrement (al.3) — protection contre les blocages.",
    motscles:["48 heures avant","24 heures après","36 heures","manifeste CARGO","téléchargement","enregistrement","plateforme","consignataire","GAINDE","sanctions automatiques"] },

  { num:71, titre:"Dépôt physique du manifeste CARGO signé", chapitre:"I — Importation", section:"I §I — Transport maritime (A — Manifeste électronique)",
    texte:`Le capitaine du navire ou son représentant est tenu de déposer, huit (08) jours francs après l'arrivée du navire, une copie physique du manifeste CARGO signé, auprès du service des douanes.`,
    exemple:"Le cargo MV Teranga arrive au Port de Dakar un lundi. Malgré le dépôt électronique déjà effectué (Art. 70), le capitaine ou son représentant (souvent le consignataire) doit également remettre physiquement au bureau de douane du port une copie papier du manifeste CARGO dûment signée, et ce au plus tard le mardi de la semaine suivante (8 jours francs). Cette copie physique constitue la preuve matérielle de la déclaration et permet l'archivage papier des dossiers douaniers.",
    motscles:["8 jours francs","copie physique","manifeste CARGO signé","dépôt physique","représentant","consignataire","archivage"] },

  { num:72, titre:"Manifeste papier — Visa et remise d'une copie", chapitre:"I — Importation", section:"I §I — Transport maritime (B — Manifeste sur support papier)",
    texte:`1. Le capitaine d'un navire arrivé dans la zone maritime du rayon des douanes doit, à la première réquisition du service des douanes :\na. soumettre l'original du manifeste au visa « ne varietur » des agents des douanes qui se rendent à bord ;\nb. leur remettre une copie du manifeste.`,
    exemple:"Un cargo battant pavillon libérien arrive en rade de Dakar avec un manifeste papier. Des agents des douanes montent à bord et demandent le manifeste. Le capitaine doit : (a) présenter l'original signé pour que les agents y apposent le visa 'ne varietur' (expression latine signifiant 'qu'il ne soit pas modifié' — le document est ainsi figé, toute modification ultérieure constitue une fraude documentaire) ; (b) remettre une copie aux agents pour le dossier de la douane. L'original reste à bord.",
    motscles:["manifeste papier","visa ne varietur","original","copie","première réquisition","agents à bord","fraude documentaire"] },

  { num:73, titre:"Journal de bord — Présentation obligatoire à l'entrée au port", chapitre:"I — Importation", section:"I §I — Transport maritime (B — Manifeste sur support papier)",
    texte:`A son entrée dans le port, le capitaine est tenu de présenter le journal de bord au visa des agents des douanes.`,
    exemple:"À l'entrée du Port de Dakar, avant tout déchargement, le capitaine du navire grec 'Athena' doit présenter son journal de bord (livre de bord) aux agents des douanes. Ce document maritime chronologique enregistre tous les événements du voyage : escales effectuées, positions journalières, conditions météo, incidents survenus. Les douaniers vérifient ainsi la concordance entre le trajet déclaré et les escales réelles — une escale non déclarée pouvant indiquer un chargement clandestin de marchandises.",
    motscles:["journal de bord","livre de bord","visa","entrée au port","escales","concordance","capitaine"] },

  { num:74, titre:"Déclaration sommaire maritime — Délai et documents requis", chapitre:"I — Importation", section:"I §I — Transport maritime (B — Manifeste sur support papier)",
    texte:`1. Dans les vingt-quatre (24) heures après l'arrivée du navire dans le port, le capitaine doit déposer au bureau de douane :\na) À titre de déclaration sommaire :\n— le manifeste de la cargaison avec, le cas échéant, sa traduction authentique dans la langue officielle en usage au Sénégal ;\n— les manifestes spéciaux des provisions de bord et des marchandises de pacotille appartenant aux membres de l'équipage ;\nb) les chartes-parties ou connaissements, actes de nationalité et tous autres documents exigés par la douane.\nLes navires étrangers sont dispensés du dépôt de l'acte de nationalité ; ils sont seulement tenus de le présenter au bureau de douane.\n\n2. La déclaration sommaire doit être déposée même lorsque les navires sont sur lest.`,
    exemple:"Le cargo 'Dakar Express' en provenance de Valence (Espagne) arrive au Port de Dakar le lundi à 14h. Son capitaine doit déposer au bureau de douane avant le mardi à 14h (24h après, al.1) : le manifeste de cargaison en français ou avec traduction authentique, le manifeste des provisions de bord (vivres, carburant), la liste des marchandises de pacotille de l'équipage (effets personnels, petits achats), et les connaissements (B/L). Si le navire arrive à vide (sur lest, sans marchandises), la déclaration sommaire reste obligatoire (al.2) — même un navire vide doit se déclarer.",
    motscles:["déclaration sommaire","24 heures","manifeste cargaison","connaissements","chartes-parties","pacotille","acte de nationalité","sur lest","traduction authentique"] },

  { num:75, titre:"Transport fluvial — Manifeste obligatoire", chapitre:"I — Importation", section:"I §II — Transport fluvial",
    texte:`Aucune marchandise ne peut être importée par fleuves, rivières, lacs ou canaux sans un manifeste daté et signé du préposé conducteur.`,
    exemple:"Une embarcation qui remonte le fleuve Sénégal depuis la Mauritanie avec des marchandises (céréales, tissus) doit obligatoirement être accompagnée d'un manifeste daté et signé par le conducteur de l'embarcation. Si les agents des douanes interceptent l'embarcation à Podor ou à Matam sans que ce manifeste soit présent, la cargaison est considérée comme importée sans titre régulier — infraction douanière caractérisée entraînant la saisie des marchandises.",
    motscles:["transport fluvial","fleuves","rivières","lacs","canaux","manifeste","préposé conducteur","importation fluviale"] },

  { num:76, titre:"Déclaration sommaire fluviale — Délai de 24 heures", chapitre:"I — Importation", section:"I §II — Transport fluvial",
    texte:`Dans les vingt-quatre (24) heures qui suivent l'arrivée de l'embarcation, le préposé conducteur doit déposer au bureau de douane, à titre de déclaration sommaire, le manifeste de cargaison.`,
    exemple:"Une pirogue motorisée en provenance du Mali arrive à l'embarcadère de Kayes-Sénégal sur le fleuve Sénégal. Dans les 24 heures suivant son accostage, le conducteur de l'embarcation doit se rendre au poste de douane le plus proche et y déposer le manifeste de cargaison comme déclaration sommaire. Ce délai de 24 heures est le même que pour le transport maritime (Art. 74) — uniformité de traitement quelle que soit la voie de transport fluviale.",
    motscles:["déclaration sommaire","24 heures","embarcation","conducteur","manifeste de cargaison","transport fluvial","poste de douane"] },

  { num:77, titre:"Contrôle des embarcations assurant le trafic avec les États voisins", chapitre:"I — Importation", section:"I §II — Transport fluvial",
    texte:`Les embarcations assurant un trafic avec les Etats voisins du Sénégal ne peuvent sortir des ports fluviaux sans se soumettre au contrôle du service des douanes.`,
    exemple:"Des pirogues et bateaux qui font la navette entre les ports fluviaux sénégalais et guinéens ou maliens (sur le fleuve Gambie ou le fleuve Sénégal) ne peuvent quitter le quai sans avoir présenté leur cargaison aux agents des douanes pour contrôle. Cela vaut aussi bien pour les départs que pour les arrivées. Un conducteur qui tente de partir discrètement sans contrôle commet une tentative d'exportation sans déclaration, punissable selon le Titre XII.",
    motscles:["embarcations","trafic avec États voisins","ports fluviaux","sortie","contrôle douanier","fleuve Sénégal","fleuve Gambie"] },

  { num:78, titre:"Renvoi aux règles maritimes pour le transport fluvial", chapitre:"I — Importation", section:"I §II — Transport fluvial",
    texte:`Les autres mesures prévues dans le cadre du transport par mer sont également applicables au transport fluvial.`,
    exemple:"Les règles sur l'obligation d'accoster dans des points de contrôle douanier (Art. 64), la prohibition d'emprunter des voies non autorisées (Art. 63), les débarquements uniquement dans des zones agréées (Art. 66) s'appliquent toutes au transport fluvial. Ainsi, une embarcation remontant le fleuve Sénégal depuis la Mauritanie ne peut décharger ses marchandises que dans des embarcadères autorisés et avec présence de la douane — mêmes règles que pour un navire maritime.",
    motscles:["renvoi","transport par mer","applicabilité","transport fluvial","embarcadères","règles communes"] },

  { num:79, titre:"Transport terrestre — Route légale et obligation de mise en douane", chapitre:"I — Importation", section:"I §III — Transport terrestre",
    texte:`1. Toutes les marchandises importées par les frontières terrestres doivent être aussitôt conduites à l'unité de douane la plus proche par la route la plus directe, dite route légale, désignée par arrêté du Ministre chargé des finances.\n\n2. Elles ne peuvent être introduites dans les maisons ou autres bâtiments avant d'avoir été conduites au bureau ou poste de douane ; elles ne peuvent dépasser ceux-ci sans permis.`,
    exemple:"Un camion chargé de ciment provenant de la Mauritanie franchit la frontière à Rosso. Il doit impérativement prendre la route nationale désignée par arrêté du Ministre (la 'route légale', al.1) jusqu'au Bureau de Douane de Rosso — pas question de faire un détour par des pistes secondaires. Avant d'arriver à ce bureau, le conducteur ne peut décharger ni entreposer quoi que ce soit dans un bâtiment (al.2). Dépasser le bureau de douane sans autorisation constitue une infraction douanière grave.",
    motscles:["transport terrestre","route légale","unité de douane","frontières terrestres","bâtiments","permis","route directe","arrêté Ministre"] },

  { num:80, titre:"Lettre de voiture — Déclaration sommaire terrestre", chapitre:"I — Importation", section:"I §III — Transport terrestre",
    texte:`1. Tout conducteur de marchandises doit, dès son arrivée au bureau ou poste de douane d'entrée, remettre au service des douanes à titre de déclaration sommaire, une lettre de voiture indiquant les objets qu'il transporte.\n\n2. La déclaration sommaire n'est pas exigée si les marchandises sont déclarées en détail dès leur arrivée au bureau ou au poste de douane.\n\n3. Les marchandises qui arrivent après la fermeture du bureau ou poste de douane sont déposées sans frais dans les dépendances dudit bureau ou poste jusqu'au moment de son ouverture ; dans ce cas, la déclaration sommaire doit être remise au service des douanes dès l'ouverture du bureau ou poste, si les marchandises ne sont pas déclarées immédiatement en détail.\n\n4. Les mesures prévues aux articles 62, 68 et 69, dans le cadre du transport par mer sont également applicables en tant que de besoin au transport terrestre.`,
    exemple:"Un camionneur malien arrive au Bureau de Douane de Kidira à 9h avec 20 tonnes de coton. Il remet immédiatement la lettre de voiture (document routier international CMR ou lettre de transport local) au service des douanes — c'est sa déclaration sommaire (al.1). Si le commissionnaire en douane est là et prêt à déposer la déclaration en détail immédiatement, la déclaration sommaire est dispensée (al.2). S'il arrive à 19h (bureau fermé à 16h), il dépose la marchandise dans la cour du bureau sans frais (al.3) et remet la lettre de voiture dès 8h le lendemain.",
    motscles:["lettre de voiture","déclaration sommaire terrestre","conducteur","bureau d'entrée","fermeture bureau","dépôt sans frais","CMR","déclaration en détail immédiate"] },

  { num:81, titre:"Transport aérien — Route aérienne et aéroports douaniers", chapitre:"I — Importation", section:"I §IV — Transport aérien",
    texte:`1. Les aéronefs qui effectuent un parcours international doivent, pour franchir la frontière, suivre la route aérienne qui leur est imposée.\n\n2. Ils ne peuvent se poser que sur les aéroports douaniers sauf cas de force majeure dûment justifié.`,
    exemple:"Un Boeing 737 cargo de la compagnie Air Arabia en provenance de Casablanca doit impérativement suivre la route aérienne attribuée par le contrôle aérien (ASECNA) pour entrer dans l'espace aérien sénégalais (al.1) et atterrir uniquement à l'Aéroport International Blaise Diagne de Diass ou à l'aéroport de Ziguinchor — tous deux aéroports douaniers (al.2). Un atterrissage sur la piste privée d'une exploitation agricole serait une violation grave du Code des Douanes, sauf avarie grave de l'aéronef (force majeure).",
    motscles:["transport aérien","route aérienne","aéronefs internationaux","aéroports douaniers","force majeure","frontière aérienne","ASECNA"] },

  { num:82, titre:"Manifeste aérien et obligations du commandant de bord", chapitre:"I — Importation", section:"I §IV — Transport aérien",
    texte:`1. Les marchandises transportées par aéronef doivent être inscrites sur un manifeste daté et signé par le commandant de l'appareil ; ce document doit être établi dans les mêmes conditions que celles prévues pour les navires par l'article 62 du présent code.\n\n2. Sauf dispositions contraires, le commandant de l'aéronef est soumis, mutatis mutandis, aux mêmes obligations que le capitaine du navire, conformément aux dispositions des articles 69, 70, 72 et 74 du présent code.\n\n3. Il est tenu de remettre à la première réquisition des agents des douanes, le manifeste passager, celui des pacotilles et tout autre document utile au contrôle.`,
    exemple:"Un avion cargo DHL atterrit à l'aéroport Blaise Diagne avec 15 tonnes de colis. Le commandant de bord doit présenter un manifeste aérien (AWB — Air Waybill collectif) daté et signé, conforme aux mêmes exigences que le manifeste maritime de l'Art. 62 (al.1). Il est soumis aux mêmes délais de dépôt électronique que le capitaine de navire (Art. 70 appliqué 'mutatis mutandis', al.2). Si un agent des douanes monte à bord, le commandant doit immédiatement présenter le manifeste passagers et la liste des bagages d'équipage (al.3).",
    motscles:["manifeste aérien","AWB","commandant de bord","mutatis mutandis","manifeste passagers","pacotilles","obligations aériennes","articles 69 70 72 74"] },

  { num:83, titre:"Interdiction de débarquement en cours de route — Exception de sauvetage", chapitre:"I — Importation", section:"I §IV — Transport aérien",
    texte:`1. Sont interdits tous débarquements et jets de marchandises en cours de route.\n\n2. Toutefois, le commandant de l'aéronef a le droit de faire jeter en cours de route le lest, ainsi que les marchandises chargées dont le jet est indispensable au salut de l'aéronef.`,
    exemple:"Un avion cargo en route de Dakar vers Abidjan ne peut, en aucun cas, larguer des colis ou atterrir dans une ville intermédiaire non prévue pour décharger discrètement des marchandises (al.1 : toute introduction clandestine de marchandises dans un territoire est ainsi prévenue). Exception vitale (al.2) : si l'avion perd un moteur et risque de s'écraser, le commandant peut légalement jeter du fret par-dessus bord pour réduire le poids et sauver l'appareil — c'est une nécessité de sauvetage reconnue par le Code.",
    motscles:["débarquement en cours de route","jet de marchandises","interdit","lest","sauvetage de l'aéronef","force majeure aérienne","commandant"] },

  { num:84, titre:"Aéronefs militaires — Soumission aux formalités commerciales", chapitre:"I — Importation", section:"I §IV — Transport aérien",
    texte:`Les commandants des aéronefs militaires sont tenus de remplir à l'entrée toutes les formalités auxquelles sont assujettis les commandants d'aéronefs commerciaux.`,
    exemple:"Un avion de transport militaire C-130 de l'Armée de l'Air sénégalaise rentre d'une mission au Mali avec des équipements et approvisionnements. Son commandant doit remplir exactement les mêmes formalités douanières qu'un Boeing cargo commercial : présenter le manifeste, soumettre la cargaison au contrôle douanier, déclarer les provisions de bord. Le statut militaire de l'aéronef ne lui confère aucune exemption des formalités douanières à l'entrée du territoire.",
    motscles:["aéronefs militaires","commandants militaires","formalités commerciales","égalité de traitement","C-130","Armée de l'Air","exemption"] },

  { num:85, titre:"Débarquements et transbordements aériens — Renvoi à l'article 66", chapitre:"I — Importation", section:"I §IV — Transport aérien",
    texte:`Les dispositions des alinéas 1 et 2 de l'article 66 du présent code concernant les débarquements et transbordements sont applicables aux transports effectués par la voie aérienne.`,
    exemple:"Comme pour le transport maritime (Art. 66), les débarquements de fret aérien ne peuvent avoir lieu qu'à l'aéroport douanier (équivalent aérien des 'quais des ports'). Un opérateur qui souhaite décharger un avion-cargo de nuit ou dans un hangar non désigné par la douane doit demander une autorisation exceptionnelle (Art. 66 al.2 appliqué à l'aérien) et payer les frais de surveillance des agents. Les modalités sont fixées par arrêté du Ministre des Finances.",
    motscles:["débarquements aériens","transbordements aériens","article 66","autorisation exceptionnelle","hangar","zone de fret","renvoi"] },

  { num:86, titre:"Interdiction de déchargement sans autorisation douanière — Tous modes", chapitre:"I — Importation", section:"II — Dispositions communes à tous les modes de transport",
    texte:`Quel que soit le mode de transport, aucune marchandise ne peut être déchargée sans l'autorisation du service des douanes. Les déchargements doivent avoir lieu dans les conditions fixées par arrêté du Ministre chargé des finances.`,
    exemple:"Cette règle s'applique universellement : ni un navire, ni un avion, ni un camion, ni une pirogue ne peut décharger sa cargaison sans l'autorisation préalable du service des douanes. Un chauffeur routier qui, impatient d'attendre, commence à décharger son camion dans la cour du bureau de douane de Kidira avant que les agents aient accordé l'autorisation de déchargement commet une infraction douanière, même si ses marchandises sont parfaitement régulières.",
    motscles:["déchargement","autorisation douanière","tous modes de transport","universalité","arrêté Ministre","conditions de déchargement"] },

  { num:87, titre:"Contenu de la déclaration sommaire — Espèce et qualité", chapitre:"I — Importation", section:"II — Dispositions communes à tous les modes de transport",
    texte:`Des indications suffisantes sur la marchandise transportée, notamment l'espèce et la qualité sont portées sur la déclaration sommaire.`,
    exemple:"La déclaration sommaire d'un camion transportant des médicaments depuis le Maroc doit indiquer : l'espèce (médicaments, pas simplement 'produits pharmaceutiques') et la qualité (comprimés d'amoxicilline 500mg, sirop antitussif, etc.). Une déclaration sommaire vague mentionnant uniquement 'marchandises diverses' sans précision d'espèce et de qualité serait insuffisante et pourrait être rejetée par la douane, entraînant un retard de dédouanement.",
    motscles:["déclaration sommaire","espèce","qualité","indications suffisantes","précision","marchandises diverses","rejet"] },

  { num:88, titre:"Délai de dépôt de la déclaration sommaire — Règle générale", chapitre:"I — Importation", section:"II — Dispositions communes à tous les modes de transport",
    texte:`Sous réserve des dispositions des articles 74 et 80 du présent code, la déclaration sommaire doit être déposée au bureau de douane compétent, avec, le cas échéant, sa traduction authentique, dès l'arrivée du moyen de transport ou, si le moyen de transport arrive avant l'ouverture du bureau, dès cette ouverture.`,
    exemple:"Un camion arrive au poste-frontière de Kidira un dimanche soir à 22h, alors que le bureau de douane n'ouvre qu'à 8h le lundi. Le conducteur gare son camion dans l'enceinte du bureau et attend. Dès l'ouverture à 8h, il doit immédiatement remettre la déclaration sommaire (lettre de voiture). Il ne peut pas attendre 10h ou 11h — c'est 'dès l'ouverture'. Si sa lettre de voiture est en arabe, il doit fournir une traduction authentique en français.",
    motscles:["déclaration sommaire","dès l'arrivée","ouverture du bureau","traduction authentique","délai général","tous modes"] },

  { num:89, titre:"Suspension des délais les dimanches et jours fériés", chapitre:"I — Importation", section:"II — Dispositions communes à tous les modes de transport",
    texte:`Les délais prévus pour le dépôt de la déclaration sommaire, ne courent pas les dimanches et les jours fériés.`,
    exemple:"Un cargo arrive au Port de Dakar le vendredi 27 décembre. Le délai normal de 24h pour le dépôt de la déclaration sommaire courrait jusqu'au samedi 28 décembre. Mais si le samedi 28 est un jour ouvré, le délai est respecté. En revanche, si un navire arrive le 24 décembre à 20h, le délai de 24h est suspendu les 25 et 26 décembre (Noël + lendemain supposé férié). Ce mécanisme évite de pénaliser les opérateurs pour des retards inhérents aux jours non travaillés.",
    motscles:["dimanches","jours fériés","suspension des délais","déclaration sommaire","délais ne courent pas","jours ouvrables"] },

  { num:90, titre:"Enregistrement de la déclaration sommaire — Prise en charge et autorisation de débarquement", chapitre:"I — Importation", section:"II — Dispositions communes à tous les modes de transport",
    texte:`La déclaration sommaire déposée par le transporteur auprès du service des douanes fait l'objet d'un enregistrement qui vaut prise en charge des marchandises et autorisation de débarquement.`,
    exemple:"Le consignataire du MSC Dakar dépose le manifeste CARGO au Bureau de Douane du Port. La douane l'enregistre dans le système GAINDE sous un numéro unique. Cet enregistrement produit deux effets automatiques et simultanés : (1) la douane 'prend en charge' les marchandises — elle en assume la responsabilité de surveillance ; (2) le déchargement du navire est officiellement autorisé. Sans cet enregistrement, le navire ne peut légalement commencer à décharger ses conteneurs.",
    motscles:["enregistrement","déclaration sommaire","prise en charge","autorisation de débarquement","double effet","GAINDE","consignataire"] },

  { num:91, titre:"Basculement total vers le dépôt électronique — Décision du DGD", chapitre:"I — Importation", section:"II — Dispositions communes à tous les modes de transport",
    texte:`Une décision du Directeur général des douanes détermine la date de basculement total vers l'électronique selon les différents modes de transport.`,
    exemple:"Le Directeur général des douanes peut décider, par exemple, que le manifeste papier est définitivement abandonné au profit du manifeste électronique pour les navires de commerce à compter du 1er janvier 2025, et que cette transition intervient pour le transport aérien à compter du 1er avril 2025, et pour le transport terrestre à compter du 1er juillet 2025. Cette transition progressive par mode de transport permet d'adapter la dématérialisation au niveau de préparation de chaque secteur et des opérateurs concernés.",
    motscles:["basculement électronique","Directeur général","décision","dématérialisation totale","modes de transport","calendrier","transition numérique"] },

  { num:92, titre:"Exportation — Mise à bord et conduite à l'étranger", chapitre:"II — Exportation", section:"",
    texte:`1. Sauf à être placées en magasin ou aire d'exportation après accomplissement des formalités douanières, les marchandises destinées à être exportées par les voies maritime, fluviale, lacustre et aérienne doivent être mises à bord des embarcations ou aéronefs.\n\n2. Celles qui doivent être exportées par les voies terrestres doivent être conduites directement à l'étranger.`,
