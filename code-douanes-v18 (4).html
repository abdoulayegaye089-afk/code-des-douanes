const TITRE5_ARTICLES = [
  { num:109, titre:"Toute marchandise peut recevoir toute destination douanière", chapitre:"I — Déclaration en détail", section:"I — Caractère obligatoire de la déclaration en détail",
    texte:`1. Sauf dispositions contraires, les marchandises peuvent à tout moment recevoir toute destination douanière quelles que soient leur nature, leur quantité, leur origine, leur provenance ou leur destination.\n\n2. L'alinéa 1 du présent article ne fait pas obstacle à l'application des mesures de prohibition visées à l'article 21 du présent code.`,
    exemple:"Un importateur qui a placé des textiles en entrepôt de douane peut décider, à tout moment pendant la durée du séjour autorisé, de changer de destination douanière : il peut les mettre à la consommation, les réexporter, les placer en transit vers le Mali, ou les détruire. La loi ne lui impose pas de choix figé dès l'introduction (al.1). Cependant, si ces textiles sont des contrefaçons de marque, ils restent prohibés à l'importation malgré l'al.1 — les mesures de prohibition (Art. 21) s'appliquent toujours (al.2).",
    motscles:["destination douanière","toute marchandise","nature quantité origine","liberté de choix","prohibitions","article 21"] },

  { num:110, titre:"Obligation universelle de déclaration en détail", chapitre:"I — Déclaration en détail", section:"I — Caractère obligatoire de la déclaration en détail",
    texte:`1. Toutes les marchandises importées ou exportées doivent faire l'objet d'une déclaration en détail leur assignant un régime douanier.\n\n2. L'exemption des droits et taxes, soit à l'entrée, soit à la sortie, ne dispense pas de l'obligation prévue à l'alinéa précédent.`,
    exemple:"Une ONG importe des médicaments en franchise totale de droits et taxes (exonération accordée par l'État). Malgré cette exonération, l'ONG est toujours obligée de déposer une déclaration en détail au bureau de douane (al.2). La déclaration zéro-droit existe et reste obligatoire : elle permet à la douane de tenir ses statistiques du commerce extérieur, de vérifier les prohibitions et de s'assurer que l'exonération est bien applicable. 'Gratuit' ne signifie pas 'sans formalité'.",
    motscles:["déclaration en détail","obligation universelle","importées exportées","régime douanier","exonération","franchise","statistiques"] },

  { num:111, titre:"Délais et lieu de dépôt de la déclaration en détail", chapitre:"I — Déclaration en détail", section:"I — Caractère obligatoire de la déclaration en détail",
    texte:`1. La déclaration en détail doit être déposée dans un bureau de douane ouvert à l'opération envisagée.\n\n2. À l'importation :\na) lorsqu'il n'y a pas de déclaration sommaire, dès l'arrivée des marchandises au bureau ou, si les marchandises sont arrivées avant l'ouverture des bureaux, dès cette ouverture ;\nb) lorsqu'il y a déclaration sommaire, dès enregistrement de ladite déclaration ou dès l'ouverture des bureaux. Si les marchandises ont été placées en magasin ou aire de dédouanement, la déclaration en détail doit être déposée au plus tard à l'expiration du délai réglementaire de séjour dans ces lieux.\nc) le Directeur général des douanes peut autoriser le dépôt des déclarations en détail avant l'arrivée des marchandises.\n\n4. À l'exportation, la déclaration en détail doit être déposée avant l'expédition des marchandises. Toutefois, le Directeur général des douanes peut autoriser des procédures simplifiées permettant le dépôt de la déclaration après expédition.\n\n5. La déclaration transmise par voie électronique est considérée comme déposée au moment de son enregistrement dans la plateforme informatique.\n\n6. Doivent être joints à la déclaration, tous les documents dont la production est obligatoire.`,
    exemple:"Scénario import via GAINDE : un cargo arrive au Port de Dakar lundi matin. Le consignataire dépose la déclaration sommaire (manifeste) → enregistrement GAINDE lundi à 10h. Le commissionnaire en douane doit déposer la déclaration en détail dès cet enregistrement (al.2b). S'il a placé la marchandise en magasin de dédouanement pour 30 jours (Art. 105), il peut attendre jusqu'au 30e jour. Pour l'export (al.4) : un exportateur de mangues doit déposer la déclaration AVANT que le camion quitte son entrepôt pour l'aéroport.",
    motscles:["bureau de douane ouvert","déclaration sommaire","dès enregistrement","magasin de dédouanement","avant l'arrivée","avant expédition","voie électronique","documents obligatoires"] },

  { num:112, titre:"Renseignements préalables à l'arrivée — Sécurisation de la chaîne logistique", chapitre:"I — Déclaration en détail", section:"I — Caractère obligatoire de la déclaration en détail",
    texte:`1. Dans le cadre de la sécurisation de la chaîne logistique internationale, l'administration des douanes peut :\n— exiger, avant l'arrivée dans le territoire douanier du Sénégal d'un moyen de transport, la fourniture par voie électronique de renseignements relatifs à celui-ci et aux marchandises et personnes à bord ;\n— indiquer les renseignements à fournir ;\n— désigner les personnes ou catégories de personnes tenues de fournir lesdits renseignements ;\n— prévoir les circonstances dans lesquelles les renseignements doivent être fournis ;\n— fixer les délais et modalités de cette fourniture de renseignements.\n\n2. Un arrêté du Ministre chargé des finances fixe, au besoin, les modalités d'application du présent article.`,
    exemple:"Dans le cadre du programme de ciblage douanier (similaire au système CUSCAR/EDIFACT utilisé internationalement), la douane sénégalaise exige que les armateurs transmettent électroniquement, 48 heures avant l'arrivée d'un navire, une déclaration préalable : liste des conteneurs, poids, nature des marchandises, pays d'origine, noms des chargeurs. Ces renseignements permettent aux analystes du renseignement douanier de cibler les conteneurs à risque avant même l'arrivée du navire — renforçant la sécurité sans ralentir le commerce.",
    motscles:["chaîne logistique internationale","renseignements préalables","voie électronique","avant l'arrivée","ciblage douanier","navire","personnes à bord","CUSCAR"] },

  { num:113, titre:"Forme de la déclaration en détail", chapitre:"I — Déclaration en détail", section:"II — Forme, énonciation, recevabilité et enregistrement",
    texte:`1. Les déclarations en détail doivent être faites par :\na) écrit sur support électronique ou sur support papier ;\nb) déclaration verbale ;\nc) tout autre acte par lequel le détenteur des marchandises marque sa volonté de les placer sous un régime douanier.\n\n2. Les conditions d'application des déclarations faites par voie électronique sont fixées par décisions du Directeur général des douanes.\n\n3. Les déclarations en détail doivent contenir toutes les indications nécessaires pour l'application des mesures douanières et pour l'établissement des statistiques du commerce extérieur.\n\n4. Elles doivent être signées par le déclarant. Cette signature peut être électronique ou manuelle.\n\n5. Le Directeur général des douanes détermine la forme des déclarations, les énonciations qu'elles doivent contenir et les documents qui doivent y être annexés. Il peut autoriser, dans certains cas, le remplacement de la déclaration écrite par une déclaration verbale ou tacite.`,
    exemple:"Trois formes de déclaration : (a) Électronique — un commissionnaire en douane dépose la déclaration via GAINDE 2000 avec signature numérique certifiée (al.1a, al.4) ; (b) Verbale — un voyageur qui arrive avec 500 FCFA de souvenirs déclare verbalement à l'agent des douanes 'j'ai des souvenirs pour usage personnel' (al.1b, al.5) — le DGD a autorisé ce régime simplifié pour les petits achats personnels ; (c) Tacite — passer dans la zone verte 'rien à déclarer' dans un aéroport constitue une déclaration tacite de conformité (al.1c).",
    motscles:["forme déclaration","support électronique","support papier","déclaration verbale","déclaration tacite","signature électronique","GAINDE","statistiques commerce extérieur"] },

  { num:114, titre:"Indépendance de chaque article d'une déclaration", chapitre:"I — Déclaration en détail", section:"II — Forme, énonciation, recevabilité et enregistrement",
    texte:`Lorsqu'une déclaration comporte plusieurs articles, chaque article est considéré comme ayant fait l'objet d'une déclaration indépendante.`,
    exemple:"Un importateur dépose une déclaration en détail unique comportant 5 articles : riz (position 1006), huile de palme (position 1511), sucre (position 1701), farine de blé (position 1101) et sel (position 2501). Si la douane conteste la valeur déclarée du riz (article 1), cette contestation ne remet pas en cause les 4 autres articles — chacun est traité comme une déclaration indépendante. L'importateur peut payer les droits sur les 4 articles non contestés et obtenir la mainlevée partielle, pendant que le litige sur le riz suit son cours.",
    motscles:["plusieurs articles","déclaration indépendante","contestation partielle","mainlevée partielle","position tarifaire","litige"] },

  { num:115, titre:"Interdiction de grouper plusieurs colis fermés comme une unité", chapitre:"I — Déclaration en détail", section:"II — Forme, énonciation, recevabilité et enregistrement",
    texte:`Il est défendu de présenter comme unité dans les déclarations plusieurs colis fermés réunis de quelque manière que ce soit.`,
    exemple:"Un importateur reçoit 50 cartons de chaussures et 30 cartons de vêtements, ficellés ensemble sur des palettes. Il ne peut pas déclarer 'une palette de cartons divers' comme une seule unité. Il doit déclarer individuellement chaque carton (ou au minimum chaque lot homogène par nature de marchandise). Regrouper des colis fermés de contenu différent en une seule unité de déclaration est une technique de fraude classique permettant de dissimuler des marchandises prohibées ou sous-déclarées — d'où l'interdiction formelle.",
    motscles:["colis fermés","unité","déclaration","groupage interdit","palette","fraude documentaire","cartons"] },

  { num:116, titre:"Examen préalable des marchandises avant déclaration", chapitre:"I — Déclaration en détail", section:"II — Forme, énonciation, recevabilité et enregistrement",
    texte:`1. Les personnes habilitées à établir les déclarations en détail, lorsqu'elles ne sont pas en possession des éléments nécessaires, peuvent être autorisées à examiner les marchandises avant déclaration et à prélever des échantillons. Elles doivent alors présenter à la douane une demande d'ouverture qui ne peut en aucun cas les dispenser de l'obligation de la déclaration en détail.\n\n2. Toute manipulation susceptible de modifier la présentation des marchandises ayant fait l'objet des demandes d'ouverture est interdite.\n\n3. La forme des demandes d'ouverture et les conditions dans lesquelles l'examen préalable peut avoir lieu sont déterminées par décision du Directeur général des douanes.`,
    exemple:"Un commissionnaire en douane reçoit une cargaison de produits chimiques dont la fiche technique est insuffisante pour déterminer la position tarifaire exacte. Il dépose une 'demande d'ouverture' auprès de la douane (al.1) pour ouvrir un fût et prélever un échantillon destiné à l'analyse. La douane autorise l'ouverture en présence d'un agent douanier. L'échantillon est envoyé au laboratoire. Le commissionnaire peut ensuite rédiger la déclaration avec la position SH correcte. Il ne peut pas, pendant cet examen, transvaser, reconditionner ou modifier les produits (al.2).",
    motscles:["examen préalable","demande d'ouverture","prélèvement échantillons","avant déclaration","modification interdite","produits chimiques","position tarifaire"] },

  { num:117, titre:"Recevabilité et enregistrement des déclarations en détail", chapitre:"I — Déclaration en détail", section:"II — Forme, énonciation, recevabilité et enregistrement",
    texte:`1. Sous réserve des dispositions de l'alinéa 5 de l'article 111, les déclarations en détail reconnues recevables sont immédiatement enregistrées.\n\n2. Sont considérées comme irrecevables les déclarations irrégulières dans la forme ou qui ne sont pas accompagnées des documents dont la production est obligatoire. Toutefois, peuvent être reçues les déclarations ne comportant pas les documents exigés lorsque le déclarant y a été autorisé, sous réserve d'engagement à produire les documents manquants dans un délai donné et de souscription d'une soumission dûment cautionnée. L'autorisation ne peut être accordée lorsque font défaut les documents requis pour le contrôle du commerce extérieur et des changes ou pour l'application des mesures de prohibition.\n\n3. Lorsque l'espèce est déclarée par référence aux éléments de codification de la nomenclature, les mentions en lettres contredisant ces éléments de codification sont nulles. En tout autre cas, sont nulles les mentions en chiffres contredisant les mentions en lettres.`,
    exemple:"Un commissionnaire dépose une déclaration pour des machines agricoles mais oublie de joindre le certificat d'origine (document obligatoire pour le tarif préférentiel). La douane peut quand même enregistrer la déclaration si le commissionnaire signe un engagement à produire le certificat sous 15 jours et fournit une caution financière (al.2). Mais si le document manquant est une licence d'importation (document anti-prohibition), aucune dérogation n'est possible. Sur la contradiction chiffres/lettres (al.3) : si la déclaration mentionne 'riz' en lettres mais le code SH 1006.30 (riz semi-blanchi) et que les chiffres correspondent au riz paddy — les chiffres l'emportent.",
    motscles:["recevabilité","enregistrement immédiat","irrecevable","documents manquants","soumission cautionnée","délai production","mentions chiffres lettres","code SH"] },

  { num:118, titre:"Effet des déclarations anticipées", chapitre:"I — Déclaration en détail", section:"II — Forme, énonciation, recevabilité et enregistrement",
    texte:`Pour l'application du présent code, et notamment des droits et taxes, des prohibitions et autres mesures, les déclarations déposées par anticipation ne prennent effet, avec toutes les conséquences attachées à l'enregistrement, qu'à partir de la date à laquelle il est justifié, dans les conditions et délais prévus à l'alinéa 3 de l'article 111, de l'arrivée des marchandises.`,
    exemple:"Un commissionnaire dépose en avance une déclaration d'importation pour un chargement de riz attendu dans 3 jours (déclaration anticipée autorisée par Art. 111 al.2c). Entre le dépôt de la déclaration et l'arrivée du navire, le gouvernement augmente les droits de douane sur le riz. Quelle taxe s'applique ? L'ancienne, car la date qui compte est celle de l'arrivée prouvée des marchandises — pas la date de dépôt anticipé de la déclaration. La déclaration anticipée ne 'fige' pas le taux tant que l'arrivée n'est pas justifiée.",
    motscles:["déclaration anticipée","effet différé","date d'arrivée","droits et taxes","date d'enregistrement","justification d'arrivée","taux applicable"] },

  { num:119, titre:"Rectification des déclarations après enregistrement", chapitre:"I — Déclaration en détail", section:"II — Forme, énonciation, recevabilité et enregistrement",
    texte:`1. Après leur enregistrement, les déclarations en détail ne peuvent plus être modifiées.\n\n2. Toutefois, sur demande du commissionnaire en douane agréé, le Chef de bureau des douanes peut autoriser la rectification de la déclaration sous les réserves suivantes :\na) à l'importation, la rectification peut être accordée avant que l'administration des douanes ait commencé la vérification. Après que le service ait entamé la vérification, la rectification ne peut être accordée que pour les éléments qui n'ont pas d'incidences sur la liquidation ;\nb) à l'exportation, la rectification peut être acceptée avant que les marchandises aient quitté le bureau de douane ou le lieu désigné ;\nc) la rectification ne peut être acceptée si l'administration des Douanes a informé le déclarant de son intention de procéder à une vérification, constaté l'inexactitude des énonciations ou donné mainlevée des marchandises.`,
    exemple:"Un commissionnaire en douane enregistre une déclaration pour 500 cartons de jus de fruits, mais réalise immédiatement après qu'il a saisi '500 cartons' au lieu de '5 000 cartons'. Il peut demander la rectification au Chef de bureau — avant que la douane commence la vérification physique (al.2a). Si la vérification a déjà commencé et que l'agent a compté 4 500 cartons supplémentaires, la rectification est refusée (al.2c : inexactitude constatée). La rectification spontanée avant vérification est traitée avec indulgence ; après découverte par la douane, elle constitue une tentative de fraude.",
    motscles:["rectification déclaration","après enregistrement","chef de bureau","avant vérification","après vérification","mainlevée","inexactitude","exportation"] },

  { num:120, titre:"Procédures simplifiées de dédouanement", chapitre:"I — Déclaration en détail", section:"III — Procédures simplifiées",
    texte:`1. Des décisions du Directeur général des douanes peuvent autoriser des procédures simplifiées de dédouanement prévoyant notamment :\n— que certaines indications des déclarations en détail seront fournies ou reprises ultérieurement sous la forme de déclarations complémentaires pouvant présenter un caractère global, périodique ou récapitulatif ;\n— la mainlevée sur la base d'une déclaration en détail incomplète avec établissement ultérieur de la déclaration en détail complète ;\n— le dédouanement des marchandises dans les locaux du déclarant ou dans tout autre lieu agréé ;\n— l'enregistrement de déclarations en détail dans un bureau de douane différent de celui où les marchandises sont présentées.\n\n2. Les mentions des déclarations complémentaires sont réputées constituer, avec les mentions des déclarations auxquelles elles se rapportent, un acte unique et indivisible prenant effet à la date d'enregistrement de la déclaration initiale.`,
    exemple:"Une grande entreprise pétrolière importe quotidiennement du carburant. Le DGD peut lui accorder une procédure simplifiée : elle dépose une déclaration globale mensuelle récapitulant toutes les importations du mois (al.1, déclaration périodique), au lieu d'une déclaration par livraison. Les marchandises obtiennent la mainlevée immédiate sur déclaration incomplète (al.1), et la déclaration complète est régularisée en fin de mois. La déclaration complémentaire mensuelle a effet rétroactif à la date de la première déclaration initiale du mois (al.2).",
    motscles:["procédures simplifiées","déclarations complémentaires","déclaration globale","déclaration périodique","mainlevée sur déclaration incomplète","locaux du déclarant","acte unique et indivisible"] },

  { num:121, titre:"Privilèges et facilités élargis pour les opérateurs économiques", chapitre:"I — Déclaration en détail", section:"III — Procédures simplifiées",
    texte:`Les opérateurs économiques peuvent demander à bénéficier de privilèges et de facilités élargis dans le cadre de programmes, de conventions ou d'accords signés avec l'administration.`,
    exemple:"Le statut d'Opérateur Économique Agréé (OEA) — équivalent sénégalais du programme AEO de l'OMD — permet aux entreprises fiables et conformes de bénéficier de facilités : contrôles documentaires réduits, mainlevée accélérée, dédouanement dans leurs propres entrepôts, voie verte prioritaire. Une entreprise comme Nestlé Sénégal, ayant signé une convention avec la douane sénégalaise (Art. 121), peut importer ses matières premières avec des délais de dédouanement réduits de 48h à quelques heures.",
    motscles:["opérateurs économiques agréés","OEA","privilèges","facilités","conventions","accords","programme AEO","OMD","voie verte"] },

  { num:122, titre:"Personnes habilitées à déclarer les marchandises en détail", chapitre:"I — Déclaration en détail", section:"IV — Personnes habilitées à déclarer",
    texte:`1. Les marchandises importées ou à exporter doivent être déclarées en détail par les personnes morales ayant obtenu l'agrément de commissionnaire en douane.\n\n2. Toutefois, lorsque leur valeur est inférieure à un montant fixé par arrêté du Ministre chargé des finances, les marchandises importées ou exportées peuvent être déclarées en détail par leurs propriétaires ou détenteurs même s'ils ne bénéficient pas du crédit d'enlèvement.\n\n3. Les entreprises intervenant dans l'importation et le stockage des produits pétroliers ainsi que les personnes morales dont la nature des activités ou le montant élevé du crédit d'enlèvement le justifie, peuvent bénéficier d'une autorisation exceptionnelle de déclarer pour elles-mêmes ou pour autrui.\n\n4. Les propriétaires de marchandises titulaires d'un crédit d'enlèvement et bénéficiant d'une autorisation de dédouaner pour eux-mêmes ou pour autrui peuvent continuer à déclarer pendant une période transitoire d'une année après l'entrée en vigueur de la présente loi.`,
    exemple:"Un camion arrive à Kidira avec 500 000 FCFA de marchandises diverses. Si le seuil ministériel est fixé à 1 million FCFA, le propriétaire peut déclarer lui-même sans commissionnaire (al.2). Mais si le camion transporte pour 50 millions FCFA d'électroménager, un commissionnaire en douane agréé est obligatoire (al.1). Exception : la SAR (Société Africaine de Raffinage) importatrice de pétrole brut peut déclarer elle-même grâce à l'autorisation exceptionnelle accordée aux entreprises pétrolières (al.3).",
    motscles:["commissionnaire en douane agréé","personnes morales","seuil de valeur","arrêté Ministre","propriétaire déclarant","produits pétroliers","autorisation exceptionnelle","crédit d'enlèvement"] },

  { num:123, titre:"Agrément de commissionnaire en douane — Conditions et procédure", chapitre:"I — Déclaration en détail", section:"IV — Personnes habilitées à déclarer",
    texte:`1. Nul ne peut faire profession d'accomplir pour le compte d'autrui les formalités de douane concernant la déclaration en détail des marchandises s'il n'a été agréé comme commissionnaire en douane.\n\n2. Cet agrément est donné par arrêté du Ministre chargé des finances sur proposition du Directeur général des douanes et après avis d'un comité dont la composition et les modalités de fonctionnement sont fixées par décret. L'arrêté fixe le ou les bureaux de douane pour lesquels l'agrément est valable.\n\n3. L'extension de l'agrément est accordée dans les mêmes formes que l'agrément lui-même.\n\n4. La suspension ou le retrait définitif de l'agrément intervient par arrêté du Ministre chargé des finances sur proposition du Directeur général des douanes, après avis du comité, notamment lorsque le titulaire a contrevenu gravement à la législation douanière, fiscale ou aux usages de la profession ou en cas de caducité.`,
    exemple:"La société 'Sénégal Transit SARL' souhaite devenir commissionnaire en douane agréé. Elle dépose un dossier auprès du DGD (qui instruit et propose), un comité d'agrément examine la demande (capacité financière, compétences techniques, honorabilité), puis le Ministre des Finances prend un arrêté d'agrément valable pour le Bureau de Dakar-Port (al.2). Si 'Sénégal Transit SARL' veut opérer aussi à l'aéroport, elle demande une extension d'agrément (al.3). En cas de fraude grave, le Ministre peut retirer l'agrément sur proposition du DGD (al.4).",
    motscles:["agrément commissionnaire en douane","arrêté Ministre","Directeur général","comité d'agrément","bureau de douane","extension","suspension","retrait","contravention grave"] },

  { num:124, titre:"Caractère personnel et incessible de l'agrément", chapitre:"I — Déclaration en détail", section:"IV — Personnes habilitées à déclarer",
    texte:`1. L'agrément de commissionnaire en douane est donné à titre personnel à la personne morale bénéficiaire. L'agrément n'est ni cessible à titre gratuit ou à titre onéreux, ni transférable.\n\n2. En aucun cas, le refus, la suspension ou le retrait de l'agrément ne peut ouvrir droit à indemnité ou dommages et intérêts.`,
    exemple:"La société 'Alpha Transit SARL' titulaire d'un agrément de commissionnaire en douane est rachetée par 'Beta Logistics SA'. Beta Logistics ne peut pas simplement 'reprendre' l'agrément d'Alpha Transit : l'agrément étant incessible (al.1), Beta Logistics doit constituer son propre dossier et demander un nouvel agrément. Si le Ministre refuse cet agrément, Beta Logistics ne peut réclamer aucun dédommagement (al.2). Cette règle protège la profession contre les achats d'agréments et garantit que chaque commissionnaire agréé répond personnellement de ses compétences.",
    motscles:["agrément incessible","personnel","personne morale","cession interdite","transfert interdit","sans indemnité","dommages et intérêts","refus suspension retrait"] },

  { num:125, titre:"Répertoires annuels et conservation des documents des commissionnaires", chapitre:"I — Déclaration en détail", section:"IV — Personnes habilitées à déclarer",
    texte:`1. Les commissionnaires en douane doivent inscrire les opérations de douane qu'ils accomplissent pour autrui sur des répertoires annuels dans les conditions fixées par le Directeur général des douanes.\n\n3. Lesdits répertoires peuvent être sur support électronique ou support papier.\n\n4. Les commissionnaires en douane sont tenus de conserver les répertoires ainsi que les correspondances et documents relatifs à ses opérations douanières pendant trois (03) ans à compter de la date d'enregistrement des déclarations de douane correspondantes.`,
    exemple:"Le commissionnaire en douane 'Dakar Freight SARL' effectue 2 500 déclarations par an. Il tient un répertoire annuel électronique (via son logiciel de gestion connecté à GAINDE) listant toutes ses opérations chronologiquement avec les numéros de déclaration, les clients, les montants et les régimes douaniers utilisés. Ce répertoire doit être conservé pendant 3 ans : une déclaration du 15 mars 2024 devra être disponible jusqu'au 15 mars 2027 en cas de contrôle après dédouanement par la douane (Art. 153).",
    motscles:["répertoires annuels","commissionnaire en douane","support électronique","conservation 3 ans","date d'enregistrement","contrôle après dédouanement","GAINDE"] },

  { num:126, titre:"Honoraires des commissionnaires en douane", chapitre:"I — Déclaration en détail", section:"IV — Personnes habilitées à déclarer",
    texte:`Les tarifs des honoraires que les commissionnaires en douane agréés sont autorisés à percevoir sont fixés dans les conditions prévues par la législation sur les prix.`,
    exemple:"Les honoraires qu'un commissionnaire en douane peut facturer à ses clients (importateurs, exportateurs) ne sont pas libres : ils sont encadrés par la législation sénégalaise sur les prix. La Direction du Commerce peut fixer des barèmes maximaux. Un commissionnaire qui facturerait des honoraires abusifs ou non conformes au barème officiel s'expose à des sanctions administratives et à la suspension de son agrément pour 'manquement aux usages de la profession' (Art. 123 al.4).",
    motscles:["honoraires commissionnaire","tarifs","législation sur les prix","barème","honoraires abusifs","usages de la profession"] },

  { num:127, titre:"Décret d'application des règles sur les commissionnaires en douane", chapitre:"I — Déclaration en détail", section:"IV — Personnes habilitées à déclarer",
    texte:`1. Les conditions d'application des dispositions des articles 122 à 126 du présent article sont fixées par décret.\n\n2. Ce décret détermine les conditions dans lesquelles l'administration peut accomplir pour son propre compte des opérations de dédouanement et les obligations qui lui incombent à cet égard.`,
    exemple:"Le décret d'application des articles 122 à 126 précise notamment : le montant minimum du capital social d'un commissionnaire en douane, les diplômes et qualifications professionnelles exigés des dirigeants, la composition et le fonctionnement du comité d'agrément, le montant de la caution financière à fournir, le modèle des répertoires annuels, et les conditions dans lesquelles la douane peut accomplir elle-même des formalités de dédouanement (ex : pour les marchandises abandonnées au Trésor public).",
    motscles:["décret d'application","conditions d'application","articles 122 à 126","administration douane","dédouanement propre compte","capital social","qualifications"] },

  { num:128, titre:"Carte import-export — Identifiant unique des opérateurs", chapitre:"I — Déclaration en détail", section:"V — Personnes autorisées à importer et à exporter",
    texte:`Les personnes physiques ou morales dont les activités exercées à titre principal nécessitent des opérations d'importation ou d'exportation de marchandises, soit directement, soit par des mandataires ou commissionnaires en douane agréés, doivent être titulaires d'une carte spéciale dite « carte d'import-export » et d'un identifiant unique.`,
    exemple:"Une entreprise sénégalaise qui importe régulièrement du matériel informatique doit obtenir une carte d'import-export et un identifiant unique (NIF douanier) avant de pouvoir effectuer ses premières opérations. Cette carte — délivrée par la douane — identifie l'opérateur dans le système GAINDE et lui permet d'être référencé dans toutes les déclarations en douane. Sans cette carte, même si elle mandate un commissionnaire agréé, l'entreprise ne peut légalement effectuer des opérations commerciales d'importation ou d'exportation à titre habituel.",
    motscles:["carte import-export","identifiant unique","NIF douanier","opérateurs économiques","importation exportation","GAINDE","mandataire","commissionnaire"] },

  { num:129, titre:"Contrôle documentaire et vérification après enregistrement", chapitre:"II — Vérification des déclarations et des marchandises", section:"I — Conditions dans lesquelles a lieu la vérification",
    texte:`1. Après enregistrement de la déclaration en détail, le service des douanes procède au contrôle documentaire et, s'il le juge utile, à la vérification de tout ou partie des marchandises.\n\n2. Des décisions du Directeur général des douanes peuvent fixer les modalités de la vérification des marchandises.\n\n3. En cas de contestation, le déclarant a le droit de récuser les résultats de la vérification partielle et de demander la vérification intégrale des marchandises sur lesquelles porte la contestation.`,
    exemple:"GAINDE enregistre la déclaration d'importation d'un conteneur de vêtements. Le système de ciblage (canal rouge) déclenche une vérification physique. Les agents ouvrent 10 cartons sur 100 (vérification partielle, al.1) et constatent une discordance de 20% sur la valeur. Le commissionnaire conteste : il invoque son droit à la vérification intégrale des 100 cartons (al.3). La vérification intégrale révèle que les 10 premiers cartons étaient non représentatifs — la valeur moyenne des 100 cartons est conforme. Le commissionnaire a eu raison de récuser la vérification partielle.",
    motscles:["contrôle documentaire","vérification physique","enregistrement","vérification partielle","vérification intégrale","récusation","contestation","ciblage GAINDE","canal rouge"] },

  { num:130, titre:"Lieu et frais de la vérification des marchandises", chapitre:"II — Vérification des déclarations et des marchandises", section:"I — Conditions dans lesquelles a lieu la vérification",
    texte:`1. La vérification des marchandises déclarées dans les bureaux de douane ne peut être faite que dans les magasins de la douane ou dans les lieux désignés à cet effet par le service des douanes.\n\n2. Le transport des marchandises sur les lieux de la vérification, ainsi que, le cas échéant, le déballage, le remballage, le prélèvement d'échantillons et toutes les autres manipulations nécessaires sont effectués aux frais et sous la responsabilité du déclarant.\n\n3. Les marchandises qui ont été conduites dans les magasins de la douane ou sur les lieux de la vérification ne peuvent être déplacées sans la permission du service des douanes.`,
    exemple:"La douane ordonne la vérification d'un conteneur de machines-outils. Le commissionnaire doit organiser et payer : le transport du conteneur depuis le quai jusqu'au magasin de vérification de la douane (al.2), les frais de grutage pour ouvrir le conteneur, les manutentionnaires pour déballer et remballer les machines. Si pendant la vérification le commissionnaire veut déplacer un carton vers un autre endroit, il doit obtenir la permission de l'agent (al.3). Tout déplacement non autorisé constitue une soustraction de marchandises à la surveillance douanière.",
    motscles:["magasins de la douane","lieu de vérification","frais déclarant","responsabilité","déballage remballage","prélèvement échantillons","déplacement non autorisé"] },

  { num:131, titre:"Présence du déclarant lors de la vérification — Absence et dépôt d'office", chapitre:"II — Vérification des déclarations et des marchandises", section:"I — Conditions dans lesquelles a lieu la vérification",
    texte:`1. La vérification des marchandises a lieu en présence du déclarant ou de son représentant.\n\n2. Lorsque le déclarant ou son représentant ne se présente pas pour assister à la vérification, le service des douanes lui notifie, au besoin par écrit ou par messagerie électronique et avec accusé de réception, son intention de commencer les opérations de vérification ; si cinq (05) jours après la date fixée pour la vérification le déclarant ne se présente pas, les marchandises sont constituées d'office en dépôt de douane dans les conditions fixées à l'article 252 du présent code.`,
    exemple:"Un commissionnaire en douane reçoit une convocation de vérification pour le lundi à 9h (al.1). Ni lui ni son représentant ne se présente. La douane lui envoie lundi même une notification électronique avec accusé de réception (al.2). Si le samedi (5e jour), personne ne s'est encore manifesté, la douane constitue d'office les marchandises en dépôt (Art. 252) — elles seront vendues aux enchères après un délai légal si personne ne les réclame. Cette sanction automatique évite que des marchandises bloquent indéfiniment les magasins de la douane.",
    motscles:["présence déclarant","vérification","représentant","notification écrite","messagerie électronique","accusé de réception","5 jours","dépôt d'office","article 252"] },

  { num:132, titre:"Contestation des énonciations de la déclaration par la douane", chapitre:"II — Vérification des déclarations et des marchandises", section:"I — Conditions dans lesquelles a lieu la vérification",
    texte:`1. Lorsque le service des douanes conteste certaines énonciations de la déclaration, il en donne avis au déclarant ou à son représentant, qui doit, dans les cinq (05) jours, faire connaître s'il accepte ou non l'appréciation du service.\n\n2. L'absence de réponse à l'expiration du délai visé à l'alinéa 1 ci-dessus est réputée acceptation de l'appréciation du service. Toutefois, sur demande écrite du déclarant, le service des douanes est tenu d'accorder une prorogation de ce délai sans que le cumul ne puisse dépasser dix (10) jours.\n\n3. Dans le cas où le déclarant ou son représentant accepte l'appréciation des agents des douanes, il doit signer le document où sont consignés les résultats de la vérification.`,
    exemple:"Lors de la vérification d'une cargaison de climatiseurs, les agents contestent la valeur déclarée (3 millions FCFA/unité) et proposent 4 millions FCFA/unité. La douane notifie le commissionnaire le lundi. Celui-ci a 5 jours (jusqu'au vendredi) pour répondre (al.1). S'il ne répond pas vendredi : acceptation tacite de 4 millions (al.2). S'il est en déplacement, il peut demander une prorogation — la douane doit l'accorder, mais le délai total ne peut dépasser 10 jours. S'il accepte les 4 millions, il signe le procès-verbal de vérification (al.3) et paie les droits sur la base rectifiée.",
    motscles:["contestation énonciations","avis déclarant","5 jours","acceptation tacite","prorogation 10 jours","signature procès-verbal","valeur contestée"] },

  { num:133, titre:"Règlement des contestations sur la valeur, l'espèce ou l'origine", chapitre:"II — Vérification des déclarations et des marchandises", section:"II — Règlement des contestations",
    texte:`1. Dans le cas où le service des douanes conteste, au moment de la vérification, les énonciations de la déclaration relatives à la valeur, à l'espèce ou à l'origine des marchandises, la contestation peut être réglée conformément aux dispositions du titre XIII du présent code, lorsque le déclarant n'accepte pas l'appréciation du service.\n\n2. Dans tous les cas, le déclarant dispose toujours du droit de recours visé à l'article 414 du présent code.`,
    exemple:"La douane conteste l'origine 'Chine' déclarée pour des textiles et affirme qu'ils viennent du Bangladesh (droits différents). Le commissionnaire refuse d'accepter la rectification (al.1). Il saisit la Commission de règlement des litiges douaniers (Titre XIII, Art. 416) qui examine les documents d'origine, les certificats d'origine Form A et les connaissements. La Commission statue. Si le commissionnaire n'est toujours pas satisfait, il peut former un recours devant les juridictions compétentes (al.2, Art. 414) — le droit de recours est toujours ouvert.",
    motscles:["contestation valeur espèce origine","titre XIII","Commission de règlement des litiges","droit de recours","article 414","déclarant","acceptation refus"] },

  { num:134, titre:"Application des résultats de la vérification", chapitre:"II — Vérification des déclarations et des marchandises", section:"III — Application des résultats de la vérification",
    texte:`1. Les droits, taxes et autres mesures douanières sont appliqués d'après les résultats de la vérification de la déclaration et/ou des marchandises et, en cas d'arbitrage, conformément à la décision de la commission de règlement des litiges douaniers visée au titre XIII du présent code.\n\n2. Lorsque le service des douanes ne procède pas à la vérification des marchandises et sauf contestations, les droits, taxes et autres mesures douanières sont appliqués d'après les énonciations de la déclaration.`,
    exemple:"Deux scénarios : (1) Vérification effectuée — la douane vérifie et trouve que la valeur réelle est supérieure à la valeur déclarée. Les droits sont calculés sur la valeur vérifiée (al.1). (2) Pas de vérification (canal vert GAINDE) — la douane accepte la déclaration sans contrôle physique ; les droits sont calculés directement sur les énonciations du commissionnaire (al.2). Dans les deux cas, le commissionnaire reste responsable de l'exactitude de sa déclaration même en l'absence de vérification — une fausse déclaration délibérée reste punissable.",
    motscles:["résultats vérification","droits et taxes","énonciations déclaration","canal vert","sans vérification","commission de règlement","arbitrage","exactitude"] },

  { num:135, titre:"Liquidation des droits et taxes par le service des douanes", chapitre:"III — Liquidation et recouvrement des droits et taxes", section:"I — Liquidation des droits et taxes",
    texte:`Les droits, taxes, redevances et recettes diverses ainsi que les pénalités et autres sanctions pécuniaires sont liquidés par le service des douanes et recouvrés par les comptables directs du Trésor.`,
    exemple:"Après vérification d'un conteneur de téléphones, l'agent des douanes liquide (calcule et arrête définitivement) les droits : droit de douane (20%) + TVA (18%) + redevance statistique (1%) = total 580 000 FCFA. Ce calcul est effectué par la douane (liquidation). Le paiement est encaissé par le comptable direct du Trésor affecté au bureau de douane (recouvrement) — deux opérations distinctes, deux administrations distinctes. Si une amende est infligée pour fausse déclaration, elle est aussi liquidée par la douane et recouvrée par le Trésor.",
    motscles:["liquidation","droits taxes redevances","pénalités","sanctions pécuniaires","service des douanes","comptables Trésor","recouvrement","calcul"] },

  { num:136, titre:"Date d'application des droits et taxes — Taux en vigueur", chapitre:"III — Liquidation et recouvrement des droits et taxes", section:"I — Liquidation des droits et taxes",
    texte:`1. Les droits et taxes à percevoir sont ceux en vigueur à la date d'enregistrement de la déclaration en détail.\n\n2. En cas d'abaissement du taux des droits et taxes, le déclarant peut demander l'application du nouveau tarif plus favorable si l'autorisation d'enlèvement (article 142) n'a pas encore été donnée.\n\n3. Les droits et taxes exigibles pour chaque article d'une même déclaration sont arrondis au franc inférieur.`,
    exemple:"Un commissionnaire enregistre sa déclaration le 31 décembre avec un taux de droits de 20%. Le 1er janvier, un nouveau tarif entre en vigueur à 15%. Si la mainlevée n'a pas encore été accordée (marchandises toujours en magasin), le commissionnaire peut demander l'application du taux de 15% (al.2 — tarif plus favorable). Calcul pratique (al.3) : droits calculés = 125 432,76 FCFA → arrondis à 125 432 FCFA (arrondi au franc inférieur, pas supérieur).",
    motscles:["taux en vigueur","date d'enregistrement","abaissement taux","tarif plus favorable","mainlevée","arrondi franc inférieur","clause tarifaire"] },

  { num:137, titre:"Paiement au comptant des droits et taxes", chapitre:"III — Liquidation et recouvrement des droits et taxes", section:"II — Paiement au comptant",
    texte:`1. Les droits et taxes liquidés par le service des douanes sont payables au comptant.\n\n2. Les droits et taxes liquidés peuvent être recouvrés par l'intermédiaire de régies de recettes.\n\n3. Les comptables directs du Trésor chargés de la perception des droits et taxes ainsi que les régisseurs de recettes sont tenus d'en donner quittances.\n\n4. Les registres de liquidation et de paiement des droits et taxes peuvent être maintenus et consolidés sur support électronique ou papier.`,
    exemple:"Un importateur reçoit l'avis de liquidation de la douane : 2 500 000 FCFA de droits et taxes. Il doit payer immédiatement (al.1 : paiement au comptant), soit au guichet du comptable du Trésor au bureau de douane, soit via une régie de recettes habilitée (al.2). Une quittance officielle lui est remise (al.3) — preuve de paiement indispensable pour obtenir la mainlevée. En cas de litige ultérieur, le registre électronique GAINDE (al.4) fait foi.",
    motscles:["paiement au comptant","droits et taxes","comptables Trésor","régies de recettes","quittance","registre électronique","mainlevée après paiement"] },

  { num:138, titre:"Abandon de marchandises à la douane — Exonération de droits et vente", chapitre:"III — Liquidation et recouvrement des droits et taxes", section:"II — Paiement au comptant",
    texte:`1. Les droits et taxes ne sont pas dus sur les marchandises dont l'administration des douanes accepte l'abandon à son profit.\n\n2. Les marchandises dont l'abandon est accepté sont vendues dans les mêmes conditions que les marchandises abandonnées par transaction. Après déduction d'un montant équivalent aux droits et taxes et autres frais accessoires, le reliquat éventuel est définitivement acquis au Trésor public.`,
    exemple:"Un importateur de meubles importés de Chine est en difficulté financière : il ne peut pas payer les 8 millions FCFA de droits et taxes. Il propose d'abandonner la marchandise à la douane (al.1). La douane accepte l'abandon : les droits ne sont plus dus par l'importateur (al.1). La douane vend les meubles aux enchères pour 12 millions FCFA (al.2). Elle déduit 8 millions (droits + frais de stockage et de vente). Le reliquat de 4 millions est versé au Trésor public — l'importateur ne reçoit rien car l'abandon est définitif.",
    motscles:["abandon marchandises","exonération droits","vente aux enchères","Trésor public","reliquat","frais accessoires","difficulté financière","transaction"] },

  { num:139, titre:"Crédit des droits et taxes — Obligations cautionnées", chapitre:"III — Liquidation et recouvrement des droits et taxes", section:"III — Crédit des droits et taxes",
    texte:`1. Les redevables peuvent être admis à présenter au comptable direct du Trésor des obligations dûment cautionnées, à deux (02) mois d'échéance, pour le paiement des droits et taxes liquidés, à l'exception des prélèvements communautaires.\n\n2. Ces obligations ne sont pas admises lorsque la somme à payer d'après chaque décompte est inférieure à 5.000.000 de francs.\n\n3. Elles donnent lieu à un intérêt de crédit et, en cas de non paiement à l'échéance, à un intérêt de retard dont les taux sont fixés par arrêté du Ministre chargé des finances.\n\n4. Les traites comprennent indépendamment des droits et taxes le montant de l'intérêt de crédit.\n\n5. Une remise spéciale est attachée au montant des droits et taxes payés par obligations cautionnées.`,
    exemple:"Un grand importateur de riz doit payer 50 millions FCFA de droits. Au lieu de payer cash immédiatement, il présente une obligation cautionnée (traite avalisée par sa banque) à 2 mois d'échéance (al.1) — le crédit de douane. La banque garantit le paiement. L'importateur bénéficie ainsi de 2 mois de trésorerie supplémentaires pour vendre le riz et payer. Des intérêts de crédit sont inclus dans la traite (al.3 et 4). En échange, une remise (rabais) sur les droits lui est accordée (al.5). Ce mécanisme est réservé aux montants ≥ 5 millions FCFA (al.2).",
    motscles:["crédit droits et taxes","obligations cautionnées","2 mois","5.000.000 FCFA","intérêt de crédit","intérêt de retard","remise spéciale","prélèvements communautaires"] },

  { num:140, titre:"Télé-règlement obligatoire pour les versements importants", chapitre:"III — Liquidation et recouvrement des droits et taxes", section:"IV — Versements importants",
    texte:`Tout versement effectué en vertu du présent code, supérieur à un seuil fixé par le Ministre chargé des finances, doit être fait par télé-règlement directement opéré sur le compte du Trésor à la Banque centrale.`,
    exemple:"Le Ministre des Finances fixe le seuil à 5 millions FCFA. Un importateur qui doit payer 25 millions FCFA de droits ne peut pas apporter une valise de billets au guichet du bureau de douane. Il doit obligatoirement effectuer un virement électronique (télé-règlement) directement sur le compte du Trésor à la BCEAO. Ce mécanisme lutte contre la corruption (pas de manipulation d'espèces), garantit la traçabilité des paiements, et accélère le recouvrement. La quittance électronique est automatiquement générée dans GAINDE.",
    motscles:["télé-règlement","virement électronique","seuil Ministre","compte Trésor","BCEAO","Banque centrale","anti-corruption","traçabilité paiements"] },

  { num:141, titre:"Remboursement des droits et taxes", chapitre:"III — Liquidation et recouvrement des droits et taxes", section:"V — Remboursements",
    texte:`1. Les droits et taxes liquidés et perçus sur les marchandises importées ou exportées, peuvent être remboursés au déclarant :\n— en cas de renvoi au fournisseur des marchandises lorsqu'elles sont défectueuses, altérées ou non conformes aux commandes ;\n— en cas de destruction sur place des marchandises défectueuses, altérées ou non conformes, sur ordre du fournisseur et sur autorisation de l'administration ;\n— en cas d'erreur de liquidation de l'administration ;\n— pour les marchandises ayant fait l'objet de déclaration anticipée et qui ne sont pas parvenues.\n\n2. Les conditions dans lesquelles le remboursement peut être effectué sont fixées par arrêté du Ministre chargé des finances.\n\n3. Hors les cas prévus par le présent code, les droits et taxes ne peuvent, en principe, être remboursés.`,
    exemple:"Quatre cas de remboursement : (1) Un importateur reçoit 500 téléphones défectueux qu'il renvoie au fournisseur chinois — les droits payés à l'importation lui sont remboursés. (2) Une cargaison de fruits pourris est détruite sous contrôle douanier sur ordre du fournisseur — remboursement des droits. (3) La douane a liquidé 2 millions au lieu de 1,5 million par erreur de calcul — remboursement de 500 000 FCFA. (4) Un importateur a déposé une déclaration anticipée pour un navire finalement naufragé : les marchandises ne sont jamais arrivées — remboursement des droits payés par avance.",
    motscles:["remboursement droits et taxes","marchandises défectueuses","renvoi fournisseur","destruction sur place","erreur de liquidation","déclaration anticipée","marchandises non parvenues","arrêté Ministre"] },

  { num:142, titre:"Enlèvement des marchandises — Autorisation préalable et délais", chapitre:"IV — Enlèvement des marchandises", section:"I — Règles générales",
    texte:`1. Les marchandises conduites dans les bureaux de douane ou dans les lieux désignés par le service des douanes ne peuvent y être enlevées, sans l'autorisation du service ou sans que les droits et taxes aient été préalablement payés, consignés ou garantis.\n\n2. Les marchandises conduites dans les bureaux de douane doivent être enlevées dès la délivrance de cette autorisation, sauf délais spécialement accordés par le service des douanes.`,
    exemple:"Après vérification et liquidation, la douane délivre le 'bon à enlever' (BAE) ou l'autorisation de mainlevée dans GAINDE. C'est seulement à ce moment que le transporteur peut venir chercher les marchandises (al.1). L'importateur doit avoir préalablement : soit payé les droits en totalité, soit consigné un dépôt de garantie, soit fourni une caution bancaire. Une fois le BAE délivré, l'importateur doit enlever ses marchandises rapidement (al.2) : les laisser indéfiniment dans le magasin de la douane après autorisation d'enlèvement l'expose à des frais de gardiennage.",
    motscles:["bon à enlever","mainlevée","autorisation d'enlèvement","droits payés","consignés","garantis","BAE","GAINDE","gardiennage"] },

  { num:143, titre:"Crédit d'enlèvement — Soumission cautionnée annuelle", chapitre:"IV — Enlèvement des marchandises", section:"II — Crédit d'enlèvement",
    texte:`1. Les redevables peuvent être admis à enlever leurs marchandises au fur et à mesure des vérifications, moyennant le dépôt entre les mains de l'autorité compétente du Trésor, d'une soumission cautionnée annuelle dont les conditions de recevabilité sont fixées par arrêté du Ministre chargé des finances.\n\n2. La soumission cautionnée garantit :\na) le paiement des droits et taxes exigibles ;\nb) le paiement d'une remise des droits et taxes liquidés ;\nc) le paiement d'une pénalité pour retard de paiement.\n\n3. Le délai accordé aux déclarants pour se libérer des droits et taxes est fixé à quinze (15) jours après délivrance du bon à enlever.`,
    exemple:"Un grand commissionnaire en douane qui traite 50 dossiers par mois signe en début d'année une soumission cautionnée annuelle auprès du Trésor, garantie par une banque. Cette garantie lui permet d'enlever les marchandises immédiatement après vérification, sans payer les droits à chaque fois (al.1 : 'au fur et à mesure des vérifications'). Il dispose ensuite de 15 jours après chaque bon à enlever pour régler les droits (al.3). Ce mécanisme accélère considérablement les opérations — le commissionnaire n'attend plus le paiement pour enlever.",
    motscles:["crédit d'enlèvement","soumission cautionnée annuelle","enlèvement immédiat","vérification","15 jours","bon à enlever","droits et taxes","remise","pénalité retard"] },

  { num:144, titre:"Responsabilité des comptables directs du Trésor", chapitre:"IV — Enlèvement des marchandises", section:"III — Responsabilité des comptables",
    texte:`1. Les comptables directs du Trésor sont chargés du recouvrement des droits, taxes et pénalités de retard. Les amendes, confiscations et produits des ventes sont recouvrés par des régisseurs désignés parmi les agents des douanes sous la responsabilité des comptables directs du Trésor.\n\n2. À peine d'engager sa responsabilité, l'autorité compétente du Trésor accorde le crédit d'enlèvement, en veillant à se conformer, scrupuleusement, aux obligations de vérification qui lui incombent, dans l'exercice de ses missions de comptable public.`,
    exemple:"Un comptable du Trésor affecté au bureau de douane de Dakar-Port est personnellement responsable des droits qu'il doit recouvrer. S'il accorde un crédit d'enlèvement sans vérifier la validité et la couverture de la soumission cautionnée (al.2), et que l'importateur disparaît sans payer, le comptable peut être personnellement mis en cause pour faute de gestion. La règle du comptable public sénégalais : responsabilité personnelle et pécuniaire des sommes manquantes.",
    motscles:["comptables Trésor","responsabilité personnelle","recouvrement droits","amendes confiscations","régisseurs","crédit d'enlèvement","vérification soumission","faute de gestion"] },

  { num:145, titre:"Agrément des cautions et garanties des engagements douaniers", chapitre:"IV — Enlèvement des marchandises", section:"III — Responsabilité des comptables",
    texte:`1. Les cautions garantissant les engagements relatifs aux acquits-à-caution, aux déclarations d'entrée en entrepôts, aux soumissions pour production de documents et aux soumissions contentieuses sont agréées par l'autorité compétente du Trésor.\n\n2. Le montant des garanties exigibles est fixé par l'autorité compétente du Trésor après consultation éventuelle de l'administration des douanes.\n\n3. L'acceptation des cautions garantissant les acquits-à-caution et les soumissions engage la responsabilité de l'autorité compétente du Trésor.`,
    exemple:"Un transitaire souhaite placer une cargaison de produits électroniques en transit vers le Mali (sous acquit-à-caution). Il doit fournir une caution bancaire au comptable du Trésor du bureau de douane de Dakar. Ce comptable agrée la banque garante et fixe le montant de la caution à 100% des droits et taxes potentiels (al.1 et 2). Si le transit n'est pas apuré et que l'importateur ne paye pas, le comptable actionne la caution bancaire (al.3) — mais s'il a mal évalué le montant ou accepté une caution insuffisante, sa responsabilité est engagée.",
    motscles:["cautions","acquits-à-caution","entrepôts","soumissions contentieuses","Trésor","montant garantie","responsabilité acceptation","banque garante"] },

  { num:146, titre:"Exportation maritime et aérienne — Mise à bord et magasins d'exportation", chapitre:"IV — Enlèvement des marchandises", section:"IV — Embarquement et conduite à l'étranger des marchandises destinées à l'exportation",
    texte:`1. Après accomplissement des formalités douanières, les marchandises destinées à être exportées par la voie maritime ou aérienne doivent être mises à bord des navires et aéronefs.\n\n2. Par dérogation à l'alinéa 1 du présent article, ces marchandises peuvent être constituées en magasin ou en aire d'exportation en attendant leur mise à bord.\n\n3. Les dispositions des articles 103, 105, 106 et 107 du présent code, relatives aux magasins et aires de dédouanement sont applicables aux magasins et aires d'exportation.`,
    exemple:"Un exportateur de phosphates a accompli toutes les formalités d'exportation (déclaration déposée, droits payés, visa douanier apposé). Les phosphates peuvent être : (a) directement chargés à bord du navire minéralier au quai (al.1) ; ou (b) stockés dans une aire d'exportation du Port de Dakar dans l'attente du prochain navire (al.2). Cette aire d'exportation est soumise aux mêmes règles que les magasins de dédouanement (al.3) : agrément DGD, durée de séjour limitée, engagement cautionné de l'exploitant.",
    motscles:["exportation maritime","exportation aérienne","mise à bord","magasin d'exportation","aire d'exportation","formalités douanières","phosphates","articles 103 105 106 107"] },

  { num:147, titre:"Lieux d'embarquement et autorisation d'embarquement des exportations", chapitre:"IV — Enlèvement des marchandises", section:"IV — Embarquement et conduite à l'étranger",
    texte:`1. Les marchandises destinées à être exportées par mer ne peuvent être embarquées ou transbordées que sur les quais des ports et rades où les bureaux de douane sont établis.\n\n2. Les marchandises destinées à être exportées par la voie aérienne ne peuvent être embarquées ou transbordées que sur un aéroport douanier.\n\n3. Aucune marchandise ne peut être embarquée ou transbordée sans l'autorisation expresse du service des douanes, dans les heures et sous les conditions fixées par décision du Directeur général des douanes.\n\n4. Sur la demande des intéressés et à leurs frais, les autorisations d'embarquement et de transbordement peuvent être accordées en dehors des lieux et heures visés ci-dessus.`,
    exemple:"Un exportateur de bois précieux ne peut pas charger ses grumes sur un bateau ancré à l'écart du Port de Dakar, dans un endroit discret sans bureau de douane (al.1 : quais des ports douaniers uniquement). Si le navire doit charger un dimanche soir (hors heures normales), l'exportateur demande une autorisation exceptionnelle payante (al.4). De même, un envoi de colis par DHL doit impérativement partir depuis l'aéroport Blaise Diagne (aéroport douanier), pas depuis une piste privée (al.2).",
    motscles:["lieux d'embarquement","quais des ports","aéroport douanier","autorisation d'embarquement","transbordement","hors heures","frais à la charge","Directeur général"] },

  { num:148, titre:"Exportation terrestre — Conduite directe à l'étranger", chapitre:"IV — Enlèvement des marchandises", section:"IV — Embarquement et conduite à l'étranger",
    texte:`1. Après accomplissement des formalités douanières, les marchandises destinées à être exportées par les voies terrestres doivent être conduites à l'étranger.\n\n2. Par dérogation à l'alinéa 1 du présent article, ces marchandises peuvent être constituées en magasin ou en aire d'exportation en attendant leur conduite à l'étranger.`,
    exemple:"Un exportateur sénégalais a accompli les formalités douanières pour exporter des arachides vers le Mali. Le camion doit se rendre directement à la frontière malienne (al.1) sans s'arrêter dans des entrepôts privés non autorisés. Si le camion n'est pas encore disponible, les arachides peuvent être stockées dans une aire d'exportation agréée au bureau de douane de Kidira (al.2) en attendant le départ, sous surveillance douanière.",
    motscles:["exportation terrestre","conduite à l'étranger","frontière","magasin d'exportation","aire d'exportation","formalités accomplies","camion"] },

  { num:149, titre:"Sortie des navires du port — Formalités obligatoires", chapitre:"IV — Enlèvement des marchandises", section:"IV — Embarquement et conduite à l'étranger",
    texte:`1. Aucun navire, chargé ou sur lest, ne peut sortir du port avant accomplissement des formalités douanières.\n\n2. Les documents relatifs au navire et à la cargaison doivent être présentés à toute réquisition des agents des douanes.`,
    exemple:"Le capitaine d'un cargo vide ('sur lest') souhaite quitter rapidement le Port de Dakar pour se rendre à Abidjan charger des cargaisons. Même vide (al.1 : 'chargé ou sur lest'), il doit accomplir les formalités de sortie : présenter le manifeste de sortie, les documents du navire et obtenir le 'congé de sortie' de la douane. Un agent des douanes monte à bord pour un dernier contrôle et peut exiger à tout moment les documents du navire et de la cargaison (al.2).",
    motscles:["sortie du port","formalités douanières","navire sur lest","navire chargé","congé de sortie","documents du navire","réquisition agents"] },

  { num:150, titre:"Permis de sortie des pirogues et petites embarcations", chapitre:"IV — Enlèvement des marchandises", section:"IV — Embarquement et conduite à l'étranger",
    texte:`1. Les pirogues et autres embarcations de moins de dix (10) tonneaux de jauge brute ne peuvent sortir des ports sans un permis des douanes quel que soit le point de la côte vers lequel elles doivent se diriger. Ce permis doit être présenté à toute réquisition des agents des douanes.\n\n2. Les dispositions de l'alinéa 1 du présent article ne s'appliquent pas aux bateaux et pirogues de nationalité sénégalaise se livrant à la pêche et dont les opérations ne sont soumises à aucune formalité de douane.`,
    exemple:"Une pirogue gambienne de 8 tonneaux qui a livré des marchandises à Ziguinchor veut repartir vers Banjul. Elle doit obligatoirement obtenir un permis de sortie de la douane de Ziguinchor (al.1) — même si elle part à vide. En revanche, les pirogues de pêche sénégalaises qui partent en mer tous les matins depuis Mbour ou Kayar sont totalement exemptées de cette formalité (al.2) — la douane ne peut pas bloquer la pêche artisanale nationale.",
    motscles:["pirogues","embarcations","10 tonneaux","permis de sortie","pêche artisanale","dispense","nationalité sénégalaise","congé"] },

  { num:151, titre:"Formalités de sortie des aéronefs — Renvoi à l'article 149", chapitre:"IV — Enlèvement des marchandises", section:"IV — Embarquement et conduite à l'étranger",
    texte:`Les dispositions de l'article 149 du présent article sont applicables aux aéronefs.`,
    exemple:"Comme pour les navires (Art. 149), aucun aéronef ne peut quitter l'aéroport Blaise Diagne avant d'avoir accompli toutes les formalités douanières de sortie : dépôt du manifeste de départ, déclarations des marchandises exportées, visa douanier de sortie, et présentation à tout moment des documents de bord à la réquisition des agents. Un avion cargo vide qui repart à vide vers Casablanca doit quand même obtenir son 'congé de départ' douanier.",
    motscles:["aéronefs","formalités de sortie","article 149","renvoi","manifeste départ","visa douanier","congé de départ","avion cargo"] },

  { num:152, titre:"Marine nationale et aéronefs militaires — Formalités de sortie", chapitre:"IV — Enlèvement des marchandises", section:"IV — Embarquement et conduite à l'étranger",
    texte:`Les commandants de la Marine nationale et les commandants des navires et aéronefs militaires sont tenus de remplir à la sortie, toutes les formalités auxquelles sont assujettis les capitaines de navires marchands et les commandants d'aéronefs commerciaux.`,
    exemple:"Un navire de guerre de la Marine nationale sénégalaise qui part en mission de surveillance maritime doit, avant de quitter le Port de Dakar, accomplir exactement les mêmes formalités de sortie qu'un cargo commercial : manifeste de sortie, déclaration des provisions de bord, visa douanier. Un C-130 militaire qui transporte du matériel doit passer par les mêmes procédures de sortie qu'un Boeing cargo. Aucune immunité militaire sur les formalités douanières à la sortie.",
    motscles:["Marine nationale","navires militaires","aéronefs militaires","formalités de sortie","capitaines marchands","commandants","égalité traitement","immunité douanière"] },

  { num:153, titre:"Vérification des déclarations après dédouanement", chapitre:"IV — Enlèvement des marchandises", section:"V — Vérification des déclarations après dédouanement",
    texte:`1. L'administration des douanes peut d'office, après mainlevée des marchandises, procéder à la révision de la déclaration.\n\n2. L'administration des douanes peut procéder à des enquêtes et à des contrôles après dédouanement de la régularité des opérations de dédouanement.\n\n3. Ces contrôles peuvent s'exercer auprès du déclarant, de l'importateur ou de l'exportateur, du destinataire ou de toute personne directement ou indirectement intéressée auxdites opérations, ainsi que de toute autre personne possédant les documents et données liés au dédouanement des marchandises.\n\n4. L'administration des douanes peut également procéder à la vérification des marchandises lorsqu'elles peuvent encore être représentées.\n\n5. Lorsqu'il résulte de la révision de la déclaration, des enquêtes et des contrôles après dédouanement que les dispositions qui régissent le régime douanier concerné ont été appliquées sur la base d'éléments inexacts ou incomplets, l'administration des douanes prend les mesures nécessaires pour rétablir la situation en tenant compte des nouveaux éléments dont elle dispose.`,
    exemple:"Une entreprise a importé 200 machines agricoles sous le régime d'exonération totale de droits (pour usage agricole). 18 mois plus tard, la douane effectue un contrôle après dédouanement (al.1 et 2) et découvre que 50 machines ont été revendues à des commerçants non agricoles — violation du régime douanier. La douane interroge l'importateur, l'acheteur final, le commissionnaire et le transporteur (al.3). Elle retrouve les 50 machines chez les acheteurs et les vérifie physiquement (al.4). Elle émet un rappel de droits et taxes sur les 50 machines détournées plus pénalités (al.5).",
    motscles:["contrôle après dédouanement","révision déclaration","après mainlevée","enquêtes","déclarant importateur exportateur","vérification physique","éléments inexacts","rappel droits","rétablissement situation"] },
];

/* ===================== TAB: QUIZ ===================== */
function TabQuiz() {
  const [state, setState] = useState({ started:false, curr:0, score:0, answers:[], finished:false, showExp:false });
  const q = QUIZ_DATA[state.curr];

  const start = () => setState({ started:true, curr:0, score:0, answers:[], finished:false, showExp:false });
  const answer = (i) => {
    if(state.answers[state.curr] !== undefined) return;
    const correct = i === q.a;
    setState(prev => ({
      ...prev,
      score: prev.score + (correct ? 1 : 0),
      answers: [...prev.answers.slice(0, prev.curr), i, ...prev.answers.slice(prev.curr+1)],
      showExp: true,
    }));
  };
  const next = () => {
    if(state.curr < QUIZ_DATA.length - 1) setState(prev => ({ ...prev, curr:prev.curr+1, showExp:false }));
    else setState(prev => ({ ...prev, finished:true }));
  };
  const reset = () => setState({ started:false, curr:0, score:0, answers:[], finished:false, showExp:false });

  if(!state.started) return (
    <div style={{ textAlign:"center", padding:"40px 0" }}>
      <div style={{ fontSize:48, marginBottom:16 }}>🎯</div>
      <h2 style={{ fontSize:22, fontWeight:700, color:T.text, marginBottom:8 }}>Quiz — Code des Douanes</h2>
      <p style={{ color:T.muted, fontSize:14, maxWidth:480, margin:"0 auto 24px", lineHeight:1.6 }}>Testez vos connaissances sur la Loi n°2014-10 du 28 février 2014. {QUIZ_DATA.length} questions pour préparer vos examens de douane.</p>
      <div style={{ display:"grid", gridTemplateColumns:"repeat(3,1fr)", gap:12, maxWidth:360, margin:"0 auto 28px" }}>
        <div style={{ background:T.card, border:`1px solid ${T.border}`, borderRadius:10, padding:"14px 10px", textAlign:"center" }}>
          <div style={{ fontSize:20, fontWeight:700, color:T.gold }}>{QUIZ_DATA.length}</div>
          <div style={{ fontSize:13, color:T.muted }}>Questions</div>
        </div>
        <div style={{ background:T.card, border:`1px solid ${T.border}`, borderRadius:10, padding:"14px 10px", textAlign:"center" }}>
          <div style={{ fontSize:20, fontWeight:700, color:T.blue }}>QCM</div>
          <div style={{ fontSize:13, color:T.muted }}>Format</div>
        </div>
        <div style={{ background:T.card, border:`1px solid ${T.border}`, borderRadius:10, padding:"14px 10px", textAlign:"center" }}>
          <div style={{ fontSize:20, fontWeight:700, color:T.green }}>✓</div>
          <div style={{ fontSize:13, color:T.muted }}>Explications</div>
        </div>
      </div>
      <button onClick={start} style={{ ...S.btnPrimary, fontSize:15, padding:"12px 36px" }}>Commencer le Quiz</button>
    </div>
  );

  if(state.finished) {
    const pct = Math.round((state.score / QUIZ_DATA.length) * 100);
    const level = pct >= 80 ? { label:"Excellent", color:T.green } : pct >= 60 ? { label:"Bien", color:T.amber } : { label:"À revoir", color:T.red };
    return (
      <div style={{ textAlign:"center", padding:"40px 0" }}>
        <div style={{ fontSize:48, marginBottom:16 }}>{pct >= 80 ? "🏆" : pct >= 60 ? "👍" : "📚"}</div>
        <h2 style={{ fontSize:22, fontWeight:700, color:T.text, marginBottom:6 }}>Quiz terminé !</h2>
        <div style={{ fontSize:48, fontWeight:700, color:level.color, margin:"16px 0 6px" }}>{pct}%</div>
        <div style={{ background:level.color+"22", color:level.color, display:"inline-block", padding:"4px 16px", borderRadius:20, fontSize:15, fontWeight:700, marginBottom:16 }}>{level.label}</div>
        <p style={{ color:T.muted, fontSize:14 }}>{state.score} bonne(s) réponse(s) sur {QUIZ_DATA.length} questions</p>
        <div style={{ background:T.card, border:`1px solid ${T.border}`, borderRadius:10, padding:20, maxWidth:600, margin:"24px auto", textAlign:"left" }}>
          <div style={{ fontSize:12, color:T.gold, fontWeight:700, marginBottom:12 }}>RÉVISION DES RÉPONSES</div>
          {QUIZ_DATA.map((qq, i) => {
            const correct = state.answers[i] === qq.a;
            return (
              <div key={i} style={{ padding:"10px 0", borderBottom:`1px solid ${T.border}`, display:"flex", gap:10 }}>
                <span style={{ color:correct?T.green:T.red, fontSize:14, flexShrink:0 }}>{correct?"✓":"✗"}</span>
                <div>
                  <div style={{ fontSize:12, color:T.text, marginBottom:3 }}>Q{i+1}. {qq.q}</div>
                  {!correct && <div style={{ fontSize:13, color:T.muted }}>Votre réponse : {qq.opts[state.answers[i]]} — Bonne réponse : <span style={{ color:T.green }}>{qq.opts[qq.a]}</span></div>}
                </div>
              </div>
            );
          })}
        </div>
        <button onClick={reset} style={{ ...S.btnPrimary, fontSize:14, padding:"10px 28px" }}>Recommencer</button>
      </div>
    );
  }

  const answered = state.answers[state.curr] !== undefined;
  const pctProgress = Math.round(((state.curr) / QUIZ_DATA.length) * 100);
  return (
    <div style={{ maxWidth:680, margin:"0 auto" }}>
      <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:16 }}>
        <div style={{ fontSize:15, color:T.muted }}>Question {state.curr+1} / {QUIZ_DATA.length}</div>
        <div style={{ fontSize:15, color:T.gold, fontWeight:600 }}>Score : {state.score}/{state.curr}</div>
      </div>
      <div style={{ background:T.border, borderRadius:4, height:6, marginBottom:24, overflow:"hidden" }}>
        <div style={{ background:T.gold, height:"100%", width:`${pctProgress}%`, transition:"width 0.3s" }} />
      </div>
      <div style={{ background:T.card, border:`1px solid ${T.border}`, borderRadius:12, padding:"24px 26px", marginBottom:16 }}>
        <div style={{ fontSize:13, color:T.gold, fontWeight:700, letterSpacing:"0.5px", marginBottom:12 }}>QUESTION {state.curr+1}</div>
        <div style={{ fontSize:16, fontWeight:600, color:T.text, lineHeight:1.6, marginBottom:24 }}>{q.q}</div>
        <div style={{ display:"grid", gap:10 }}>
          {q.opts.map((opt, i) => {
            let bg = T.surface, border = T.border, color = T.text;
            if(answered) {
              if(i === q.a) { bg = T.greenBg; border = T.green; color = T.text; }
              else if(i === state.answers[state.curr]) { bg = T.redBg; border = T.red; color = T.text; }
            }
            return (
              <button key={i} onClick={() => answer(i)}
                style={{ background:bg, border:`1px solid ${border}`, borderRadius:8, padding:"12px 16px", textAlign:"left", cursor:answered?"default":"pointer", color, fontSize:15, transition:"all 0.15s" }}
                onMouseEnter={e => { if(!answered) { e.currentTarget.style.borderColor=T.borderGold; e.currentTarget.style.background=T.cardHover; } }}
                onMouseLeave={e => { if(!answered) { e.currentTarget.style.borderColor=T.border; e.currentTarget.style.background=T.surface; } }}>
                <span style={{ color:answered && i===q.a ? T.green : answered && i===state.answers[state.curr] ? T.red : T.muted, fontWeight:700, marginRight:10 }}>{String.fromCharCode(65+i)}.</span>
                {opt}
              </button>
            );
          })}
        </div>
      </div>
      {state.showExp && (
        <div style={{ background:T.card, border:`1px solid ${state.answers[state.curr]===q.a?T.green:T.amber}`, borderRadius:10, padding:"14px 18px", marginBottom:16 }}>
          <div style={{ fontSize:13, fontWeight:700, color:state.answers[state.curr]===q.a?T.green:T.amber, marginBottom:6 }}>
            {state.answers[state.curr]===q.a ? "✓ BONNE RÉPONSE" : "✗ RÉPONSE INCORRECTE"}
          </div>
          <div style={{ fontSize:15, color:T.text, lineHeight:1.7 }}>{q.exp}</div>
        </div>
      )}
      {answered && (
        <div style={{ textAlign:"right" }}>
          <button onClick={next} style={{ ...S.btnPrimary }}>
            {state.curr < QUIZ_DATA.length-1 ? "Question suivante →" : "Voir les résultats"}
          </button>
        </div>
      )}
    </div>
  );
}

Réponds toujours en français, avec les références d'articles, de façon claire et structurée.`;

function TabAssistant() {
  const [msgs, setMsgs] = useState([{ role:"assistant", content:"Bonjour ! Je suis votre assistant spécialisé sur le Code des Douanes du Sénégal (Loi n°2014-10 du 28 février 2014). Posez-moi toutes vos questions sur les articles, les définitions, les régimes douaniers, les infractions ou les procédures. Je vous répondrai avec les références précises." }]);

  const endRef = useRef(null);

  useEffect(() => { endRef.current?.scrollIntoView({ behavior:"smooth" }); }, [msgs]);

  const send = async () => {
    if(!input.trim() || loading) return;
    const userMsg = input.trim();
    setInput("");
    setMsgs(prev => [...prev, { role:"user", content:userMsg }]);
    setLoading(true);
    try {
      const history = [...msgs, { role:"user", content:userMsg }].map(m => ({ role:m.role, content:m.content }));
      const res = await fetch("https://api.anthropic.com/v1/messages", {
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body:JSON.stringify({ model:"claude-sonnet-4-20250514", max_tokens:1000, system:SYSTEM, messages:history })
      });
      const data = await res.json();
      const reply = data.content?.find(b => b.type==="text")?.text || "Désolé, une erreur est survenue.";
      setMsgs(prev => [...prev, { role:"assistant", content:reply }]);
    } catch { setMsgs(prev => [...prev, { role:"assistant", content:"Erreur de connexion. Veuillez réessayer." }]); }
    setLoading(false);
  };

  const suggestions = ["Qu'est-ce que le drawback ?","Expliquez l'admission temporaire","Quelles sont les classes de délits douaniers ?","Comment est calculée la valeur en douane ?","Qu'est-ce qu'une zone franche ?"];

  return (
    <div style={{ maxWidth:680, margin:"0 auto" }}>

        <p style={{ color:T.muted, fontSize:15 }}>Posez vos questions sur la Loi n°2014-10 du 28 février 2014</p>
      </div>
      <div style={{ background:T.card, border:`1px solid ${T.border}`, borderRadius:12, minHeight:400, maxHeight:500, overflow:"auto", padding:20, marginBottom:14, display:"flex", flexDirection:"column", gap:14 }}>
        {msgs.map((m, i) => (
          <div key={i} style={{ display:"flex", justifyContent:m.role==="user"?"flex-end":"flex-start" }}>
            <div style={{ maxWidth:"82%", padding:"12px 16px", borderRadius:m.role==="user"?"12px 12px 4px 12px":"12px 12px 12px 4px", background:m.role==="user"?T.gold:T.surface, color:m.role==="user"?"#07090F":T.text, fontSize:15, lineHeight:1.7, whiteSpace:"pre-wrap" }}>
              {m.role==="assistant" && <div style={{ fontSize:12, color:T.gold, fontWeight:700, marginBottom:4 }}>ASSISTANT DOUANES SN</div>}
              {m.content}
            </div>
          </div>
        ))}
        {loading && (
          <div style={{ display:"flex", justifyContent:"flex-start" }}>
            <div style={{ padding:"12px 16px", borderRadius:"12px 12px 12px 4px", background:T.surface, color:T.muted, fontSize:15 }}>En cours de rédaction…</div>
          </div>
        )}
        <div ref={endRef} />
      </div>
      {msgs.length <= 1 && (
        <div style={{ display:"flex", flexWrap:"wrap", gap:8, marginBottom:12 }}>
          {suggestions.map(s => (
            <button key={s} onClick={() => { setInput(s); }} style={{ background:T.card, border:`1px solid ${T.border}`, color:T.muted, borderRadius:20, padding:"6px 14px", cursor:"pointer", fontSize:12 }}
              onMouseEnter={e => { e.currentTarget.style.borderColor=T.borderGold; e.currentTarget.style.color=T.gold; }}
              onMouseLeave={e => { e.currentTarget.style.borderColor=T.border; e.currentTarget.style.color=T.muted; }}>
              {s}
            </button>
          ))}
        </div>
      )}
      <div style={{ display:"flex", gap:10 }}>
        <input value={input} onChange={e => setInput(e.target.value)} onKeyDown={e => e.key==="Enter" && !e.shiftKey && send()}
          placeholder="Posez votre question sur le Code des Douanes..."
          style={{ ...S.input, flex:1, padding:"12px 16px" }} />
        <button onClick={send} disabled={loading||!input.trim()} style={{ ...S.btnPrimary, flexShrink:0, opacity:loading||!input.trim()?0.5:1 }}>Envoyer</button>
      </div>
    </div>
  );
}

                  <div style={{ fontSize:16, fontWeight:600, color:T.text, marginBottom:4 }}>{a.titre}</div>
                  <div style={{ display:"flex", gap:6, flexWrap:"wrap", marginBottom:4 }}>
                    <span style={{ background:color+"18", color, fontSize:12, padding:"3px 10px", borderRadius:20, fontWeight:600 }}>{trunc(a.chapitre.split("—")[1], 30) || a.chapitre}</span>
