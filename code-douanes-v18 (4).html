    motscles:["quantités représentées","déficit","droits taxes manquants","force majeure","prohibées valeur marché intérieur"] },

  { num:159, titre:"Transport empruntant le territoire étranger ou la mer", chapitre:"II — Transport via territoire étranger",
    texte:`1. Les marchandises nationales ou ayant acquitté les droits peuvent être autorisées à emprunter le territoire étranger, avec dispense des droits et taxes et prohibitions, lorsque leur transport ne peut avoir lieu directement sur le territoire douanier.\n2. Même dispense pour les marchandises transportées par mer d'un port à un autre du territoire douanier.\n3. Le transport doit être couvert par un acquit-à-caution ou un passavant.`,
    exemple:"Des marchandises de Ziguinchor vers Dakar passant par la Gambie (al.1) ou transportées par mer (al.2) bénéficient des mêmes dispenses. Le passavant remplace l'acquit-à-caution si les marchandises ne sont pas prohibées ni taxées à la sortie.",
    motscles:["territoire étranger Gambie","Casamance","transport maritime","passavant","dispense droits taxes","marchandises nationales"] },

  { num:160, titre:"Définition du transit", chapitre:"III — Transit",
    texte:`1. Le transit est le régime douanier sous lequel sont placées les marchandises transportées sous contrôle douanier d'un bureau de douane à un autre en suspension des droits et taxes, et autres mesures de prohibition.\n2. Les marchandises en transit sont transportées dans un délai fixé et suivant un itinéraire donné.\n3. Le transport par voie maritime est exclu du transit.`,
    exemple:"Un camion malien traverse le Sénégal avec des marchandises chinoises destinées à Bamako : transit douanier, droits sénégalais suspendus, itinéraire RN1 et délai fixés. Attention : le transport maritime entre deux ports est exclu du transit (al.3) — régime différent.",
    motscles:["transit douanier","suspension droits taxes","itinéraire délai","bureau de douane","transport maritime exclu"] },

  { num:161, titre:"Marchandises exclues du transit", chapitre:"III — Transit",
    texte:`1. Les marchandises exclues à titre permanent du transit sont désignées par les autorités communautaires.\n2. Des circulaires du Directeur général des douanes peuvent prononcer d'autres exclusions à titre temporaire.`,
    exemple:"L'UEMOA exclut certaines matières premières stratégiques du transit classique (exclusion permanente al.1). En cas de crise sécuritaire au Sahel, le Directeur général peut temporairement exclure certains produits chimiques du transit par circulaire (al.2).",
    motscles:["exclusions transit","autorités communautaires UEMOA","Directeur général","circulaire","exclusions permanentes temporaires"] },

  { num:162, titre:"Conditions du transport en transit", chapitre:"III — Transit",
    texte:`Les transports en transit sont effectués dans les conditions prévues aux articles 154 à 158. Le Directeur général des douanes peut autoriser le remplacement de la déclaration détaillée par une déclaration simplifiée.`,
    exemple:"Un opérateur économique agréé (OEA) peut obtenir une dérogation pour utiliser une déclaration simplifiée dans ses opérations de transit vers le Mali. L'acquit-à-caution reste obligatoire (Art. 154).",
    motscles:["déclaration simplifiée","dérogation Directeur général","acquit-à-caution","conditions transit","OEA"] },

  { num:163, titre:"Représentation des marchandises en transit", chapitre:"III — Transit",
    texte:`Les marchandises présentées au départ au service des douanes doivent être représentées, en même temps que les acquits-à-caution :\na) en cours de route, à toute réquisition du service des douanes ;\nb) à destination, au bureau des douanes dans les délais fixés sur l'acquit-à-caution.`,
    exemple:"Un convoi Dakar-Bamako contrôlé à Tambacounda : le conducteur présente immédiatement marchandises et acquit-à-caution (al.a). À Kidira, il représente tout dans le délai inscrit sur l'acquit (al.b). Refus = infraction douanière.",
    motscles:["représentation marchandises","réquisition en route","bureau destination","délai acquit-à-caution","Kidira Tambacounda"] },

  { num:164, titre:"Conditions de décharge des engagements de transit", chapitre:"III — Transit",
    texte:`Il n'est donné décharge des engagements souscrits que lorsque, au bureau de destination, les marchandises en mêmes quantité et qualité ont été :\na) placées en magasins ou aires de dédouanement ou d'exportation ;\nb) exportées ;\nc) déclarées sous un nouveau régime douanier.`,
    exemple:"Arrivée à Kidira : décharge accordée si les marchandises (même quantité et qualité) sont (a) mises en magasin de dédouanement, (b) exportées vers le Mali, ou (c) placées sous un nouveau régime (entrepôt, AT). Toute différence bloque la décharge.",
    motscles:["décharge engagements","même quantité qualité","magasin dédouanement","exportation","nouveau régime douanier","apurement transit"] },

  { num:165, titre:"Droits sur marchandises en transit déclarées pour la consommation", chapitre:"III — Transit",
    texte:`Lorsqu'elles sont déclarées pour la consommation au bureau de destination, les marchandises transportées en transit sont soumises aux droits et taxes en vigueur à la date d'enregistrement de la déclaration en détail pour la consommation, sauf application de l'article 136 alinéa 2.`,
    exemple:"Marchandises mises en transit le 1er janvier (taux 20%). Si finalement déclarées pour consommation à Ziguinchor le 15 janvier (taux 15% depuis le 5 janvier) : le taux de 15% s'applique (date de la déclaration de consommation).",
    motscles:["taux date déclaration consommation","changement destination","mise à la consommation transit","article 136 taux favorable"] },

  { num:166, titre:"Transit ordinaire — Conditions et garanties", chapitre:"III — Transit",
    texte:`1. Le transit ordinaire permet le transport des marchandises sous douane d'un bureau à un autre sur le territoire douanier, en suspension des droits et taxes.\n2. Les marchandises passibles de droits sont expédiées sous acquit-à-caution et plombs de douane. Le plombage des colis est obligatoire sauf dispense.\n3. Le transit ordinaire peut être utilisé par n'importe quel usager.\n4. Le service des douanes peut faire escorter les marchandises.\n5. Des mesures de simplification peuvent être accordées sur demande.`,
    exemple:"Un particulier importe une voiture d'occasion de Dakar pour Thiès : il demande un transit ordinaire (accessible à tout usager al.3). La douane plombe la voiture (al.2). Pour les marchandises précieuses, une escorte douanière peut être prévue (al.4).",
    motscles:["transit ordinaire","plombs douane","acquit-à-caution","tout usager","escorte douanière","plombage obligatoire"] },

  { num:167, titre:"Déclaration au départ en transit ordinaire", chapitre:"III — Transit",
    texte:`A l'entrée, les marchandises expédiées sous le régime du transit ordinaire sont déclarées en détail et vérifiées dans les mêmes conditions que les marchandises déclarées pour la consommation.\nToutefois, le Directeur général des douanes peut autoriser le remplacement de la déclaration en détail par une déclaration simplifiée.`,
    exemple:"Des appareils électroniques en transit Dakar→Saint-Louis font l'objet d'une déclaration en détail et d'une vérification au bureau de Dakar. Un OEA peut obtenir une dérogation pour une déclaration simplifiée.",
    motscles:["déclaration détail transit","vérification départ","déclaration simplifiée","Directeur général","mêmes conditions consommation"] },

  { num:168, titre:"Remise de l'acquit-à-caution à destination", chapitre:"III — Transit",
    texte:`Dès l'arrivée à destination, l'acquit-à-caution doit être remis au bureau des douanes où la déclaration assignant un régime douanier aux marchandises doit être faite.`,
    exemple:"Arrivée à Saint-Louis : le conducteur remet immédiatement l'acquit-à-caution au bureau des douanes. C'est là que la déclaration de mise à la consommation sera déposée. Garder l'acquit sans le remettre = infraction.",
    motscles:["remise acquit-à-caution","bureau destination","déclaration régime douanier","obligation remise immédiate"] },

  { num:169, titre:"Garantie en transit ordinaire", chapitre:"III — Transit",
    texte:`1. Les formes et le montant de la garantie sont fixés par arrêté du Ministre chargé des finances.\n2. L'autorité compétente du Trésor peut fixer la garantie à un montant aussi peu élevé que possible, compte tenu des droits et taxes à l'importation ou à l'exportation éventuellement exigibles.`,
    exemple:"Pour un transit de 50 tonnes de riz (droits applicables : 5 millions FCFA), l'arrêté fixe la garantie à 100% des droits suspendus = 5M FCFA. Le comptable du Trésor peut la réduire à 2M FCFA pour un opérateur de confiance (al.2).",
    motscles:["garantie transit","arrêté Ministre finances","montant garantie","Trésor","réduction garantie","article 145"] },

  { num:170, titre:"Expédition avec déclaration sommaire au premier bureau", chapitre:"III — Transit",
    texte:`Le Directeur général des douanes peut dispenser de la déclaration en détail au premier bureau les marchandises qui doivent être expédiées sur un deuxième bureau pour y être déclarées en détail. L'opération peut être faite sous couvert d'une déclaration sommaire comportant : les engagements de l'acquit-à-caution, le nombre et nature des colis, la marque et numéro des colis, le poids, la nature des marchandises, l'identification des moyens de transport. Les titres de transport doivent être produits à l'appui.`,
    exemple:"Un navire arrive à Dakar avec des marchandises destinées à être déclarées à Thiès. Le Directeur général dispense de la déclaration complète à Dakar : une déclaration sommaire (3 conteneurs, 45t, matériel industriel + connaissements) suffit.",
    motscles:["déclaration sommaire","premier bureau","deuxième bureau","dispense déclaration détail","Directeur général","titres de transport","connaissements"] },

  { num:171, titre:"Obligations des transporteurs au premier bureau d'entrée", chapitre:"III — Transit",
    texte:`Les transporteurs doivent, au premier bureau d'entrée :\na) produire les titres de transport concernant lesdites marchandises ;\nb) souscrire la déclaration sommaire visée à l'article 170.`,
    exemple:"À Dakar, l'agent maritime est obligé de remettre : (a) les connaissements (Bills of Lading) originaux et (b) signer la déclaration sommaire. L'absence de l'un ou l'autre constitue une irrégularité douanière.",
    motscles:["obligations transporteurs","premier bureau entrée","titres de transport","connaissements","déclaration sommaire"] },

  { num:172, titre:"Vérification de la déclaration sommaire et scellés", chapitre:"III — Transit",
    texte:`Les agents des douanes peuvent procéder à la vérification des énonciations de la déclaration sommaire, au contrôle des moyens de transport et faire apposer, sur ceux-ci, les scellés qu'ils jugent nécessaires. Les titres de transport doivent être annexés à cette déclaration.`,
    exemple:"À Dakar, les douaniers constatent que le poids déclaré (45t) semble sous-estimé. Ils procèdent à un pesage et apposent des scellés GPS sur les conteneurs avant leur départ vers Thiès. Les connaissements sont annexés à la déclaration sommaire.",
    motscles:["vérification déclaration sommaire","scellés douane","titres transport annexés","pesage contrôle","scellés électroniques GPS"] },

  { num:173, titre:"Conformité entre déclaration détaillée et déclaration sommaire", chapitre:"III — Transit",
    texte:`Les mentions de la déclaration en détail déposée au bureau de destination doivent être conformes à celles de la déclaration sommaire.`,
    exemple:"Déclaration sommaire à Dakar : '3 conteneurs, 45t, matériel industriel'. La déclaration détaillée à Thiès doit correspondre exactement. Toute différence = fausse déclaration (Art. 383 et s.) et nullité de la procédure.",
    motscles:["conformité déclarations","déclaration détail bureau destination","déclaration sommaire","fausse déclaration","infraction douanière"] },

  { num:174, titre:"Transit international — Définition et entreprises agréées", chapitre:"III — Transit",
    texte:`1. Le transit international permet le transport des marchandises sous douane entre le territoire douanier et celui d'un autre pays, en suspension des droits, taxes et mesures de prohibition. Il peut être régi par des dispositions conventionnelles bilatérales, communautaires ou internationales.\n2. Peuvent être effectués en transit international les transports comportant ou non le franchissement des frontières communautaires.\n3. Le régime ne peut être utilisé que par des entreprises de transport agréées. Pour les nationales, l'agrément est accordé par le Ministre des transports ; pour les étrangères, conformément aux conventions internationales.\n4. Les entreprises agréées doivent permettre à la douane l'accès à leurs magasins où les marchandises attendent un régime définitif.\n5. Le Ministre des finances détermine, avec le Ministre des transports, les conditions de constitution, fermeture et scellement des véhicules.`,
    exemple:"Dakar Express Fret (agréée par le Ministre des transports, al.3) achemine des marchandises de Dakar vers Conakry. Ce transit international est régi par la Convention CEDEAO sur le transport routier. Les entrepôts de l'entreprise sont accessibles 24h/24 à la douane (al.4).",
    motscles:["transit international","entreprises transport agréées","agrément Ministre transports","convention CEDEAO","scellés véhicules","accès magasins douane"] },

  { num:175, titre:"Catégories d'entrepôt de douane", chapitre:"IV — Entrepôt de douane",
    texte:`L'entrepôt de douane est constitué de l'entrepôt de stockage et l'entrepôt industriel.`,
    exemple:"Deux grandes catégories : (1) Entrepôt de STOCKAGE (simple conservation en suspension de droits — Art. 176 à 200) et (2) Entrepôt INDUSTRIEL (transformation sous surveillance permanente — Art. 201 à 207). Un entrepôt du port = stockage ; une raffinerie de sucre sous douane = industriel.",
    motscles:["entrepôt stockage","entrepôt industriel","deux catégories","conservation transformation"] },

  { num:176, titre:"Entrepôt de stockage — Définition et effets", chapitre:"IV — Entrepôt de douane",
    texte:`1. Le régime de l'entrepôt de stockage est le régime douanier en application duquel des marchandises importées ou à exporter, sont stockées sous contrôle de la douane dans un lieu désigné, en suspension des droits et taxes exigibles.\n2. Sauf dispositions spéciales contraires, la mise en entrepôt suspend l'application des prohibitions et autres mesures économiques, fiscales ou douanières, et entraîne tout ou partie des effets attachés à l'exportation des marchandises entreposées.\n3. Il existe trois catégories d'entrepôt de stockage : l'entrepôt public, l'entrepôt privé, l'entrepôt spécial.`,
    exemple:"Des voitures japonaises placées en entrepôt de stockage au port de Dakar : les droits de douane (35%) sont suspendus. Les 3 types : public (Port Autonome), privé (CFAO Motors agréé), spécial (produits pétroliers à la SAAS).",
    motscles:["entrepôt stockage","suspension droits taxes","trois catégories","entrepôt public privé spécial","suspension prohibitions"] },

  { num:177, titre:"Marchandises exclues de l'entrepôt de stockage", chapitre:"IV — Entrepôt de douane",
    texte:`1. Des interdictions ou restrictions peuvent être prononcées à titre permanent par les autorités communautaires ou à titre temporaire par les autorités nationales.\n2. Les marchandises déclarées pour un régime autre que l'entrepôt de stockage ne peuvent y séjourner. Toutefois, le Directeur général peut autoriser des exceptions.\n3. Sont interdits à titre permanent : a) les marchandises prohibées à titre absolu (Art. 21) ; b) les marchandises étrangères sans indication d'origine ; c) les marchandises violant la propriété intellectuelle (marques, brevets) ; d) les marchandises interdites (Art. 24) ; e) certaines marchandises selon les installations.`,
    exemple:"Un importateur tente de placer en entrepôt des chaussures 'Nike' contrefaites (al.3c — violation marques). La douane refuse : exclusion permanente. Des déchets toxiques (prohibition absolue Art. 21) sont aussi exclus (al.3a).",
    motscles:["exclusions entrepôt","interdictions permanentes","prohibées absolues","contrefaçon marques","propriété intellectuelle","Directeur général dérogation"] },

  { num:178, titre:"Marchandises admissibles en entrepôt de stockage", chapitre:"IV — Entrepôt de douane",
    texte:`Sous réserve des dispositions du précédent article, sont admissibles en entrepôt de stockage :\n1. à l'importation, toutes les marchandises soumises soit aux droits de douane, taxes ou prohibitions à titre relatif, soit à d'autres mesures économiques, fiscales ou douanières.\n2. à l'exportation, les marchandises désignées par arrêté du Ministre chargé des finances.`,
    exemple:"Des climatiseurs importés de Chine (soumis aux droits) peuvent être admis en entrepôt de stockage (al.1). Des arachides sénégalaises destinées à l'export peuvent aussi y être stockées (al.2), si elles figurent sur la liste d'admissibles à l'export fixée par arrêté.",
    motscles:["marchandises admissibles","importation exportation","droits taxes prohibitions relatives","arrêté Ministre finances"] },

  { num:179, titre:"Délai de séjour en entrepôt de stockage", chapitre:"IV — Entrepôt de douane",
    texte:`Les marchandises peuvent séjourner en entrepôt de stockage pendant un délai maximum d'un (01) an fixé par arrêté du Ministre chargé des finances. L'arrêté fixe les délais et comporte certaines restrictions quant à l'entrée, le séjour et la sortie de certaines marchandises et quant au type de régime d'entrepôt.`,
    exemple:"Des textiles entrent en entrepôt le 1er mars : délai maximum au 28 février suivant (1 an). Si expiration sans action, constitués d'office en dépôt (Art. 199). Prorogation possible sur demande (Art. 194) si marchandises en bon état.",
    motscles:["délai séjour un an","arrêté Ministre finances","destination douanière","expiration délai","dépôt Art.199","prorogation Art.194"] },

  { num:180, titre:"Entrepôt public — Établissement et concession", chapitre:"IV — Entrepôt de douane",
    texte:`1. L'entrepôt public est concédé par arrêté du Ministre chargé des finances, par ordre de priorité, aux collectivités locales, au Port autonome ou à la Chambre de commerce. Toutefois, lorsque la nécessité s'impose, l'entrepôt public peut être concédé à d'autres personnes morales.\n2. La concession ne peut être rétrocédée.\n3. Le concessionnaire perçoit des frais de magasinage dont le tarif doit être approuvé par arrêté conjoint du Ministre des finances et du Ministre du commerce.\n4. Des décisions du Ministre des finances peuvent, à titre temporaire, constituer en entrepôt public les locaux destinés à des foires, expositions ou autres manifestations.`,
    exemple:"Le Port Autonome de Dakar gère l'entrepôt public du port (priorité au PAD, al.1). Pour le FIDAK (Foire Internationale, al.4), le CICES peut être temporairement érigé en entrepôt public. La concession du PAD ne peut pas être rétrocédée à une société privée (al.2).",
    motscles:["entrepôt public","concession arrêté Ministre","Port Autonome","collectivités locales","Chambre de commerce","frais magasinage","FIDAK CICES","concession non rétrocédable"] },

  { num:181, titre:"Procédure de concession et exploitation de l'entrepôt public", chapitre:"IV — Entrepôt de douane",
    texte:`La procédure de concession et les conditions d'exploitation de l'entrepôt public sont fixées par arrêté du Ministre chargé des finances.`,
    exemple:"L'arrêté fixe : durée de la concession (10 à 15 ans renouvelable), obligations de sécurité, accès permanent aux agents des douanes, tenue d'un registre d'entrées/sorties. Le PAD doit respecter ces conditions sous peine de révocation de sa concession.",
    motscles:["procédure concession","conditions exploitation","arrêté Ministre finances","registre entrées sorties","durée concession"] },

  { num:182, titre:"Utilisation de l'entrepôt public", chapitre:"IV — Entrepôt de douane",
    texte:`L'entrepôt public est ouvert à toute personne pour l'entreposage de marchandises de toute nature, à l'exception de celles qui en sont exclues par application des dispositions de l'article 177 du présent code et de celles qui ne peuvent être stockées qu'en entrepôt spécial.`,
    exemple:"Un petit importateur de Thiès sans entrepôt privé peut utiliser l'entrepôt public du port de Dakar (ouvert à tout opérateur). Cependant, pas de produits pétroliers (entrepôt spécial obligatoire) ni de contrefaçons (exclues par Art. 177).",
    motscles:["entrepôt public ouvert tous","toute personne","exclusions article 177","entrepôt spécial réservé","accès universel"] },

  { num:183, titre:"Responsabilité de l'entrepositaire et du concessionnaire en entrepôt public", chapitre:"IV — Entrepôt de douane",
    texte:`1. L'entrepositaire et le concessionnaire doivent acquitter les droits et taxes sur les marchandises entrées en entrepôt public qu'ils ne peuvent représenter en mêmes quantité et qualité, sans préjudice des pénalités encourues. Si les marchandises sont prohibées, ils sont tenus en outre au paiement d'une somme égale à leur valeur.\n2. Le Directeur général peut autoriser la destruction des marchandises avariées ou leur taxation dans l'état.\n3. Les déficits provenant de l'extraction des poussières, pierres et impuretés sont admis en franchise.\n4. La perte due à un cas de force majeure ou à des causes dépendant de la nature des marchandises donne lieu à dispense de paiement.\n5. Le vol sans implication ni négligence peut donner lieu à dispense si la preuve est dûment établie.\n6. Règles spécifiques selon le montant de l'assurance souscrite.`,
    exemple:"PAD (concessionnaire) + importateur Diallo (entrepositaire) ont 100t de riz. À la sortie, 95t présentables. Les 5t manquantes → droits (al.1). Incendie d'origine électrique ayant détruit 3t (force majeure al.4) → exonération. Vol prouvé par PV de police sans négligence du PAD (al.5) → dispense possible.",
    motscles:["responsabilité entrepositaire concessionnaire","mêmes quantité qualité","droits taxes manquants","force majeure dispense","vol preuve établie","déficit poussières franchise"] },

  { num:184, titre:"Entrepôt privé — Établissement et types", chapitre:"IV — Entrepôt de douane",
    texte:`1. L'autorisation d'ouvrir un entrepôt privé banal ou particulier peut être accordée par le Directeur général des douanes :\n— l'entrepôt privé banal est accordé aux personnes faisant profession d'entreposer des marchandises pour le compte de tiers, ou pour les foires et expositions ;\n— l'entrepôt privé particulier est accordé aux entreprises industrielles/commerciales pour leur usage exclusif.\n2. L'entrepôt privé ne peut être établi que dans les localités siège d'un bureau de douane.\n3. La procédure d'octroi et les conditions d'exploitation sont fixées par arrêté du Ministre.`,
    exemple:"SLS (Société de Logistique) obtient un entrepôt privé BANAL pour stocker pour le compte de CFAO, Total, etc. PATERSEN AFRIQUE obtient un entrepôt privé PARTICULIER pour ses propres climatiseurs uniquement. Les deux doivent être dans une localité avec bureau de douane (al.2).",
    motscles:["entrepôt privé banal particulier","Directeur général autorisation","usage exclusif","pour compte de tiers","localité bureau douane"] },

  { num:185, titre:"Marchandises admissibles en entrepôt privé et responsabilité", chapitre:"IV — Entrepôt de douane",
    texte:`1. L'entrepôt privé banal est ouvert aux marchandises de toute nature, sous réserve des dispositions de l'article 177 et à l'exception de celles qui ne peuvent être stockées qu'en entrepôt spécial.\n2. L'entrepôt privé particulier est ouvert uniquement aux marchandises désignées dans l'autorisation.\n3. Les dispositions de l'alinéa 1 de l'article 183 sont applicables à l'entrepôt privé, même en cas de vol ou de sinistre.`,
    exemple:"IMPORTANT (al.3) : même en cas de vol à mains armées prouvé, l'entrepositaire privé particulier reste responsable des droits sur les marchandises disparues — contrairement à l'entrepôt public (Art. 183 al.5). Le régime privé est plus rigoureux.",
    motscles:["entrepôt privé banal toute nature","entrepôt particulier marchandises désignées","responsabilité vol sinistre","article 183 applicable","restrictions article 177"] },

  { num:186, titre:"Entrepôt spécial — Trois catégories", chapitre:"IV — Entrepôt de douane",
    texte:`L'entrepôt spécial comprend l'entrepôt spécial de produits non pétroliers, l'entrepôt spécial de produits pétroliers et l'entrepôt spécial de produits énergétiques.`,
    exemple:"Trois sous-types : (1) NON PÉTROLIER : produits chimiques dangereux, médicaments (Art. 187-188) ; (2) PÉTROLIER : tanks SAR à Mbao (Art. 189-191) ; (3) ÉNERGÉTIQUE : bioéthanol, gaz naturel (Art. 192). Chaque type a ses règles propres.",
    motscles:["entrepôt spécial trois catégories","non pétrolier","pétrolier","énergétique","SAR Mbao"] },

  { num:187, titre:"Entrepôt spécial de produits non pétroliers — Établissement", chapitre:"IV — Entrepôt de douane",
    texte:`1. L'entrepôt spécial de produits non pétroliers est autorisé par décision du Directeur général des douanes, pour le stockage de marchandises dont le séjour en entrepôt public présente des dangers particuliers ou dont la conservation exige des installations spéciales.\n2. La procédure d'octroi et les conditions d'exploitation sont fixées par arrêté du Ministre des finances.`,
    exemple:"Pfizer Sénégal obtient un entrepôt spécial non pétrolier pour ses vaccins (conservation à -20°C — installations spéciales). ICS (Industries Chimiques) obtient un entrepôt pour ses acides (dangers particuliers en entrepôt ordinaire).",
    motscles:["entrepôt spécial non pétrolier","Directeur général décision","dangers particuliers","installations spéciales","vaccins","produits chimiques"] },

  { num:188, titre:"Entrepôt spécial non pétrolier — Séjour des marchandises", chapitre:"IV — Entrepôt de douane",
    texte:`1. Les dispositions des alinéas 1, 2, 3, 4 et 6 de l'article 183 sont applicables à l'entrepôt spécial non pétrolier.\n2. Le Directeur général des douanes peut fixer une limite forfaitaire aux déficits admissibles en franchise, et aux pertes dues à la nature des marchandises.\n3. Un arrêté du Ministre peut limiter les destinations douanières à la sortie de l'entrepôt spécial non pétrolier.`,
    exemple:"Pour l'entrepôt de produits chimiques d'ICS, le Directeur général fixe une limite forfaitaire de 0,5% de déficits en franchise (évaporation normale). Le Ministre peut décider qu'à la sortie, les produits ne peuvent être que mis à la consommation ou réexportés (pas de transit).",
    motscles:["article 183 applicable","limite forfaitaire déficits","nature marchandises","destinations limitées sortie","évaporation produits chimiques"] },

  { num:189, titre:"Entrepôt spécial de produits pétroliers — Définition et exploitants", chapitre:"IV — Entrepôt de douane",
    texte:`1. L'entrepôt de produits pétroliers dans lequel les produits pétroliers sont reçus, détenus ou expédiés en suspension des droits et taxes est dénommé entrepôt spécial de stockage de produits pétroliers.\n2. Les personnes ayant la qualité d'entrepositaire agréé peuvent seules exploiter un tel entrepôt.`,
    exemple:"La SAR à Mbao et la SENSTOCK sont des entrepositaires agréés pour les produits pétroliers. Leurs tanks de stockage constituent des entrepôts spéciaux pétroliers. L'essence, le gasoil et le kérosène y sont détenus en suspension des droits. Seul un entrepositaire agréé peut exploiter ces installations.",
    motscles:["entrepôt spécial pétrolier","entrepositaire agréé","SAR Mbao","SENSTOCK","produits pétroliers","essence gasoil kérosène"] },

  { num:190, titre:"Autorisation et comptabilité de l'entrepôt pétrolier", chapitre:"IV — Entrepôt de douane",
    texte:`1. La création, l'exploitation et toute modification substantielle doivent être autorisées par l'administration des douanes.\n2. Des arrêtés du Ministre déterminent les manipulations autorisées.\n3. L'entrepositaire agréé est responsable de toutes les opérations. Il est redevable des droits et taxes lors des manquants et doit présenter une caution solvable.\n4. L'entrepositaire doit : a) tenir une comptabilité des stocks et des mouvements ; b) présenter les produits à toute réquisition de la douane.\n5. La cession des produits doit être déclarée ; les obligations du cédant sont transférées au cessionnaire.`,
    exemple:"La SAR veut agrandir ses tanks de 50% (modification substantielle al.1) → autorisation douane obligatoire. Elle tient un logiciel de comptabilité matière (al.4a). Lors d'un recensement surprise, la douane constate un manquant de 10 000 litres → droits à payer (al.3). Si la SAR cède ses stocks à TOTAL, la douane doit être notifiée (al.5).",
    motscles:["autorisation modification","comptabilité stocks mouvements","manquants droits taxes","caution solvable","recensement surprise","cession déclaration","transfert obligations"] },

  { num:191, titre:"Pertes en entrepôt pétrolier", chapitre:"IV — Entrepôt de douane",
    texte:`1. Les pertes de produits placés en entrepôt spécial de stockage de produits pétroliers ne sont pas soumises au paiement des droits et taxes s'il est justifié :\na) qu'elles résultent d'un cas fortuit ou d'un cas de force majeure ;\nb) qu'elles sont inhérentes à la nature des produits.\n2. Des arrêtés du Ministre peuvent fixer une limite forfaitaire aux pertes admissibles en franchise pour chacun des produits et pour chaque mode de transport.`,
    exemple:"La SAR connaît des pertes naturelles par évaporation (al.1b : inhérentes aux produits volatils). L'arrêté fixe une tolérance de 0,3%/mois pour l'essence. Si la foudre frappe un tank et détruit 500 000 litres (force majeure al.1a) → exonération sur présentation des rapports.",
    motscles:["pertes produits pétroliers","cas fortuit force majeure","inhérentes nature produits","évaporation tolérance","limite forfaitaire"] },

  { num:192, titre:"Entrepôt spécial de produits énergétiques", chapitre:"IV — Entrepôt de douane",
    texte:`1. L'entrepôt spécial de produits énergétiques est l'établissement dans lequel les produits énergétiques (carburant ou combustible, autres que pétrole, gaz naturel, houille, lignites et coke) sont détenus, reçus ou expédiés en suspension des droits et taxes.\n2. Seuls les entrepositaires agréés peuvent l'exploiter.\n3. L'entrepôt spécial de produits énergétiques est créé, modifié et géré selon les principes prévus aux articles 189 à 191.\n4. Les conditions d'application sont fixées par arrêté du Ministre.`,
    exemple:"Avec le développement des énergies renouvelables au Sénégal, une société importe du bioéthanol (carburant végétal — ni pétrole ni gaz naturel). Elle doit disposer d'un entrepôt spécial énergétique agréé, géré selon les mêmes règles que l'entrepôt pétrolier (Art. 189 à 191 applicables).",
    motscles:["entrepôt spécial énergétique","bioéthanol","carburant combustible","hors pétrole gaz houille","entrepositaire agréé","articles 189-191 applicables"] },

  { num:193, titre:"Déclaration d'entrée en entrepôt de stockage et cession", chapitre:"IV — Entrepôt de douane",
    texte:`1. La déclaration d'entrée en entrepôt de stockage est obligatoirement souscrite par un commissionnaire en douane agréé, sous réserve des dispositions prévues à l'alinéa 3 de l'article 122.\n2. En cas de cession de marchandises en entrepôt de stockage, les obligations du cédant sont transférées au cessionnaire, sous réserve qu'une déclaration en détail soit levée.`,
    exemple:"Pour placer des textiles en entrepôt, le déclarant doit obligatoirement passer par un commissionnaire en douane agréé (al.1). Si les textiles sont vendus en cours de séjour (al.2), un bon de cession douanier est établi et l'acheteur reprend toutes les obligations → c'est lui qui paiera les droits à la sortie.",
    motscles:["commissionnaire douane agréé","déclaration entrée entrepôt","cession transfert obligations","acheteur reprend obligations","article 122"] },

  { num:194, titre:"Prorogation du délai de séjour en entrepôt", chapitre:"IV — Entrepôt de douane",
    texte:`Exceptionnellement et à condition que les marchandises soient en bon état, les délais de séjour en entrepôt de stockage peuvent être prorogés par le Directeur général des douanes, sur la demande des entrepositaires.`,
    exemple:"Équipements industriels (délai 1 an expirant bientôt, usine retardée) : demande de prorogation de 3 mois au Directeur général. Conditions : marchandises en bon état (vérification possible) + demande avant l'expiration du délai initial.",
    motscles:["prorogation délai séjour","bon état marchandises","Directeur général demande","vérification état","avant expiration délai"] },

  { num:195, titre:"Manipulations autorisées en entrepôt de stockage", chapitre:"IV — Entrepôt de douane",
    texte:`Des décisions du Directeur général des douanes déterminent les manipulations dont les produits placés en entrepôt de stockage peuvent faire l'objet, ainsi que les conditions auxquelles ces manipulations sont subordonnées.`,
    exemple:"En entrepôt de stockage, pas de transformation (rôle de l'entrepôt industriel). Mais le Directeur général autorise les 'manipulations usuelles' : reconditionnement, tri, pesage, étiquetage. Un entrepositaire qui transforme significativement (mélange, assemblage) sans autorisation commet une infraction.",
    motscles:["manipulations autorisées","Directeur général","manipulations usuelles","reconditionnement tri","pas de transformation"] },

  { num:196, titre:"Expédition entre entrepôts et déficits", chapitre:"IV — Entrepôt de douane",
    texte:`En cas d'expédition de marchandises d'un entrepôt vers un autre entrepôt ou vers un bureau de douane sous le couvert d'un titre de transit, l'entrepositaire expéditeur doit, sur les déficits qui sont constatés, payer les droits et taxes ou leur valeur, s'il s'agit de marchandises prohibées, sans préjudice des pénalités encourues.`,
    exemple:"CFAO Motors transfère 50 véhicules de son entrepôt de Dakar vers Thiès (sous titre de transit). À Thiès, seulement 48 véhicules constatés. CFAO Motors Dakar (entrepositaire expéditeur) est responsable des droits sur les 2 manquants + pénalités.",
    motscles:["transfert entre entrepôts","titre de transit","déficits entrepôt expéditeur","droits taxes manquants","pénalités encourues"] },

  { num:197, titre:"Destinations à la sortie d'entrepôt et droits applicables", chapitre:"IV — Entrepôt de douane",
    texte:`1. Les marchandises en entrepôt de stockage peuvent recevoir à leur sortie les mêmes destinations douanières que si elles provenaient de l'importation directe.\n2. Lorsqu'elles sont déclarées pour la consommation, les droits sont perçus d'après l'espèce tarifaire et sur la base des quantités constatées à la sortie.\n3. Pour les marchandises ayant subi des manipulations avec adjonction de produits locaux, la valeur ou la quantité de ces produits est soustraite de l'assiette des droits.\n4. Les produits en entrepôt de stockage apurant des opérations de perfectionnement actif doivent être réexportés.`,
    exemple:"100t de riz thai sortent pour mise à la consommation (al.2) : droits calculés sur les quantités réellement constatées à la sortie. Si 5t de riz local ont été mélangées (al.3), ces 5t sont déduites de l'assiette. Destinations possibles (al.1) : consommation, transit, entrepôt industriel, exportation.",
    motscles:["destinations sortie entrepôt","quantités constatées sortie","adjonction produits locaux déduction","réexportation perfectionnement actif"] },

  { num:198, titre:"Droits et taxes applicables — Dates de référence", chapitre:"IV — Entrepôt de douane",
    texte:`1. En cas de mise à la consommation en suite d'entrepôt, les droits applicables sont ceux en vigueur à la date d'enregistrement de la déclaration pour la consommation.\n2. Pour les déficits, les droits sont ceux en vigueur à la date de la constatation du déficit.\n3. En cas d'enlèvement irrégulier, les droits sont perçus à la date de l'enlèvement. Si la date est inconnue, il est fait application du taux le plus élevé en vigueur depuis l'entrée en entrepôt.\n4. La valeur à considérer est celle des marchandises aux dates visées, déterminée selon l'article 18.`,
    exemple:"Textiles entrés le 1er mars (taux 20%). Déclarés consommation le 1er août (taux 15%) → taux applicable : 15% (al.1). Déficit constaté le 15 juin (taux 20%) → 20% s'applique au déficit (al.2). Vol à date inconnue → taux le plus élevé depuis l'entrée (al.3) — mesure anti-fraude.",
    motscles:["date déclaration consommation","taux en vigueur","enlèvement irrégulier taux plus élevé","date constatation déficit","article 18 valeur"] },

  { num:199, titre:"Expulsion des entrepôts à l'expiration du délai", chapitre:"IV — Entrepôt de douane",
    texte:`1. A l'expiration du délai de séjour ou lorsqu'elles cessent de bénéficier du régime suspensif, les marchandises se trouvant dans les entrepôts de stockage doivent aussitôt être évacuées pour toute destination autorisée.\n2. A défaut, lesdites marchandises sont constituées d'office en dépôt de douane, conformément aux dispositions de l'article 252 du présent code.`,
    exemple:"Machines industrielles à l'expiration du délai le 30 juin : sortie IMMÉDIATE obligatoire (al.1). Sans action du propriétaire, la douane constitue d'office les machines en dépôt de douane dès le 1er juillet (al.2 + Art. 252). Les frais de dépôt s'accumulent et la douane peut vendre les biens aux enchères.",
    motscles:["expiration délai","évacuation obligation","constitution dépôt office","article 252","vente enchères","frais dépôt"] },

  { num:200, titre:"Modalités d'application de l'entrepôt de stockage", chapitre:"IV — Entrepôt de douane",
    texte:`Des arrêtés du Ministre chargé des finances déterminent, en tant que de besoin, les modalités d'application des dispositions de la présente section.`,
    exemple:"Le Ministre des finances prend des arrêtés précisant les procédures GAINDE pour les déclarations d'entrepôt, les garanties à fournir pour chaque type d'entrepôt, les conditions de contrôle douanier et les formulaires à utiliser.",
    motscles:["arrêtés Ministre finances","modalités application","GAINDE","procédures informatiques","agréments entrepositaires"] },

  { num:201, titre:"Entrepôt industriel — Définition et objet", chapitre:"IV — Entrepôt industriel",
    texte:`L'entrepôt industriel est un établissement placé sous le contrôle de l'administration des douanes, où les entreprises qui travaillent pour l'exportation ou à la fois pour l'exportation et le marché intérieur peuvent être autorisées à procéder à la mise en œuvre de marchandises importées en suspension des droits et taxes dont elles sont passibles.`,
    exemple:"SUNEOR importe des graines d'arachide en suspension des droits dans son entrepôt industriel agréé. Elle les transforme en huile : une partie exportée vers l'Europe, l'autre vendue au Sénégal avec paiement des droits correspondants. La douane surveille en permanence les entrées et sorties.",
    motscles:["entrepôt industriel","contrôle douane permanent","exportation marché intérieur","mise en oeuvre","suspension droits taxes","SUNEOR","transformation"] },

  { num:202, titre:"Bureaux de douane compétents pour l'entrepôt industriel", chapitre:"IV — Entrepôt industriel",
    texte:`Les opérations de l'entreprise bénéficiant du régime de l'entrepôt industriel peuvent être effectuées dans tous les bureaux de douane compétents.`,
    exemple:"SUNEOR a des usines à Ziguinchor, Saint-Louis et Dakar. Son autorisation couvre toutes ses usines : elle peut importer ses graines via Dakar ou Saint-Louis indifféremment. Pas besoin d'une nouvelle autorisation pour chaque bureau.",
    motscles:["tous bureaux douane","entrepôt industriel multi-sites","compétence nationale","autorisation nationale"] },

  { num:203, titre:"Renvoi à l'admission temporaire pour l'entrepôt industriel", chapitre:"IV — Entrepôt industriel",
    texte:`Sous réserve des dispositions particulières contenues dans les articles 204 à 207, les marchandises susceptibles d'être mises en œuvre en entrepôt industriel, les produits fabriqués admis en compensation des comptes et les conditions dans lesquelles s'opère cette compensation sont les mêmes qu'en admission temporaire.`,
    exemple:"Les règles de l'entrepôt industriel s'appuient sur celles de l'admission temporaire (Art. 208–227) : mêmes marchandises éligibles, même mécanisme de compensation. Les Art. 204 à 207 contiennent les exceptions propres à l'entrepôt industriel.",
    motscles:["renvoi admission temporaire","compensation comptes","marchandises éligibles identiques","articles 204-207 exceptions"] },

  { num:204, titre:"Autorisation d'entrepôt industriel et délais", chapitre:"IV — Entrepôt industriel",
    texte:`1. Le bénéfice du régime de l'entrepôt industriel est accordé par décision du Directeur général des douanes.\n2. La décision fixe, le cas échéant, les quantités de marchandises, le délai de séjour dans la limite d'un an, et les pourcentages respectifs des produits compensateurs à exporter obligatoirement et de ceux qui peuvent être versés à la consommation. A l'expiration du délai et sauf prorogation, les droits et taxes afférents aux marchandises deviennent immédiatement exigibles.`,
    exemple:"SUNEOR obtient l'autorisation d'importer 50 000t/an de graines en entrepôt industriel. La décision fixe : délai de transformation = 6 mois, 70% de l'huile à exporter, 30% vendable au Sénégal. Après 6 mois, si des graines non transformées restent, les droits deviennent immédiatement exigibles.",
    motscles:["Directeur général autorisation","délai un an maximum","pourcentages exportation consommation","droits exigibles expiration","produits compensateurs"] },

  { num:205, titre:"Cessions et fabrications scindées en entrepôt industriel", chapitre:"IV — Entrepôt industriel",
    texte:`1. Sauf autorisation du Directeur général des douanes, les marchandises importées sous le régime de l'entrepôt industriel ne peuvent faire l'objet de cessions durant leur séjour sous ce régime, ni réexportées ni mises à la consommation en l'état.\n2. Les fabrications scindées entre plusieurs établissements bénéficiaires du régime peuvent être autorisées par le Directeur général des douanes.`,
    exemple:"SUNEOR ne peut pas vendre ses graines brutes à un tiers pendant leur séjour en entrepôt industriel (interdiction de cession sans autorisation). Ni les réexporter brutes. Par contre, si le raffinage se fait dans une usine partenaire, une chaîne de fabrication scindée est possible avec l'accord du Directeur général (al.2).",
    motscles:["cession interdite","pas réexportation état","autorisation Directeur général","fabrication scindée","plusieurs établissements"] },

  { num:206, titre:"Droits lors de la mise à la consommation des produits de l'entrepôt industriel", chapitre:"IV — Entrepôt industriel",
    texte:`1. En cas de mise à la consommation des produits compensateurs, les droits à percevoir sont soit ceux afférents aux marchandises importées, soit ceux afférents aux produits compensateurs, suivant la taxation la plus favorable, d'après l'espèce et l'état des marchandises constatés à leur entrée en entrepôt industriel.\n2. Les droits applicables sont ceux en vigueur à la date d'enregistrement de la déclaration d'entrée en entrepôt industriel ; la valeur à déclarer étant celle des marchandises importées à la même date.`,
    exemple:"SUNEOR met à la consommation 30% de son huile. Les droits : le plus favorable entre (a) droits sur les graines importées (matière première) ou (b) droits sur l'huile (produit fini). SUNEOR choisit l'option la plus favorable. Les taux utilisés sont ceux en vigueur à la date d'entrée des graines (al.2) — pas ceux du jour de la mise à la consommation.",
    motscles:["taxation la plus favorable","produits compensateurs","matière première vs produit fini","date entrée entrepôt industriel","article 18 valeur"] },

  { num:207, titre:"Arrêtés d'application de l'entrepôt industriel", chapitre:"IV — Entrepôt industriel",
    texte:`Des arrêtés du Ministre chargé des finances déterminent, en tant que de besoin, les conditions d'application des dispositions de la présente section, notamment le pourcentage de réexportation obligatoire.`,
    exemple:"L'arrêté fixe notamment : le taux minimum de 60% de réexportation obligatoire pour les industries agro-alimentaires, les modalités de tenue de la comptabilité matière et les conditions d'audit douanier annuel.",
    motscles:["arrêtés Ministre finances","pourcentage réexportation obligatoire","comptabilité matière","audit douanier"] },

  { num:208, titre:"Admission temporaire — Définition générale", chapitre:"V — Admission temporaire",
    texte:`1. L'admission temporaire est le régime douanier qui permet de recevoir dans le territoire douanier en suspension totale ou partielle des droits et taxes à l'importation, certaines marchandises, dans un but défini et destinées à être réexportées, dans un délai déterminé.\n2. Peuvent être importées sous ce régime les marchandises destinées : a) à recevoir une transformation, une ouvraison ou un complément de main-d'œuvre dans le territoire douanier ; b) ou à être employées en l'état.\n3. Les décisions indiquent la nature du perfectionnement et les conditions dans lesquelles les marchandises doivent être employées en l'état.`,
    exemple:"Une grue allemande importée pour construire un immeuble à Dakar (employée en l'état, al.2b). Du tissu brut français importé pour être teint et cousu au Sénégal (transformation al.2a). Dans les deux cas, droits suspendus sous condition de réexportation dans le délai accordé.",
    motscles:["admission temporaire définition","suspension droits taxes","transformation ouvraison","employé en état","réexportation obligatoire","délai déterminé"] },

  { num:209, titre:"Admission temporaire pour perfectionnement actif", chapitre:"V — Admission temporaire",
    texte:`L'admission temporaire pour perfectionnement actif est le régime douanier qui permet de recevoir dans le territoire douanier, en suspension des droits et taxes à l'importation, certaines marchandises destinées à subir une transformation, une ouvraison ou une réparation et à être ultérieurement réexportées.`,
    exemple:"Un fabricant sénégalais de vêtements importe du tissu brut de Chine en perfectionnement actif : importé sans droits de douane, transformé en vêtements finis au Sénégal, puis exporté vers l'Europe. Condition sine qua non : les vêtements doivent être réexportés — vente locale interdite sauf conditions de l'Art. 226.",
    motscles:["perfectionnement actif","suspension totale droits","transformation réparation ouvraison","réexportation obligatoire","valeur ajoutée sénégalaise"] },

  { num:210, titre:"Suspension totale en perfectionnement actif et déchets", chapitre:"V — Admission temporaire",
    texte:`Les marchandises admises pour perfectionnement actif bénéficient de la suspension totale des droits et taxes à l'importation. Toutefois, les produits, y compris les déchets, provenant de l'ouvraison ou de la transformation et qui ne sont pas exportés ou traités de manière à leur ôter toute valeur commerciale, peuvent être soumis à l'acquittement des droits et taxes.`,
    exemple:"Importation de 100 kg de tissu en perfectionnement actif. Export de 90 kg de vêtements + 10 kg de chutes (déchets). Si les chutes sont brûlées (aucune valeur commerciale) → pas de droits. Si les chutes sont revendues sur le marché local → droits de douane exigibles sur ces 10 kg.",
    motscles:["suspension totale perfectionnement actif","déchets commercialisables","valeur commerciale","chutes tissu","droits sur déchets vendus"] },

  { num:211, titre:"Perfectionnement actif pour marchandises sous d'autres régimes", chapitre:"V — Admission temporaire",
    texte:`Le perfectionnement actif n'est pas limité aux marchandises qui sont importées directement de l'étranger, mais peut être également autorisé pour les marchandises déjà placées sous un autre régime douanier.`,
    exemple:"Des matières premières en entrepôt de stockage au port de Dakar peuvent être transférées directement en admission temporaire pour perfectionnement actif sans retourner à l'étranger pour une nouvelle importation. Souplesse inter-régimes.",
    motscles:["pas limité importation directe","autre régime douanier","transfert régimes","entrepôt vers perfectionnement actif","changement régime autorisé"] },

  { num:212, titre:"Autorisation préalable pour le perfectionnement actif", chapitre:"V — Admission temporaire",
    texte:`1. Les circonstances dans lesquelles le perfectionnement actif est subordonné à une autorisation préalable et les autorités habilitées à délivrer cette autorisation sont définies par arrêté du Ministre chargé des finances.\n2. L'autorisation de perfectionnement actif indique notamment les conditions dans lesquelles les opérations permises sont effectuées.`,
    exemple:"Pour le perfectionnement actif des matériels de BTP (valeur élevée), l'arrêté exige une autorisation préalable du Directeur général des douanes. L'autorisation précise : liste des machines, délai de séjour (18 mois), bureau compétent, garanties financières.",
    motscles:["autorisation préalable","arrêté Ministre finances","Directeur général","conditions opérations","délai séjour autorisé","garanties financières"] },

  { num:213, titre:"Perfectionnement passif — Définition", chapitre:"V — Admission temporaire",
    texte:`L'admission temporaire pour perfectionnement passif est le régime douanier qui permet d'exporter temporairement des marchandises qui se trouvent en libre circulation dans le territoire douanier, en vue de leur faire subir à l'étranger une transformation, une ouvraison, une réparation ou un complément de main-d'œuvre et de les réimporter ensuite en exonération totale ou partielle des droits et taxes à l'importation.`,
    exemple:"Un industriel sénégalais exporte ses machines endommagées en France pour réparation. À la réimportation, il bénéficie d'une exonération sur la valeur ajoutée à l'étranger (coût de réparation uniquement). Sans ce régime, la machine réimportée serait taxée à 100% sur sa valeur totale.",
    motscles:["perfectionnement passif","exportation temporaire","libre circulation","réparation à l'étranger","réimportation exonération","valeur ajoutée étrangère"] },

  { num:214, titre:"Autorisation pour le perfectionnement passif", chapitre:"V — Admission temporaire",
    texte:`Les cas dans lesquels l'admission temporaire pour perfectionnement passif est subordonnée à une autorisation préalable et les autorités habilitées à délivrer cette autorisation sont fixés par arrêté du Ministre chargé des Finances.`,
    exemple:"Pour l'export temporaire d'un avion sénégalais vers Toulouse pour révision majeure, l'arrêté exige une autorisation préalable du Directeur général (valeur très élevée). Pour un ordinateur en garantie, une procédure simplifiée s'applique.",
    motscles:["autorisation préalable perfectionnement passif","arrêté Ministre finances","autorités habilitées","procédure simplifiée faible valeur"] },

  { num:215, titre:"Exonération à la réimportation après perfectionnement passif", chapitre:"V — Admission temporaire",
    texte:`Sur demande du bénéficiaire, le Ministre chargé des finances autorise, en exonération totale ou partielle des droits et taxes, la réimportation des marchandises exportées temporairement pour perfectionnement passif si elles sont renvoyées en l'état. Cette exonération n'est pas applicable aux droits pour lesquels un remboursement ou une remise a déjà été accordé à l'occasion de l'exportation temporaire.`,
    exemple:"Machine exportée en France pour simple vérification technique (sans modification) : sur demande, le Ministre autorise l'exonération totale à la réimportation. Si à l'export des droits avaient déjà fait l'objet d'un drawback, l'exonération ne s'applique pas à ces droits — pas de double avantage.",
    motscles:["exonération réimportation","renvoyée en état","pas double avantage","drawback et exonération incompatibles","demande bénéficiaire"] },

  { num:216, titre:"Apurement du perfectionnement passif par exportation définitive", chapitre:"V — Admission temporaire",
    texte:`A l'exception des cas dans lesquels la réimportation des marchandises exportées temporairement pour perfectionnement passif est obligatoire, l'apurement du perfectionnement passif doit pouvoir être obtenu par la déclaration des marchandises pour l'exportation définitive.`,
    exemple:"Un artisan exporte temporairement ses bijoux en Belgique pour les faire graver. Il décide finalement de les vendre directement en Belgique : il peut apurer son perfectionnement passif en déclarant les bijoux à l'exportation définitive, sans les réimporter au Sénégal.",
    motscles:["apurement exportation définitive","sans réimportation obligatoire","exportation définitive apurement","souplesse perfectionnement passif"] },

  { num:217, titre:"Admission temporaire exceptionnelle", chapitre:"V — Admission temporaire",
    texte:`L'admission temporaire exceptionnelle est le régime douanier qui permet de recevoir dans le territoire douanier en suspension totale des droits et taxes, certaines marchandises importées destinées à être réexportées en l'état, dans un délai déterminé.`,
    exemple:"Un ambassadeur américain importe temporairement sa voiture pour la durée de sa mission diplomatique. Elle sera réexportée en l'état lors de son départ. Droits totalement suspendus pendant la mission. Ce régime s'applique aussi aux équipements de tournages cinématographiques à Dakar.",
    motscles:["admission temporaire exceptionnelle","suspension totale","réexportée en état","voiture diplomatique","équipements tournage"] },

  { num:218, titre:"Cas d'admission temporaire exceptionnelle", chapitre:"V — Admission temporaire",
    texte:`L'admission temporaire est accordée par décision du Directeur général, en suspension totale des droits et taxes :\n— aux produits importés dans un but défini et destinés à être réexportés en l'état, sans avoir subi de modification autre que la dépréciation normale du fait de leur utilisation ;\n— aux objets importés pour essais ou expériences, foires ou expositions ;\n— aux emballages importés pleins et destinés à être réexportés vides ou remplis de produits autres que ceux qu'ils contenaient ;\n— aux produits importés à titre exceptionnel et présentant un caractère personnel.`,
    exemple:"Quatre cas : (1) Matériel de forage importé pour prospecter en Casamance puis réexporté ; (2) Échantillons de machines au FIDAK réexportés après la foire ; (3) Bouteilles de gaz françaises importées pleines, réexportées vides (emballages) ; (4) Montre de luxe d'un touriste en séjour de 2 mois (caractère personnel).",
    motscles:["quatre cas AT exceptionnelle","essais expériences","foires expositions FIDAK","emballages vides remplis","caractère personnel","Directeur général décision"] },

  { num:219, titre:"Admission temporaire spéciale", chapitre:"V — Admission temporaire",
    texte:`1. L'admission temporaire spéciale est le régime douanier par lequel des personnes physiques ou morales peuvent importer pour une période déterminée en suspension des droits et taxes et sur autorisation du Directeur général des douanes une certaine catégorie de matériels notamment destinés à l'exécution de travaux présentant un caractère incontestable d'utilité publique.\n2. Le bénéfice de ce régime peut être étendu à d'autres matériels eu égard à leur destination et/ou à leur utilisation commerciale.`,
    exemple:"Une entreprise chinoise construit l'autoroute Dakar-Touba et importe temporairement 200 engins de chantier (pelles, graders, compacteurs) en admission temporaire spéciale (utilité publique incontestable al.1). Autorisés par le Directeur général pour 36 mois (durée du chantier). Réexportés en Chine à la fin.",
    motscles:["admission temporaire spéciale","utilité publique incontestable","matériels engins chantier","Directeur général autorisation","autoroute infrastructure","travaux publics"] },

  { num:220, titre:"Acquits-à-caution en admission temporaire et durée", chapitre:"V — Admission temporaire",
    texte:`1. Les marchandises bénéficiant de l'admission temporaire doivent être placées sous le couvert d'acquits-à-caution par lesquels les importateurs s'engagent à satisfaire aux obligations et à supporter les sanctions applicables en cas d'infraction.\n2. La durée de séjour en admission temporaire est fixée, dans la limite d'un (01) an, par le texte accordant l'admission temporaire.\n3. La durée peut, à titre exceptionnel, être prorogée par le Directeur général des douanes, dans les cas dûment justifiés et sous réserve du renouvellement des engagements souscrits.`,
    exemple:"Matériel de BTP en admission temporaire pour 12 mois + prorogation de 6 mois (chantier retardé, demande au Directeur général avec renouvellement de la caution bancaire). L'acquit-à-caution avec la banque garantit les droits suspendus pendant toute la période.",
    motscles:["acquit-à-caution AT","durée un an maximum","prorogation Directeur général","renouvellement engagements","caution bancaire","sanctions non décharge"] },

  { num:221, titre:"Déclaration d'admission temporaire au nom de l'utilisateur", chapitre:"V — Admission temporaire",
    texte:`Sauf dérogations exceptionnelles accordées par le Directeur général des douanes, la déclaration d'admission temporaire doit être établie au nom de la personne qui mettra en œuvre ou emploiera les marchandises importées.`,
    exemple:"Un chantier naval importe une grue en admission temporaire pour ses propres besoins : déclaration au nom du chantier naval (utilisateur effectif). Si une société de leasing loue la grue à plusieurs entreprises, une dérogation du Directeur général est nécessaire pour établir la déclaration au nom du bailleur.",
    motscles:["déclaration au nom utilisateur","personne qui met en oeuvre","dérogation Directeur général","leasing location","utilisateur effectif"] },

  { num:222, titre:"Sort des marchandises à la fin de l'admission temporaire", chapitre:"V — Admission temporaire",
    texte:`Les marchandises importées en admission temporaire doivent être, avant l'expiration du délai imparti et après avoir reçu la transformation prévue :\na) soit réexportées hors du territoire douanier ;\nb) soit constituées en entrepôt de stockage en vue de leur réexportation ultérieure, sauf dispositions contraires du texte ayant accordé l'admission temporaire.`,
    exemple:"Modules solaires assemblés en admission temporaire : avant expiration du délai, (a) directement exportés vers le Mali ou (b) placés en entrepôt de stockage en attendant l'acheteur malien. Dans les deux cas, pas de mise à la consommation au Sénégal sans payer les droits.",
    motscles:["sort marchandises admission temporaire","réexportation obligatoire","entrepôt stockage réexportation ultérieure","avant expiration délai","pas mise consommation sans droits"] },

  { num:223, titre:"Interdiction de cession en admission temporaire", chapitre:"V — Admission temporaire",
    texte:`Sauf autorisation du Directeur général des douanes, les marchandises importées sous le régime de l'admission temporaire ne doivent faire l'objet d'aucune cession durant leur séjour sous ce régime.`,
    exemple:"Une entreprise a importé une excavatrice en AT pour un chantier. Elle ne peut pas la vendre à une autre entreprise pendant la durée de l'AT sans autorisation du Directeur général. Sans autorisation, la cession = infraction douanière.",
    motscles:["interdiction cession","admission temporaire","autorisation Directeur général","vente interdite","infraction cession"] },

  { num:224, titre:"Compensation des comptes par produits de même qualité", chapitre:"V — Admission temporaire",
    texte:`Dans les cas d'admission temporaire pour perfectionnement actif, les décisions prévues à l'alinéa 2 de l'article 208 peuvent autoriser la compensation des comptes d'admission temporaire par des produits provenant de la mise en œuvre, par le soumissionnaire, de marchandises de même qualité dont les caractéristiques techniques sont identiques à celles des marchandises importées en admission temporaire.`,
    exemple:"Un fabricant de chaussures importe du cuir brésilien en perfectionnement actif, mais possède aussi du cuir argentin de qualité identique. La douane peut autoriser que les chaussures exportées soient partiellement fabriquées avec le cuir argentin local (compensation par équivalence), évitant les ruptures de stock.",
    motscles:["compensation par équivalence","même qualité caractéristiques identiques","compensation comptes AT","produits locaux équivalents","fabrication mixte"] },

  { num:225, titre:"Recours aux laboratoires en admission temporaire", chapitre:"V — Admission temporaire",
    texte:`Le service des douanes peut requérir des laboratoires en ce qui concerne :\na) la détermination des éléments particuliers de prise en charge des marchandises dans les comptes d'admission temporaire ;\nb) la composition des produits admis en compensation des comptes d'admission temporaire.`,
    exemple:"La douane soupçonne une substitution de matières premières. Elle fait appel au Laboratoire National d'Analyse pour vérifier (al.a) les compositions chimiques des matières premières en compte et (al.b) si le sucre de compensation a bien les mêmes caractéristiques que le sucre importé.",
    motscles:["laboratoire douanes","prise en charge marchandises","composition produits compensation","analyses chimiques","vérification qualité","substitution fraude"] },

  { num:226, titre:"Apurement des comptes d'admission temporaire", chapitre:"V — Admission temporaire",
    texte:`1. Le régime normal d'apurement des comptes d'admission temporaire est la réexportation.\n2. Toutefois, le Directeur général peut autoriser l'apurement par :\na) la mise à la consommation des produits compensateurs, les droits étant ceux afférents aux marchandises importées constatés à leur entrée en admission temporaire ;\nb) la destruction des produits, qui lorsqu'elle retire toute valeur, n'entraîne aucune perception de droits et taxes.\n3. Dans le cas de réexportation, il peut être fait obligation de produire un document délivré par les autorités douanières du pays de destination.`,
    exemple:"Apurement normal : réexportation des vêtements finis (al.1). Alternatif : (al.2a) vente des vêtements au Sénégal avec droits calculés sur le tissu brut importé. (al.2b) Vêtements détruits après défaut grave (incinération sous contrôle douanier) → aucun droit dû. Réexportation vers le Mali → certificat d'arrivée douane malienne (al.3).",
    motscles:["apurement réexportation normale","mise consommation droits matières premières","destruction sans droits","Directeur général autorisation","certificat arrivée pays destination","trois modes apurement"] },

  { num:227, titre:"Arrêtés d'application de l'admission temporaire", chapitre:"V — Admission temporaire",
    texte:`Des arrêtés du Ministre chargé des finances déterminent, en tant que de besoin, les conditions d'application du présent chapitre.`,
    exemple:"Les arrêtés précisent les délais maximaux par catégorie : matériels médicaux : 24 mois, matériels BTP : 12 mois, emballages : 6 mois. Ils fixent aussi les documents requis, les taux de garantie et les procédures de contrôle.",
    motscles:["arrêtés Ministre finances","délais par catégorie","matériels médicaux BTP emballages","taux garantie","procédures contrôle"] },

  { num:228, titre:"Usines exercées — Définition et produits", chapitre:"VI — Usines exercées",
    texte:`1. Les usines exercées sont des établissements placés sous la surveillance permanente du service des douanes en vue de permettre la mise en œuvre ou la fabrication de certains produits importés en suspension totale ou partielle des droits et taxes dont ils sont passibles.\n2. La liste des produits admis en usine exercée est fixée par arrêté du Ministre des finances. Cette liste comprend notamment la production d'huiles minérales.\n3. La production d'huiles minérales s'entend de l'extraction et de l'obtention de toutes huiles minérales, par tous procédés et à partir de toutes matières premières.\n4. Les personnes morales ayant la qualité de concessionnaire peuvent seules exploiter une usine exercée.`,
    exemple:"La SAR de Mbao est l'usine exercée sénégalaise par excellence : elle raffine du pétrole brut importé (huiles minérales, al.2) sous surveillance permanente 24h/24 de la douane (al.1). Seule la SAR, en tant que concessionnaire agréé (al.4), peut exploiter cette usine.",
    motscles:["usines exercées","surveillance permanente douane","huiles minérales","SAR Mbao","concessionnaire exclusif","raffinage pétrole","suspension droits taxes"] },

  { num:229, titre:"Installations obligatoirement placées sous le régime d'usine exercée", chapitre:"VI — Usines exercées",
    texte:`1. Doivent être placés sous le régime de l'usine exercée :\na) les installations d'extraction d'huiles minérales ;\nb) les établissements de production traitant ou raffinant des huiles brutes de pétrole, des gaz de pétrole et autres hydrocarbures gazeux ;\nc) les établissements de production fabriquant des huiles minérales pour lesquelles un taux de taxe est fixé.\n2. Peuvent notamment être effectuées dans les usines exercées des fabrications connexes de produits autres que des huiles minérales, dont la liste est fixée par arrêté du Ministre après avis du Ministre de l'énergie.`,
    exemple:"Avec les découvertes pétrolières sénégalaises (Sangomar, Yakaar-Teranga), toutes les installations d'extraction offshore (al.1a) et les futures raffineries (al.1b) devront être en régime d'usine exercée. La SAR peut aussi produire de l'asphalte (fabrication connexe al.2) si cette production est sur la liste ministérielle.",
    motscles:["installations extraction","raffinage pétrole brut","hydrocarbures","fabrications connexes","liste Ministre énergie","Sangomar Yakaar"] },

  { num:230, titre:"Suspension des droits à l'entrée en usine exercée", chapitre:"VI — Usines exercées",
    texte:`1. A l'entrée dans les usines exercées, la suspension des droits de douane est réservée :\na) aux huiles brutes de pétrole ou de minéraux bitumineux et aux gaz de pétrole et autres hydrocarbures gazeux, destinés à être traités ou raffinés ;\nb) aux produits spécialement désignés par arrêté conjoint, lorsqu'ils doivent y subir un traitement attaché à une tarification douanière privilégiée à la mise à consommation.\n2. En cas de mise à la consommation, les droits et taxes suspendus sont perçus d'après la valeur et le taux applicables à la date de la déclaration d'entrée en usine exercée.\n3. Si les produits sont utilisés à des fins autres que celles prévues à l'alinéa 1, les droits de douane sont immédiatement exigibles.`,
    exemple:"La SAR reçoit du pétrole brut nigérian (al.1a) : droits suspendus. A la mise à la consommation de l'essence produite (al.2), les droits sont calculés selon les taux en vigueur à la date d'entrée du brut en usine. Si la SAR détourne une partie du brut pour ses propres camions (usage non prévu al.3) → droits immédiatement exigibles.",
    motscles:["suspension droits entrée usine","huiles brutes minéraux bitumineux","tarification privilégiée","taux date entrée usine","détournement droits immédiats","arrêté conjoint"] },

  { num:231, titre:"Autorisation d'exploitation de l'usine exercée", chapitre:"VI — Usines exercées",
    texte:`La mise en service, l'exploitation ainsi que toute modification substantielle des conditions d'exploitation de l'usine exercée doivent être autorisées par l'administration des douanes dans des conditions fixées par arrêté du Ministre chargé des finances.`,
    exemple:"La SAR souhaite ajouter une unité de craquage catalytique (modification substantielle) : elle doit obtenir une nouvelle autorisation de l'administration des douanes avant de mettre en service cette unité. La demande inclut les plans, capacités et mesures de contrôle douanier.",
    motscles:["autorisation mise en service","modification substantielle","administration douanes","arrêté Ministre finances"] },

  { num:232, titre:"Conditions d'agrément en usine exercée", chapitre:"VI — Usines exercées",
    texte:`Les conditions d'agrément au régime de l'usine exercée sont fixées par arrêté du Ministre chargé des finances.`,
    exemple:"L'arrêté sur les usines exercées fixe : superficie minimale, systèmes de mesure certifiés (compteurs à débit), salle de contrôle douanier avec accès permanent, capital social minimum, antécédents douaniers irréprochables et conformité aux normes environnementales. Critères stricts expliquant le nombre limité d'opérateurs agréés.",
    motscles:["conditions agrément","arrêté Ministre finances","systèmes mesure certifiés","salle contrôle douanier","normes environnementales"] },

  { num:233, titre:"Exportation préalable — Réapprovisionnement en franchise", chapitre:"VII — Exportation préalable & Drawback",
    texte:`1. Le régime de réapprovisionnement en franchise accorde l'importation en franchise totale ou partielle de droits et taxes aux produits de même espèce que ceux pris sur le marché intérieur, utilisés à la fabrication des marchandises préalablement exportées à titre définitif.\n2. A titre exceptionnel, le bénéfice de cette franchise peut être étendu aux produits importés de même espèce que ceux réexportés en l'état et à titre définitif.`,
    exemple:"Différence clé : l'Exportation préalable = franchise AVANT (importation en franchise car on a déjà exporté). Le Drawback = remboursement APRÈS (on récupère les droits après exportation). Sénégal Cotton exporte des t-shirts avec du coton local, puis importe du coton ivoirien (même espèce) en franchise pour reconstituer ses stocks.",
    motscles:["exportation préalable","réapprovisionnement franchise","même espèce matière","franchise totale partielle","exportation définitive préalable","vs drawback"] },

  { num:234, titre:"Octroi de l'exportation préalable et obligations", chapitre:"VII — Exportation préalable & Drawback",
    texte:`1. Le régime de l'exportation préalable est accordé par le Ministre chargé des finances.\n2. Pour en bénéficier les importateurs doivent :\na) justifier de la réalisation de l'exportation préalable ;\nb) satisfaire aux obligations particulières prescrites par le Directeur général des douanes.`,
    exemple:"Sénégal Cotton demande au Ministre des finances l'autorisation d'exportation préalable (al.1). Elle doit produire (al.2a) les déclarations d'exportation des t-shirts + factures + preuves d'arrivée en Europe. Elle doit aussi respecter (al.2b) les conditions : délai d'importation sous 90 jours, quantités proportionnelles.",
    motscles:["Ministre finances accord","justificatifs exportation préalable","obligations Directeur général","délai importation","quantités proportionnelles"] },

  { num:235, titre:"Drawback — Définition", chapitre:"VII — Exportation préalable & Drawback",
    texte:`Le drawback est le régime douanier qui permet, lors de l'exportation de marchandises, le remboursement total ou partiel des droits et taxes supportés par les produits importés entrant dans la fabrication des marchandises exportées.`,
    exemple:"SUNEOR importe des graines (droits payés = 5M FCFA), fabrique de l'huile, exporte l'huile. Elle reçoit un remboursement de 5M FCFA (drawback) après présentation des preuves d'exportation. Plus simple administrativement que l'exportation préalable.",
    motscles:["drawback définition","remboursement droits taxes","après exportation","produits importés fabrication","remboursement total partiel","preuves exportation"] },

  { num:236, titre:"Octroi du drawback", chapitre:"VII — Exportation préalable & Drawback",
    texte:`Le remboursement total ou partiel des droits et taxes supportés par les produits entrant dans la fabrication de marchandises exportées est accordé par décision du Ministre chargé des finances.`,
    exemple:"SUNEOR soumet une demande de drawback au Ministre des finances avec : déclarations d'importation (droits payés), fiches de fabrication (quantités de graines/tonne d'huile), déclarations d'exportation, preuves d'arrivée en Europe. Le Ministre prend une décision individuelle — pas d'automaticité.",
    motscles:["Ministre finances décision","décision individuelle drawback","non automatique","déclarations importation","fiches fabrication"] },

  { num:237, titre:"Conditions pour bénéficier du drawback", chapitre:"VII — Exportation préalable & Drawback",
    texte:`Pour bénéficier du remboursement prévu aux articles 235 et 236, les exportateurs doivent :\na) justifier de l'importation préalable pour la consommation des produits mis en œuvre ;\nb) satisfaire aux obligations particulières prescrites par arrêté du Ministre chargé des finances après avis du Ministre chargé de l'industrie.`,
    exemple:"SUNEOR doit prouver (al.a) que les graines ont été importées ET ont acquitté les droits à l'importation. Pas de drawback si les graines étaient en entrepôt ou en AT (droits non payés). Elle doit aussi respecter (al.b) le ratio d'incorporation minimum et tenir une comptabilité matière certifiée.",
    motscles:["importation préalable consommation","droits acquittés préalablement","pas entrepôt ni AT","ratio incorporation","comptabilité certifiée","arrêté Ministre industries"] },

  { num:238, titre:"Pays de destination et modalités d'application du drawback", chapitre:"VII — Exportation préalable & Drawback",
    texte:`1. L'acte accordant l'exportation préalable ou le drawback peut déterminer les pays de destination des marchandises exportées, et prescrire, dans le cas de l'exportation préalable, la mention d'une réserve de réapprovisionnement en franchise.\n2. Les conditions d'application de ce chapitre sont déterminées par arrêté du Ministre chargé des finances.`,
    exemple:"Le Ministre accorde à SUNEOR le drawback pour ses exportations d'huile vers la France et l'Espagne (pays déterminés, al.1). Les exportations vers des pays fiscalement opaques peuvent être exclues pour prévenir la fraude.",
    motscles:["pays destination déterminés","réserve réapprovisionnement","arrêté application","prévention fraude","traçabilité drawback"] },

  { num:239, titre:"Importation temporaire des voyageurs", chapitre:"VIII — Import/Export temporaires",
    texte:`1. Les voyageurs venant séjourner temporairement dans le territoire douanier peuvent importer, en suspension des droits et taxes d'entrée, les objets des catégories non prohibées à titre absolu qui leur appartiennent, à charge de réexpédition à l'identique dans un délai ne saurait excéder un (01) an.\n2. Lesdits objets doivent être placés sous le couvert d'acquit-à-caution ou tout autre document en tenant lieu. La garantie de la caution peut être remplacée par la consignation des droits et taxes.\n3. Les titres d'importation temporaire doivent être représentés à toute réquisition des agents des douanes.`,
    exemple:"Un étudiant sénégalais vivant en France rentre pour 6 mois et apporte son scooter. La douane établit un document d'importation temporaire pour le scooter. À son départ, il DOIT repartir avec le même scooter (réexpédition à l'identique al.1). À tout contrôle routier, le document peut être réclamé (al.3).",
    motscles:["importation temporaire voyageurs","un an maximum","réexpédition à l'identique","acquit-à-caution voyageur","consignation droits","représentation titres"] },

  { num:240, titre:"Exportation temporaire des résidents sénégalais", chapitre:"VIII — Import/Export temporaires",
    texte:`Les voyageurs qui ont leur principale résidence ou leur principal établissement dans le territoire douanier et qui vont séjourner temporairement hors du territoire, peuvent exporter le cas échéant, en suspension des droits et taxes de sortie, les objets non prohibés à l'exportation qui leur appartiennent.`,
    exemple:"Un homme d'affaires sénégalais part 3 mois à Paris. Il emporte son ordinateur de bureau et sa montre de luxe. Un document d'exportation temporaire est établi : à son retour, il réimporte ces objets sans payer de droits à l'importation. Sans ce document, la douane peut supposer que les objets ont été achetés à l'étranger.",
    motscles:["exportation temporaire résidents","principale résidence","suspension droits sortie","objets personnels non prohibés","réimportation sans droits","preuve propriété"] },

  { num:241, titre:"Conditions d'application des importations/exportations temporaires", chapitre:"VIII — Import/Export temporaires",
    texte:`Les conditions d'application de ce chapitre sont déterminées par arrêté du Ministre chargé des finances.`,
    exemple:"L'arrêté précise : liste des objets bénéficiant de la procédure simplifiée (ordinateurs, appareils photo, instruments de musique), seuils au-delà desquels un document douanier formel est requis, procédures à l'aéroport et aux postes-frontières terrestres.",
    motscles:["arrêté Ministre finances","liste objets simplifiés","seuils valeur","procédures aéroport frontière","instruments musique ordinateurs"] },

  { num:242, titre:"Transbordement — Définition", chapitre:"IX — Autres régimes",
    texte:`Le transbordement est le régime douanier en application duquel s'opère, sous contrôle du service des douanes, le transfert de marchandises d'un moyen de transport à un autre, en suspension des droits et taxes exigibles, des prohibitions et des restrictions d'entrée et de sortie autres que celles prévues par l'arrêté d'application prévu à l'article 245 du présent code.`,
    exemple:"Un grand navire MSC arrive à Dakar avec des conteneurs destinés au Mali et à la Guinée. Ces conteneurs sont transbordés sur des camions ou bateaux de plus petit gabarit : transfert d'un moyen à un autre sous contrôle douanier, en suspension des droits. Les marchandises ne 'entrent' pas dans le circuit économique sénégalais.",
    motscles:["transbordement définition","transfert moyen transport","suspension droits taxes","contrôle douanier","navire camion","circuit économique"] },

  { num:243, titre:"Opération de transbordement", chapitre:"IX — Autres régimes",
    texte:`Les marchandises transbordées sont enlevées du moyen de transport utilisé à l'importation et chargées sur celui utilisé à l'exportation, ce transfert étant effectué dans le ressort d'un bureau de douane qui constitue à la fois le bureau d'entrée et le bureau de sortie.`,

    texte:`1. Le dépôt de douane est le régime douanier suivant lequel les marchandises sont stockées dans les locaux désignés par le service des douanes pendant un délai déterminé, à l'expiration duquel ces marchandises sont aliénées dans les conditions fixées par le présent code.\n2. Sont constituées d'office en dépôt par le service des douanes :\na) les marchandises qui, à l'importation, n'ont pas été déclarées en détail conformément aux dispositions de l'article 111 du présent code ;\nb) les marchandises déclarées en détail et les bagages des voyageurs qui n'ont pas pu être vérifiés du fait de l'absence du déclarant ;\nc) les marchandises déclarées, n'ayant pas obtenu un bon à enlever dans le délai de trente (30) jours ;\nd) les marchandises ayant déjà acquitté les droits et taxes exigibles et non enlevées dans le délai de trente (30) jours ;\ne) les marchandises qui restent en douane pour tout autre motif.\n3. Lorsque les marchandises sont sans valeur vénale, le service des douanes peut procéder à leur destruction.`,
