    motscles:["compétence territoriale","unité de douane la plus proche","lieu de dépôt des marchandises","opposition à contrainte tribunal régional","règles ordinaires de compétence"] },

  { num:340, titre:"Procédure applicable devant les juridictions civiles", chapitre:"V — Procédure civile",
    texte:`Dans les instances visées à l'article 338 du présent code, la procédure applicable est la procédure ordinaire organisée par le code de procédure civile.`,
    exemple:"Pour le litige sur la classification tarifaire évoqué à l'article 338, la procédure suivie devant le Tribunal régional de Thiès est celle du droit commun civil : assignation, échanges de conclusions, audiences de mise en état, etc., conformément au code de procédure civile — sans procédure spécifique dérogatoire.",
    motscles:["procédure ordinaire","code de procédure civile","instances article 338","droit commun civil applicable"] },

  { num:341, titre:"Appel des jugements civils en matière douanière", chapitre:"V — Procédure civile",
    texte:`Tous les jugements civils rendus par les tribunaux en matière douanière sont susceptibles d'appel, quelle que soit l'importance du litige, conformément aux règles du code de procédure civile.`,
    exemple:"Même si le litige douanier porte sur une somme modique de 200 000 FCFA (en deçà du taux de ressort habituel pour l'appel en matière civile ordinaire), le jugement rendu en matière douanière reste toujours susceptible d'appel — la règle dérogatoire écarte ici tout taux de ressort.",
    motscles:["appel jugements civils","quelle que soit l'importance du litige","pas de taux de ressort","code de procédure civile"] },

  { num:342, titre:"Signification des jugements et actes de procédure", chapitre:"V — Procédure civile",
    texte:`1. Les significations sont faites à l'administration des douanes en la personne de l'agent qui la représente.
2. Les significations à l'autre partie sont faites conformément aux règles du code de procédure civile.`,
    exemple:"Un jugement rendu contre l'administration des douanes doit être signifié à l'agent (par exemple le receveur des douanes ou l'avocat) qui représente l'administration dans l'instance (al.1). À l'égard de l'importateur partie au procès, la signification suit les règles classiques du code de procédure civile : exploit d'huissier à personne, domicile, etc. (al.2).",
    motscles:["signification jugements","agent représentant l'administration","signification autre partie","code procédure civile"] },

  { num:343, titre:"Application du droit commun en matière de flagrant délit", chapitre:"VI — Procédure répressive",
    texte:`Les dispositions de droit commun relatives aux flagrants délits par devant les tribunaux correctionnels sont applicables dans le cas prévu à l'article 311 du présent code.`,
    exemple:"Lorsqu'un agent des douanes a procédé à l'arrestation en flagrant délit d'un fraudeur (Art. 311), la procédure de comparution immédiate devant le tribunal correctionnel — telle que prévue par le code de procédure pénale pour les flagrants délits de droit commun — s'applique également aux infractions douanières constatées dans ces conditions.",
    motscles:["flagrant délit","tribunal correctionnel","droit commun procédure pénale","renvoi article 311","comparution immédiate"] },

  { num:344, titre:"Mandats d'arrêt et de dépôt — Conditions de mise en liberté provisoire", chapitre:"VI — Procédure répressive",
    texte:`1. À l'encontre des personnes passibles d'une peine d'emprisonnement en vertu des articles 390, 391 et 392 et des dispositions relatives aux relations financières avec l'étranger, le procureur de la République en cas de flagrant délit, ou le juge d'instruction lorsqu'une information est ouverte, délivrent obligatoirement : a) mandat d'arrêt contre le ou les inculpés en fuite ; b) mandat de dépôt lorsque la valeur de l'objet de fraude est supérieure ou égale à 10.000.000 de francs, sauf paiement de la totalité des droits et taxes. La mainlevée du mandat de dépôt et la mise en liberté provisoire sont subordonnées au paiement des droits et taxes dus et au versement d'un cautionnement égal au montant des droits et taxes dus ou à la valeur de l'objet de fraude. Exception uniquement si la fausseté du procès-verbal est établie ou si une transaction définitive a été réalisée.
2. Les dispositions relatives à la mise en liberté provisoire restent applicables même après la clôture de l'information jusqu'à décision définitive, tant que la durée de détention provisoire ne dépasse pas le maximum de la peine encourue.
3. Pour les personnes reconnues coupables, l'application des circonstances atténuantes et le bénéfice du sursis sont subordonnés au paiement avant jugement de la totalité des droits et taxes dus, ou à la consignation de la valeur de l'objet de fraude. La libération conditionnelle n'est recevable qu'après ce paiement ou cette consignation. Les mesures d'assignation à résidence (Art. 130 al.5 CPP) sont obligatoires pour tout étranger inculpé ou prévenu laissé ou mis en liberté provisoire.`,
    exemple:"Un inculpé étranger est poursuivi pour contrebande de cigarettes contrefaites (Art. 390 al.2) d'une valeur de 25 millions FCFA, soit supérieure à 10 millions. Le procureur délivre obligatoirement un mandat de dépôt (al.1b). Pour obtenir sa mise en liberté provisoire, il doit payer la totalité des droits et taxes dus ET verser un cautionnement de 25 millions FCFA. S'il est mis en liberté provisoire, le juge doit obligatoirement ordonner son assignation à résidence du fait de sa nationalité étrangère (al.3, dernier alinéa).",
    motscles:["mandat d'arrêt","mandat de dépôt","seuil 10 millions de francs","mainlevée mandat dépôt","cautionnement","circonstances atténuantes sursis","liberté conditionnelle","assignation à résidence étranger"] },

  { num:345, titre:"Instruction verbale et absence de frais de justice", chapitre:"VII — Dispositions diverses",
    texte:`En première instance et en appel, l'instruction est verbale sur simple mémoire et sans frais de justice à répéter de part et d'autre.`,
    exemple:"Dans une affaire de contrebande jugée par le Tribunal régional de Ziguinchor, les débats se déroulent oralement sur la base d'un simple mémoire déposé par l'administration des douanes, sans que les parties n'aient à avancer de frais de justice — que ce soit en première instance ou en appel.",
    motscles:["instruction verbale","simple mémoire","sans frais de justice","première instance et appel","gratuité de la procédure"] },

  { num:346, titre:"Pouvoir des agents des douanes d'effectuer des exploits d'huissier", chapitre:"VII — Dispositions diverses",
    texte:`1. Les agents des douanes peuvent faire, en matière de douane, tous exploits et autres actes de justice que les huissiers sont habilités à faire. Ils peuvent toutefois faire appel à un commissaire-priseur, notamment pour les formalités de vente d'objets saisis, confisqués ou abandonnés.
2. Les agents chargés du recouvrement peuvent effectuer, en matière de recouvrement des droits, taxes et pénalités de retard liquidés et pris en charge, tous actes de poursuites que les huissiers sont habilités à faire. L'autorité compétente du Trésor peut autoriser ces agents à utiliser le ministère d'huissier à titre exceptionnel.`,
    exemple:"Pour notifier une citation à comparaître à un fraudeur, un agent des douanes peut lui-même signifier l'acte, comme le ferait un huissier de justice (al.1), sans frais supplémentaires. Pour la vente aux enchères de véhicules confisqués, la douane peut néanmoins faire appel à un commissaire-priseur professionnel pour organiser la vacation. Pour le recouvrement de pénalités de retard, l'agent du Trésor peut, à titre exceptionnel, recourir à un huissier si l'autorité du Trésor l'autorise (al.2).",
    motscles:["agents douanes exploits huissier","actes de justice","commissaire-priseur","vente objets saisis confisqués","recouvrement actes de poursuites","ministère d'huissier exceptionnel"] },

  { num:347, titre:"Limites à la modération des peines — Circonstances atténuantes retenues par le tribunal", chapitre:"VII — Dispositions diverses",
    texte:`1. Sous réserve de l'alinéa 2, les contrevenants ne peuvent bénéficier d'aucune excuse sur l'intention. Il ne peut être donné mainlevée provisoire des marchandises, et les droits, confiscations ou amendes ne peuvent être modérés, ni leur emploi ordonné au préjudice de l'administration.
2. S'il retient des circonstances atténuantes, le tribunal peut : a) libérer les contrevenants de la confiscation des moyens de transport, sauf en cas de dissimulation dans des cachettes spécialement aménagées ; b) libérer les contrevenants de la confiscation des objets ayant servi à masquer la fraude ; c) dispenser les prévenus des sanctions privatives de liberté, ordonner le sursis, ou décider que la condamnation ne soit pas mentionnée au bulletin n°2 du casier judiciaire.
3. Si les circonstances atténuantes ne sont retenues qu'à l'égard de certains co-prévenus, le tribunal prononce d'abord les sanctions fiscales solidaires pour les condamnés non bénéficiaires, puis peut limiter l'étendue de la solidarité au profit des bénéficiaires de circonstances atténuantes.
4. Lorsque les marchandises saisies ne sont pas prohibées, le tribunal peut en donner mainlevée avant jugement définitif, moyennant caution solvable ou consignation de la valeur sur le marché intérieur.
5. Le tribunal ne peut dispenser le redevable du paiement des sommes fraudées ou indûment obtenues, ni de la confiscation des marchandises dangereuses pour la santé, la moralité ou la sécurité publiques, des marchandises contrefaisantes, ni de celles soumises à des restrictions quantitatives.`,
    exemple:"Un jeune chauffeur de taxi, sans antécédent, a été utilisé à son insu pour transporter des marchandises de contrebande dissimulées dans un compartiment normal du véhicule (pas de cachette spécialement aménagée). Le tribunal, retenant des circonstances atténuantes, peut décider de ne pas confisquer son véhicule (al.2a) et de prononcer une peine avec sursis sans inscription au casier judiciaire (al.2c). En revanche, si les marchandises étaient des médicaments contrefaits dangereux pour la santé, le tribunal ne pourrait en aucun cas dispenser leur confiscation (al.5), quelles que soient les circonstances atténuantes.",
    motscles:["pas d'excuse sur l'intention","circonstances atténuantes","libération confiscation moyens transport","cachettes spécialement aménagées","sursis casier judiciaire b2","solidarité limitée co-prévenus","mainlevée avant jugement","marchandises dangereuses non dispensables"] },

  { num:348, titre:"Interdiction de défense ou surséance contre les contraintes", chapitre:"VII — Dispositions diverses",
    texte:`Il ne peut être donné, sous quelque prétexte que ce soit, contre les contraintes aucune défense ou surséance qui sont nulles et de nul effet et sous peine d'engager personnellement la responsabilité de l'auteur de la défense ou de la surséance. Le cas échéant, l'administration des douanes peut intenter une action en dommages et intérêts contre cet auteur.`,
    exemple:"Un huissier ou un tiers tente d'obtenir d'un juge une ordonnance de surséance pour bloquer l'exécution d'une contrainte douanière décernée contre un redevable. Une telle ordonnance, si elle était rendue, serait nulle et de nul effet, et son auteur engagerait sa responsabilité personnelle — la douane pourrait même le poursuivre en dommages et intérêts pour cette intervention illégale.",
    motscles:["interdiction défense surséance","nul et de nul effet","responsabilité personnelle de l'auteur","action en dommages et intérêts","exécution contrainte protégée"] },

  { num:349, titre:"Interdiction pour les juges de délivrer certains documents douaniers", chapitre:"VII — Dispositions diverses",
    texte:`Les juges des tribunaux et leurs greffiers ne peuvent expédier des acquits de paiement ou à caution, passavants, réceptions ou décharges de soumissions, ni rendre un jugement pour tenir lieu des expéditions.`,
    exemple:"Un transporteur qui a perdu son passavant de circulation ne peut pas demander au tribunal de lui délivrer un duplicata ou un jugement en tenant lieu — ces documents relèvent exclusivement de l'administration des douanes, et les juges et greffiers n'ont pas compétence pour s'y substituer.",
    motscles:["acquits de paiement","passavants","décharges de soumissions","interdiction aux juges et greffiers","compétence exclusive de la douane"] },

  { num:350, titre:"Charge de la preuve de non-infraction en cas de saisie", chapitre:"VIII — Dispositions particulières aux instances",
    texte:`Dans toute action en répression d'une infraction douanière résultant d'une saisie, les preuves de non-infraction sont à la charge du saisi.`,
    exemple:"Un véhicule transportant des marchandises sans documents douaniers est saisi près de la frontière. Devant le tribunal, ce n'est pas à la douane de prouver que l'infraction a été commise (la saisie matérielle suffit comme indice) : c'est au propriétaire saisi de démontrer que ses marchandises étaient en règle (origine licite, droits acquittés, etc.) — renversement de la charge de la preuve.",
    motscles:["charge de la preuve renversée","preuve de non-infraction","saisi doit démontrer régularité","action en répression résultant d'une saisie"] },

  { num:351, titre:"Action en confiscation contre conducteurs ou déclarants — Action en garantie", chapitre:"VIII — Dispositions particulières aux instances",
    texte:`1. La confiscation des marchandises saisies peut être poursuivie contre les conducteurs ou déclarants sans que l'administration des douanes soit tenue de mettre en cause les propriétaires quand bien même ils lui seraient indiqués.
2. Toutefois, si les propriétaires intervenaient ou étaient appelés en garantie par ceux sur lesquels les saisies ont été faites, les tribunaux statueront, ainsi que de droit, sur les interventions ou sur les appels en garantie.`,
    exemple:"Un chauffeur transportant des marchandises de contrebande pour le compte d'un commerçant (le véritable propriétaire) est poursuivi devant le tribunal. La douane peut demander la confiscation des marchandises directement contre ce chauffeur, sans avoir à attraire le propriétaire dans la procédure, même si le chauffeur révèle son identité (al.1). Si toutefois le chauffeur appelle en garantie le propriétaire (pour qu'il assume les conséquences financières), le tribunal statuera également sur cet appel en garantie (al.2).",
    motscles:["confiscation contre conducteurs déclarants","propriétaires non mis en cause","appel en garantie","intervention propriétaire","tribunal statue sur garantie"] },

  { num:352, titre:"Confiscation des objets saisis sur inconnus", chapitre:"VIII — Dispositions particulières aux instances",
    texte:`1. L'administration des douanes peut demander aux juges, sur simple requête, la confiscation en nature des objets saisis sur des inconnus ou sur des individus qui n'ont pas fait l'objet de poursuites, en raison de la faiblesse de la fraude.
2. Il est statué sur la demande par une seule ordonnance, même si la requête se rapporte à plusieurs saisies faites séparément.`,
    exemple:"Lors de plusieurs contrôles routiers distincts dans la région de Kolda, des petites quantités de marchandises de contrebande sont saisies sur des individus qui prennent la fuite et restent non identifiés. La douane peut, par simple requête, demander au juge la confiscation de l'ensemble de ces marchandises saisies sur inconnus en une seule ordonnance, sans engager une procédure de poursuite individuelle pour chaque saisie (al.1 et 2).",
    motscles:["confiscation objets saisis sur inconnus","simple requête","faiblesse de la fraude","ordonnance unique","plusieurs saisies séparées"] },

  { num:353, titre:"Interdiction de revendication des objets saisis ou confisqués", chapitre:"VIII — Dispositions particulières aux instances",
    texte:`1. Les objets saisis ou confisqués ne peuvent être revendiqués par les propriétaires, ni le prix qu'il soit consigné ou non, réclamé par les créanciers même privilégiés, sauf leur recours contre les auteurs de la fraude.
2. Les délais d'appel, de tierce opposition et de vente expirés, toutes répétitions et actes sont non recevables.`,
    exemple:"Une banque créancière privilégiée d'un importateur ne peut pas réclamer le prix de vente de marchandises confisquées à son débiteur pour fraude douanière, même si elle dispose d'un nantissement sur ces marchandises (al.1) — son seul recours est contre l'auteur de la fraude lui-même. Une fois les délais d'appel et de tierce opposition expirés, et la vente réalisée, plus aucune réclamation n'est recevable, ni du propriétaire ni des créanciers (al.2).",
    motscles:["interdiction revendication","objets saisis confisqués","créanciers privilégiés exclus","recours contre auteurs fraude","délais expirés non recevable"] },

  { num:354, titre:"Appréciation de la véracité des déclarations en douane", chapitre:"VIII — Dispositions particulières aux instances",
    texte:`Sous réserve des dispositions des alinéas 1 et 2 de l'article 118 du présent code, la vérité ou fausseté des déclarations en douane doit être jugée sur ce qui a été premièrement déclaré.`,
    exemple:"Un déclarant dépose une déclaration en détail mentionnant 1000 unités d'un produit. Constatant son erreur, il tente ensuite de la modifier verbalement avant tout contrôle pour indiquer 1200 unités. Pour apprécier si la déclaration initiale était fausse ou non (par exemple si un déficit ou excédent est constaté), le tribunal se réfère à ce qui a été premièrement déclaré (1000 unités), sauf application des règles de rectification prévues à l'article 118.",
    motscles:["véracité déclarations en douane","ce qui a été premièrement déclaré","renvoi article 118","appréciation par le tribunal"] },

  { num:355, titre:"Droit de rétention pour sûreté des pénalités", chapitre:"IX — Sûretés garantissant l'exécution",
    texte:`Dans tous les cas de constatation d'infraction douanière flagrante, les moyens de transport et les marchandises litigieuses non passibles de confiscation peuvent, pour sûreté des pénalités encourues, être retenus jusqu'à ce qu'il soit fourni caution ou versé consignation du montant desdites pénalités.`,
    exemple:"Un véhicule de transport de marchandises non prohibées (donc non confiscables) est impliqué dans une infraction flagrante (par exemple un déficit de colis, contravention de 2ème classe). En attendant le paiement de l'amende potentielle, la douane peut retenir le véhicule jusqu'à ce que le transporteur fournisse une caution ou consigne le montant estimé de la pénalité encourue.",
    motscles:["droit de rétention","infraction flagrante","sûreté des pénalités","caution ou consignation","marchandises non confiscables"] },

  { num:356, titre:"Privilèges et hypothèques de l'administration des douanes", chapitre:"IX — Sûretés garantissant l'exécution",
    texte:`1. L'administration a, pour les droits, confiscations, amendes et restitutions, privilège et préférence sur tous créanciers sur les meubles et effets mobiliers des redevables, à l'exception des frais de justice et créances de la masse (Acte uniforme procédures collectives, Art. 117), de six mois de loyer, et sauf revendication des propriétaires de marchandises encore emballées.
2. L'administration dispose également d'un droit d'hypothèque sur les immeubles des redevables, mais pour les droits seulement. L'hypothèque n'est opposable que lorsqu'elle est inscrite.
3. Les contraintes décernées en matière douanière emportent hypothèque de la même manière et aux mêmes conditions que les condamnations émanées de l'autorité judiciaire.
4. Tous dépositaires et débiteurs de deniers provenant du chef des redevables, ainsi que les gérants, administrateurs ou liquidateurs de sociétés, sont tenus, sur demande, de payer en l'acquit des redevables sur les fonds qu'ils détiennent, jusqu'à concurrence des droits dus. Cette demande, sous forme d'avis à tiers détenteur, peut être envoyée par lettre recommandée avec accusé de réception ou notifiée dans les formes des commandements. Quittance est délivrée au tiers détenteur.`,
    exemple:"Une entreprise débitrice de droits de douane est en difficulté financière avec plusieurs créanciers. L'administration des douanes bénéficie d'un privilège prioritaire sur les meubles de l'entreprise pour le recouvrement de sa créance, primant les créanciers ordinaires (al.1). Si l'entreprise possède un immeuble, la douane peut aussi inscrire une hypothèque sur ce bien pour garantir les droits dus, mais cette hypothèque ne sera opposable aux tiers qu'à compter de son inscription (al.2). La douane peut également adresser un avis à tiers détenteur à la banque de l'entreprise, qui doit alors lui reverser les fonds disponibles à hauteur de la dette (al.4).",
    motscles:["privilège créanciers","hypothèque immeubles redevables","inscription hypothèque opposabilité","contraintes emportent hypothèque","avis à tiers détenteur","gérants administrateurs liquidateurs"] },

  { num:357, titre:"Subrogation des commissionnaires en douane agréés", chapitre:"IX — Sûretés garantissant l'exécution",
    texte:`1. Les commissionnaires en douane agréés qui ont acquitté, pour un tiers, des droits, taxes ou amendes de douane, sont subrogés au privilège de l'administration, conformément à l'alinéa 1 de l'article 356 du présent code, quelles que soient les modalités de recouvrement observées par eux à l'égard de ce tiers.
2. Toutefois, cette subrogation ne peut, en aucun cas, être opposée aux administrations de l'Etat.`,
    exemple:"Un commissionnaire en douane agréé règle pour le compte d'un de ses clients (importateur) les droits de douane dus sur une opération. Il devient automatiquement subrogé dans le privilège de l'administration des douanes pour récupérer cette somme auprès du client (al.1) — il bénéficie donc de la même priorité de paiement que la douane sur les biens du client. Mais il ne peut pas opposer cette subrogation à une autre administration de l'État (par exemple le fisc) qui aurait également une créance privilégiée sur le même client (al.2).",
    motscles:["subrogation commissionnaire en douane agréé","privilège article 356","paiement pour le tiers","non-opposable aux administrations de l'État"] },

  { num:358, titre:"Voies d'exécution générales — Exécution par corps des contraintes", chapitre:"X — Voies d'exécution",
    texte:`1. L'exécution des jugements et arrêts en matière de douane peut avoir lieu par toutes voies de droit.
2. Les jugements et arrêts portant condamnation pour infraction aux lois douanières et à la réglementation des changes sont, en outre, exécutés par corps.
3. Les contraintes sont exécutoires par toutes voies de droit, sauf par corps. L'exécution des contraintes ne peut être suspendue par aucune opposition ou autre acte.
4. En cas de condamnation à une peine pécuniaire, lorsque l'administration des douanes dispose d'éléments permettant de présumer que le condamné a organisé son insolvabilité, elle peut demander au juge de condamner à la solidarité de paiement les personnes ayant participé à l'organisation de cette insolvabilité.
5. Lorsqu'un contrevenant décède avant d'avoir réglé les amendes, confiscations et autres condamnations pécuniaires, le recouvrement peut être poursuivi contre la succession par toutes voies de droit, sauf par corps.
6. Les amendes et confiscations douanières se prescrivent dans les mêmes délais que les peines correctionnelles de droit commun et dans les mêmes conditions que les dommages et intérêts.`,
    exemple:"Un condamné pour délit de contrebande (Art. 390) refuse de payer l'amende prononcée. Le jugement peut être exécuté par corps, c'est-à-dire par contrainte par corps (détention pour dette envers le Trésor) en plus des autres voies d'exécution (al.2). En revanche, une simple contrainte administrative (non encore confirmée par jugement) ne peut jamais donner lieu à exécution par corps (al.3). Si l'administration découvre que ce condamné a organisé sa propre insolvabilité avec l'aide de complices (transferts de biens fictifs), elle peut demander au juge de condamner ces complices solidairement au paiement de l'amende (al.4).",
    motscles:["exécution par toutes voies de droit","exécution par corps jugements","contraintes exécutoires sauf par corps","insolvabilité organisée solidarité","décès du contrevenant succession","prescription amendes confiscations"] },

  { num:359, titre:"Dispense de paiement de l'administration en cas de recours", chapitre:"X — Voies d'exécution",
    texte:`L'administration n'est tenue d'effectuer de paiement en vertu des jugements attaqués par les voies d'opposition, d'appel ou de cassation avec renvoi, à moins qu'au préalable ceux au profit desquels lesdits jugements ont été rendus n'aient donné bonne et suffisante caution pour sûreté des sommes à eux adjugées.`,
    exemple:"Un opérateur économique obtient un jugement de première instance condamnant la douane à lui rembourser 5 millions FCFA de droits indûment perçus. La douane fait appel de ce jugement. Tant que l'opérateur n'a pas fourni une caution suffisante garantissant la restitution de cette somme en cas de réformation du jugement en appel, l'administration n'est pas tenue de procéder au paiement.",
    motscles:["dispense de paiement administration","jugements attaqués opposition appel cassation","caution préalable du bénéficiaire","sûreté des sommes adjugées"] },

  { num:360, titre:"Restitution des objets saisis sous condition de caution en cas de recours", chapitre:"X — Voies d'exécution",
    texte:`Lorsque la mainlevée des objets saisis pour infraction aux lois dont l'exécution est confiée à l'administration des douanes est accordée par jugements contre lesquels une voie de recours est introduite, la remise n'en est faite à ceux au profit desquels lesdits jugements ont été rendus que sous bonne et suffisante caution de leur valeur. La mainlevée ne peut jamais être accordée pour les marchandises prohibées.`,
    exemple:"Un tribunal de première instance ordonne la mainlevée d'un véhicule saisi au profit de son propriétaire. La douane interjette appel de ce jugement. Le véhicule ne peut être restitué au propriétaire qu'après qu'il ait fourni une caution couvrant sa valeur, afin de garantir sa restitution éventuelle si l'appel est favorable à la douane. Si les marchandises saisies étaient des produits prohibés (drogue, contrefaçons dangereuses), aucune mainlevée ne pourrait jamais être accordée, quel que soit le jugement.",
    motscles:["mainlevée sous caution","jugement frappé de recours","restitution conditionnelle","marchandises prohibées mainlevée impossible"] },

  { num:361, titre:"Nullité des saisies de produits des droits entre les mains des comptables", chapitre:"X — Voies d'exécution",
    texte:`Toutes saisies de produits des droits, faites entre les mains des agents chargés du recouvrement, des régisseurs ou en celles des redevables envers l'administration des douanes, sont nulles et de nul effet ; nonobstant lesdites saisies, les redevables sont contraints au paiement des sommes par eux dues.`,
    exemple:"Un créancier d'un agent chargé du recouvrement des douanes tente de faire saisir entre les mains de cet agent les sommes provenant des droits de douane perçus, pour se faire payer sa propre créance. Une telle saisie est nulle et de nul effet : les fonds publics provenant des droits de douane ne peuvent être appréhendés par cette voie, et le redevable reste tenu de payer ses droits malgré la saisie.",
    motscles:["nullité saisies produits des droits","agents recouvrement régisseurs","redevables envers la douane","obligation de paiement maintenue"] },

  { num:362, titre:"Apposition de scellés sur les effets des comptables — Registres de l'année courante", chapitre:"X — Voies d'exécution",
    texte:`Dans les cas d'apposition de scellés sur les effets et papiers des comptables, les registres de recettes et autres de l'année courante ne doivent pas être renfermés sous les scellés. Lesdits registres sont seulement arrêtés et paraphés par le juge, qui les remet à l'agent chargé de la recette par intérim, lequel en demeure garant comme dépositaire de justice, et il en est fait mention dans le procès-verbal d'apposition des scellés.`,
    exemple:"Suite au décès ou à la suspension d'un receveur des douanes, des scellés sont apposés sur ses effets personnels et ses papiers. Les registres de recettes de l'année en cours ne sont pas mis sous scellés (ce qui paralyserait le service) : le juge les arrête et les paraphe, puis les confie au receveur intérimaire, qui en devient le dépositaire judiciaire responsable — mention en est faite dans le procès-verbal de scellés.",
    motscles:["apposition de scellés comptables","registres année courante exclus","arrêt et paraphe par le juge","receveur intérimaire dépositaire de justice"] },

  { num:363, titre:"Saisie conservatoire des biens du prévenu en cas d'urgence", chapitre:"X — Voies d'exécution",
    texte:`1. Dans les cas qui requièrent célérité, le président du tribunal peut, sur la requête de l'administration des douanes, autoriser la saisie, à titre conservatoire, des biens du prévenu, soit en vertu d'un jugement de condamnation, soit même avant jugement, conformément aux dispositions du code de procédure civile et des actes uniformes pertinents.
2. L'ordonnance du président du tribunal est exécutoire nonobstant opposition ou appel. Il peut ordonner mainlevée de la saisie si le saisi fournit une caution jugée suffisante. Les demandes en validité ou en mainlevée de la saisie sont de la compétence du président du tribunal.`,
    exemple:"La douane apprend qu'un fraudeur s'apprête à transférer ses avoirs bancaires à l'étranger avant son jugement pour contrebande de grande envergure. Sur requête urgente de l'administration, le président du Tribunal régional de Dakar peut, même avant tout jugement de condamnation, autoriser la saisie conservatoire de ses comptes bancaires (al.1). Cette ordonnance est immédiatement exécutoire, même si le fraudeur fait opposition ou appel (al.2). Si celui-ci fournit ensuite une caution suffisante, le président peut ordonner la mainlevée de cette saisie.",
    motscles:["saisie conservatoire urgence","requête de l'administration","avant ou après jugement","ordonnance exécutoire nonobstant recours","mainlevée contre caution","compétence président du tribunal"] },

  { num:364, titre:"Maintien en détention pour exécution anticipée de la contrainte par corps", chapitre:"X — Voies d'exécution",
    texte:`Tout individu condamné pour délit de douane est, nonobstant appel ou pourvoi en cassation, maintenu en détention jusqu'à ce qu'il ait acquitté le montant des condamnations pécuniaires prononcées contre lui. Toutefois, la durée de la détention ne peut excéder celle fixée par la législation relative à la contrainte par corps.`,
    exemple:"Un condamné pour délit de contrebande qui a interjeté appel reste néanmoins maintenu en détention tant qu'il n'a pas payé l'amende et les sommes tenant lieu de confiscation prononcées contre lui en première instance — l'appel ne suspend pas cette obligation. Cette détention ne peut toutefois pas dépasser la durée maximale prévue par la législation sur la contrainte par corps, même si la dette n'est pas intégralement réglée.",
    motscles:["maintien en détention nonobstant appel","contrainte par corps anticipée","paiement des condamnations pécuniaires","durée maximale légale"] },

  { num:365, titre:"Vente avant jugement des marchandises périssables et moyens de transport", chapitre:"X — Voies d'exécution",
    texte:`1. En cas de saisie de moyens de transport dont la remise sous caution a été offerte par procès-verbal et n'a pas été acceptée, ainsi qu'en cas de saisie de marchandises périssables ou d'objets risquant de se détériorer, il est, à la diligence de l'administration des douanes et en vertu de l'autorisation à pied de requête du juge d'instruction lorsqu'il est saisi ou du président du tribunal le plus proche, procédé à la vente aux enchères des objets saisis.
2. L'ordonnance portant autorisation de vente est signifiée dans les meilleurs délais à la partie saisie conformément à l'article 342, avec déclaration qu'il est immédiatement procédé à la vente, même en l'absence du saisi, attendu le péril en la demeure.
3. L'ordonnance est exécutée nonobstant opposition ou appel.`,
    exemple:"Un transporteur refuse la mainlevée sous caution offerte pour son camion saisi (Art. 305). La douane peut alors demander au président du tribunal le plus proche l'autorisation de vendre le camion aux enchères avant tout jugement (al.1). De même, une cargaison de poissons frais saisie ne peut attendre l'issue d'un long procès : l'autorisation de vente immédiate est obtenue en urgence, signifiée au saisi (al.2), et la vente a lieu même s'il ne se présente pas, vu le risque de péril en la demeure (al.2 et 3).",
    motscles:["vente avant jugement","marchandises périssables","moyens de transport caution refusée","autorisation juge d'instruction ou président tribunal","signification article 342","exécution nonobstant recours"] },

  { num:366, titre:"Aliénation des marchandises confisquées ou abandonnées", chapitre:"X — Voies d'exécution",
    texte:`1. Les objets confisqués ou abandonnés sont aliénés par le service des douanes dans les conditions fixées par arrêté du Ministre chargé des finances lorsque le jugement de confiscation est devenu définitif ou, en cas de jugement par défaut, lorsque l'exécution provisoire a été ordonnée, ou après abandon consenti par transaction.
2. Toutefois, les jugements et ordonnances portant confiscation de marchandises saisies sur des particuliers inconnus et par eux abandonnées et non réclamées, ne sont exécutés que huit (08) jours après leur affichage à la porte de l'unité de douane ; passé ce délai, aucune demande en répétition n'est recevable.`,
    exemple:"Après condamnation définitive d'un fraudeur à la confiscation de marchandises de contrebande, la douane procède à leur vente selon les modalités fixées par arrêté ministériel (al.1). Pour des marchandises saisies sur un individu non identifié et qui ont été déclarées confisquées par ordonnance (Art. 352), la douane affiche cette décision pendant 8 jours à la porte de l'unité de douane avant de pouvoir vendre les marchandises ; passé ce délai, plus aucune réclamation n'est possible (al.2).",
    motscles:["aliénation marchandises confisquées","arrêté du Ministre des finances","jugement définitif ou exécution provisoire","abandon par transaction","affichage huit jours","délai de réclamation expiré"] },

  { num:367, titre:"Destruction des marchandises sans valeur ou présentant des inconvénients", chapitre:"X — Voies d'exécution",
    texte:`Sont détruites en présence des agents de douane qui en dressent procès-verbal : les marchandises sans valeur commerciale ; les marchandises dont la vente en l'état présente des inconvénients au point de vue de l'intérêt public. Si la destruction laisse subsister des résidus ayant une valeur commerciale, le service des douanes procède à leur vente.`,
    exemple:"Des médicaments contrefaits saisis et confisqués ne peuvent évidemment pas être remis en vente (danger pour la santé publique) : ils sont détruits en présence d'agents des douanes qui dressent un procès-verbal de destruction. Si l'incinération de ces produits laisse subsister des emballages métalliques recyclables ayant une valeur marchande, la douane peut procéder à la vente de ces résidus.",
    motscles:["destruction marchandises sans valeur","intérêt public vente impossible","procès-verbal de destruction","résidus à valeur commerciale vendus"] },

  { num:368, titre:"Répartition du produit des amendes et confiscations", chapitre:"XI — Répartition du produit des amendes",
    texte:`La répartition du produit des amendes et confiscations est fixée par décret.`,
    exemple:"Le produit de la vente de marchandises confisquées et le montant des amendes recouvrées sont répartis entre le Trésor public et, le cas échéant, les agents verbalisateurs (primes), selon les pourcentages et modalités déterminés par un décret d'application — et non par le code lui-même.",
    motscles:["répartition produit amendes confiscations","fixée par décret","Trésor public","primes aux agents"] },

  { num:369, titre:"Responsabilité pénale du détenteur de marchandises de fraude", chapitre:"XII — Responsabilité pénale",
    texte:`1. Le détenteur de marchandises de fraude est réputé responsable de la fraude.
2. Toutefois, les transporteurs publics ne sont pas considérés, eux et leurs préposés ou agents, comme contrevenants, lorsque, par une désignation exacte et régulière de leurs commettants, ils mettent l'administration en mesure d'exercer utilement des poursuites contre les véritables auteurs de la fraude.`,
    exemple:"Un commerçant trouvé en possession de marchandises de contrebande dans son magasin est présumé responsable de la fraude, simplement du fait de leur détention (al.1) — peu importe qu'il les ait lui-même importées. En revanche, une compagnie de transport en commun (autocar) qui transportait, parmi les bagages de ses passagers, un colis de contrebande n'est pas considérée comme contrevenante si elle peut indiquer avec exactitude l'identité du passager expéditeur, permettant à la douane de poursuivre ce dernier (al.2).",
    motscles:["détenteur réputé responsable","marchandises de fraude","transporteurs publics exonérés","désignation exacte du commettant","poursuites contre véritables auteurs"] },

  { num:370, titre:"Responsabilité pénale des capitaines de navires et commandants d'aéronefs", chapitre:"XII — Responsabilité pénale",
    texte:`1. Les capitaines de navires, bateaux, embarcations et les commandants d'aéronefs sont réputés responsables des omissions et inexactitudes relevées dans les manifestes et, d'une manière générale, des infractions commises à bord de leur bâtiment.
2. Toutefois, les peines d'emprisonnement édictées par le présent code ne sont applicables aux commandants des navires de commerce ou des aéronefs de commerce qu'en cas de faute personnelle.`,
    exemple:"Le manifeste d'un cargo accostant à Dakar omet de déclarer 50 caisses d'alcool découvertes lors du contrôle. Le capitaine est réputé responsable de cette omission (al.1), même si c'est l'agent de fret qui a rempli le manifeste. Pour qu'il soit emprisonné, il faudra établir sa faute personnelle — par exemple, qu'il avait connaissance des caisses non déclarées et a sciemment couvert la fraude (al.2).",
    motscles:["capitaine navire commandant aéronef","responsabilité omissions manifeste","infractions commises à bord","emprisonnement faute personnelle uniquement","commerce maritime aérien"] },

  { num:371, titre:"Décharge de responsabilité du capitaine", chapitre:"XII — Responsabilité pénale",
    texte:`Le capitaine est déchargé de toute responsabilité :
a) dans le cas d'infraction visé à l'article 397 alinéa 2, s'il administre la preuve qu'il a rempli tous ses devoirs de surveillance ou si le délinquant est découvert ;
b) dans les cas d'infractions visés à l'article 397 alinéa 3, s'il justifie que des avaries sérieuses ont nécessité le déroutement du navire et à condition que ces événements aient été consignés au journal de bord avant la visite du service des douanes.`,
    exemple:"a) Des objets prohibés sont découverts dans la cabine d'un passager clandestin. Le capitaine prouve qu'il a effectué toutes les vérifications habituelles avant le départ et pendant le voyage (rondes, contrôles) — il est exonéré. b) Un navire dérouté vers Ziguinchor à cause d'une voie d'eau sérieuse et se retrouve avec des marchandises prohibées à bord. Si le capitaine justifie de l'avarie et que l'incident est consigné au journal de bord avant la visite des douaniers, il est déchargé de toute responsabilité.",
    motscles:["décharge responsabilité capitaine","devoirs de surveillance","délinquant découvert","avaries sérieuses déroutement","journal de bord avant visite","article 397 al.2 et al.3"] },

  { num:372, titre:"Responsabilité pénale des déclarants", chapitre:"XII — Responsabilité pénale",
    texte:`1. Les signataires de déclarations en détail sont responsables des omissions, inexactitudes et autres irrégularités relevées dans lesdites déclarations, sauf leur recours contre leurs commettants.
2. Lorsque le signataire prouve que la déclaration en détail a été établie en conformité des instructions données par le commettant, ce dernier est passible des mêmes peines que le signataire de la déclaration en détail. Dans ce cas, les peines d'emprisonnement prévues par le présent code ne lui sont applicables qu'en cas de faute personnelle.`,
    exemple:"Un commissionnaire en douane signe une déclaration sous-évaluant des marchandises sur instruction écrite de son client importateur. Le commissionnaire est en première ligne responsable (al.1). S'il produit les instructions écrites du client comme preuve, l'importateur encourt les mêmes peines fiscales (confiscation, amendes). Toutefois, l'importateur ne peut être emprisonné que si sa faute personnelle est établie — par exemple qu'il avait lui-même organisé la fraude (al.2).",
    motscles:["signataire déclaration responsable","omissions inexactitudes irrégularités","recours contre commettant","instructions du commettant","emprisonnement faute personnelle importateur"] },

  { num:373, titre:"Responsabilité pénale des commissionnaires en douane agréés", chapitre:"XII — Responsabilité pénale",
    texte:`1. Les commissionnaires en douane agréés sont responsables des opérations en douane effectuées par leurs soins.
2. Les peines d'emprisonnement édictées par le présent code ne sont applicables aux dirigeants des commissionnaires en douane agréés qu'en cas de faute personnelle.`,
    exemple:"Une société de commissionnaire en douane déclare des marchandises sous une dénomination incorrecte permettant d'éluder des droits. La personne morale (la société) est responsable de l'opération (al.1). Son directeur général ne peut être emprisonné que si l'on prouve qu'il a personnellement ordonné ou participé à la fraude — la responsabilité pénale personnelle des dirigeants exige la faute personnelle (al.2).",
    motscles:["commissionnaire agréé responsable","opérations en douane","emprisonnement dirigeants faute personnelle","personne morale responsabilité","commissionnaire agréé"] },

  { num:374, titre:"Responsabilité pénale des soumissionnaires", chapitre:"XII — Responsabilité pénale",
    texte:`1. Les soumissionnaires sont responsables de l'inexécution des engagements souscrits, sauf leur recours contre les transporteurs et autres mandataires.
2. À cet effet, le service auquel les marchandises sont représentées ne donne décharge que pour les quantités à l'égard desquelles les engagements ont été remplis dans le délai et les pénalités réprimant l'infraction sont poursuivies au bureau d'émission contre les soumissionnaires et leurs cautions.`,
    exemple:"Un importateur soumissionnaire s'est engagé à réexporter 100 véhicules admis en admission temporaire dans un délai de 6 mois. À l'échéance, seulement 70 véhicules sont représentés. Les 30 manquants constituent une inexécution d'engagement : des pénalités sont poursuivies au bureau d'émission contre l'importateur et sa caution bancaire (al.2). Si c'est le transporteur mandataire qui a failli, le soumissionnaire peut se retourner contre lui (al.1).",
    motscles:["soumissionnaire responsable inexécution","engagements souscrits","recours contre transporteurs mandataires","décharge partielle","pénalités bureau d'émission","caution solidaire"] },

  { num:375, titre:"Responsabilité pénale des complices et adhérents", chapitre:"XII — Responsabilité pénale",
    texte:`Les dispositions des articles 45 et 46 du code pénal sont applicables aux complices de délits douaniers et aux adhérents à la fraude qui encourent les mêmes peines que les auteurs principaux.`,
    exemple:"Un comptable qui falsifie des factures pour permettre à son employeur d'éluder des droits de douane est complice d'un délit douanier. Il encourt exactement les mêmes peines que l'importateur auteur principal — confiscation, amende et emprisonnement — par application des articles 45 et 46 du Code pénal sur la complicité (fourniture de moyens, aide et assistance).",
    motscles:["complices délits douaniers","adhérents à la fraude","mêmes peines que auteurs principaux","articles 45 et 46 code pénal","complicité douanière"] },

  { num:376, titre:"Responsabilité pénale des intéressés à la fraude", chapitre:"XII — Responsabilité pénale",
    texte:`1. Ceux qui ont participé comme intéressés d'une manière quelconque à un délit de contrebande ou à un délit d'importation ou d'exportation sans déclaration sont passibles des mêmes peines que les auteurs de l'infraction et, en outre, des peines privatives de droits édictées par l'article 405 du présent code.
2. Sont réputés intéressés :
a) Les entrepreneurs, membres d'entreprise, assureurs, assurés, bailleurs de fonds, propriétaires de marchandises et, en général, ceux qui ont un intérêt direct à la fraude ;
b) Ceux qui ont coopéré d'une manière quelconque à un ensemble d'actes accomplis par un certain nombre d'individus agissant de concert, d'après un plan de fraude arrêté pour assurer le résultat poursuivi en commun ;
c) Ceux qui ont, sciemment, soit couvert les agissements des fraudeurs ou tenté de leur procurer l'impunité, soit acheté ou détenu, même en dehors du rayon, des marchandises provenant d'un délit de contrebande ou d'importation sans déclaration.
3. L'intérêt à la fraude ne peut être imputé à celui qui a agi en état de nécessité ou par suite d'erreur invincible.`,
    exemple:"Un bailleur de fonds qui finance sciemment une opération de contrebande (al.2a), un entrepositaire qui stocke des marchandises de fraude en sachant leur origine illicite (al.2c), et un organisateur logistique d'un réseau coordonné de fraude (al.2b) sont tous réputés intéressés à la fraude et encourent les mêmes peines que les contrebandiers, plus les peines privatives de droits de l'Art. 405. En revanche, un acheteur qui ignorait totalement l'origine frauduleuse des marchandises et ne pouvait pas le savoir (erreur invincible) ne peut être poursuivi comme intéressé (al.3).",
    motscles:["intéressés à la fraude","mêmes peines auteurs","entrepreneurs assureurs bailleurs de fonds","plan de fraude concerté","couvert agissements fraudeurs","achat détention marchandises fraude","état de nécessité erreur invincible"] },

  { num:377, titre:"Sanction de l'achat ou détention de marchandises de contrebande", chapitre:"XII — Responsabilité pénale",
    texte:`Ceux qui ont acheté ou détenu, même en dehors du rayon, des marchandises importées en contrebande ou sans déclaration en quantité supérieure à celle des besoins de leur consommation familiale, sont passibles des sanctions contraventionnelles de la 4ème classe prévues à l'article 388 du présent code.`,
    exemple:"Un particulier de Saint-Louis est trouvé en possession de 500 kg de riz importé en contrebande, quantité manifestement supérieure aux besoins de sa famille. Même s'il n'est pas l'auteur de la contrebande, il est passible des sanctions de la 4ème classe (confiscation + amende égale à la valeur sur le marché intérieur — Art. 388). En revanche, un sachet de thé acheté en fraude pour usage personnel ne tomberait pas sous cette sanction.",
    motscles:["achat détention marchandises contrebande","quantité supérieure consommation familiale","sanctions 4ème classe article 388","même en dehors du rayon","détenteur secondaire"] },

  { num:378, titre:"Responsabilité civile de l'administration des douanes — Saisie non fondée", chapitre:"XIII — Responsabilité civile",
    texte:`1. Lorsqu'une saisie opérée en vertu de l'article 301 alinéa 2 a été reconnue non fondée, le propriétaire des marchandises a droit à un intérêt d'indemnité, à raison de 1 % par mois de la valeur des objets saisis, depuis l'époque de la retenue jusqu'à celle de la remise ou de l'offre qui lui en a été faite.
2. Lorsque les marchandises saisies ont été vendues par application de l'article 365, le propriétaire des marchandises a droit au remboursement du montant de l'adjudication augmenté de l'indemnité de 1 % par mois calculée depuis l'époque de la saisie jusqu'à celle du remboursement ou de l'offre qui lui en a été faite.`,
    exemple:"Des marchandises d'une valeur de 10 millions FCFA sont saisies par la douane et retenues pendant 5 mois avant que le tribunal ne juge la saisie non fondée. Le propriétaire a droit à 1% × 10 millions × 5 = 500 000 FCFA d'indemnité en sus de la restitution des marchandises (al.1). Si les marchandises ont été vendues aux enchères pour 8 millions FCFA durant cette période, le propriétaire reçoit 8 millions + 400 000 FCFA d'intérêt mensuel (al.2).",
    motscles:["saisie non fondée","indemnité 1% par mois","valeur des objets saisis","remboursement adjudication","responsabilité civile de la douane","durée de la retenue"] },

  { num:379, titre:"Responsabilité civile des propriétaires de marchandises pour leurs employés", chapitre:"XIII — Responsabilité civile",
    texte:`Les propriétaires des marchandises sont civilement responsables du fait de leurs employés en ce qui concerne les droits, confiscations, amendes et dépens.`,
    exemple:"Le chauffeur salarié d'un importateur commet une fraude douanière en falsifiant un document lors d'une livraison. L'importateur (employeur, propriétaire des marchandises) est civilement responsable du paiement des droits éludés, des amendes et des dépens prononcés — même si la fraude a été commise par son seul employé à son insu. L'importateur garde un recours contre son chauffeur.",
    motscles:["propriétaires marchandises responsables civils","fait des employés","droits confiscations amendes dépens","responsabilité commettant employeur","recours contre employé"] },

  { num:380, titre:"Responsabilité solidaire des cautions", chapitre:"XIII — Responsabilité civile",
    texte:`Sauf clause contraire, les cautions sont tenues, au même titre que les principaux obligés, de payer les droits et taxes, pénalités pécuniaires et autres sommes dues par les redevables dans la limite de la somme maximale garantie qu'elles ont cautionnés.`,
    exemple:"Une banque qui s'est portée caution pour un importateur bénéficiant d'un régime d'admission temporaire, jusqu'à concurrence de 50 millions FCFA, est solidairement tenue avec l'importateur de payer les droits et pénalités en cas de non-réexportation. Si les droits exigibles s'élèvent à 70 millions, la banque ne sera tenue qu'à hauteur de 50 millions (plafond de sa garantie).",
    motscles:["cautions solidaires","même titre que principal obligé","droits taxes pénalités pécuniaires","limite somme maximale garantie","cautionnement bancaire douanier"] },

  { num:381, titre:"Solidarité des condamnations pour un même fait de fraude", chapitre:"XIV — Solidarité",
    texte:`1. Les condamnations contre plusieurs personnes pour un même fait de fraude sont solidaires, tant pour les pénalités pécuniaires tenant lieu de confiscation que pour l'amende et les dépens.
2. Il n'en est autrement que pour les infractions aux articles 37 et 47 alinéa 1 du présent code qui sont sanctionnées par des amendes individuelles.`,
    exemple:"Trois individus — l'organisateur, le chauffeur et l'entrepositaire — sont condamnés pour le même fait de contrebande portant sur des marchandises valant 20 millions FCFA. La douane peut réclamer la totalité de l'amende (20 millions) à n'importe lequel des trois, à charge pour celui qui paye de se retourner contre les autres (solidarité, al.1). Exception : si l'un d'eux est également condamné séparément pour refus de visite (Art. 37), l'amende correspondante lui est individuelle (al.2).",
    motscles:["solidarité condamnations","même fait de fraude","pénalités pécuniaires amende dépens","amendes individuelles articles 37 et 47","recouvrement solidaire"] },

  { num:382, titre:"Solidarité et contrainte par corps pour le paiement des amendes", chapitre:"XIV — Solidarité",
    texte:`Les propriétaires des marchandises de fraude, ceux qui se sont chargés de les importer ou de les exporter, les intéressés à la fraude, les complices et adhérents, sont tous solidaires et contraignables par corps pour le paiement de l'amende, des sommes tenant lieu de confiscation et des dépens.`,
    exemple:"Dans un réseau de fraude impliquant un propriétaire de marchandises, un importateur, un financer et deux complices, tous sont solidairement tenus du paiement de l'ensemble des condamnations pécuniaires. La douane peut contraindre par corps (emprisonner jusqu'au paiement) n'importe lequel d'entre eux pour recouvrer la totalité des sommes dues — propriétaire, importateur, bailleur de fonds, complices et adhérents sont sur le même plan.",
    motscles:["solidarité contrainte par corps","propriétaires importateurs exportateurs","intéressés complices adhérents","amende sommes tenant lieu confiscation","recouvrement solidaire forcé"] },

  { num:383, titre:"Classification des infractions douanières — Deux catégories", chapitre:"XV — Dispositions répressives",
    texte:`Les infractions douanières sont classées en deux catégories :
- les contraventions douanières prévues et réprimées aux articles 385 à 389 du présent code ;
- les délits douaniers prévus et réprimés aux articles 390 à 392 du présent code.`,
    exemple:"Face à une irrégularité douanière, la première question est : s'agit-il d'une contravention (Art. 385 à 389) ou d'un délit (Art. 390 à 392) ? Une omission mineure sans impact sur les droits relève d'une contravention de 1ère classe (Art. 385), passible d'une simple amende. Un fait de contrebande de marchandises prohibées relève d'un délit de 1ère ou 2ème classe (Art. 390-391), passible d'emprisonnement et de confiscation.",
    motscles:["classification infractions douanières","contraventions articles 385 à 389","délits articles 390 à 392","deux catégories","hiérarchie des infractions"] },

  { num:384, titre:"Tentative de délit douanier assimilée au délit lui-même", chapitre:"XV — Dispositions répressives",
    texte:`Toute tentative de délit douanier est considérée comme le délit lui même. La tentative s'entend par un début d'exécution qui a été suspendue ou a manqué son but ou son effet par des circonstances indépendantes de la volonté de son auteur.`,
    exemple:"Un passeur est intercepté à la frontière alors qu'il tente de faire passer des marchandises prohibées (un début d'exécution). La tentative échoue à cause d'une patrouille douanière imprévue (circonstances indépendantes de sa volonté). La tentative est traitée exactement comme si le délit avait été consommé — même confiscation, même amende, même peine d'emprisonnement que s'il avait réussi à faire passer les marchandises.",
    motscles:["tentative délit douanier","assimilée au délit consommé","début d'exécution","circonstances indépendantes volonté","mêmes peines que délit réalisé"] },

  { num:385, titre:"Contravention douanière de 1ère classe — Irrégularités sans influence sur les droits", chapitre:"XV — Dispositions répressives",
    texte:`1. Est passible d'une amende de 100 000 à 200 000 francs, toute infraction aux dispositions des lois et règlements que l'administration des douanes est chargée d'appliquer lorsque cette irrégularité n'est pas plus sévèrement réprimée par le présent code.
2. Tombent en particulier sous le coup des dispositions de l'alinéa précédent :
a) Toute omission ou inexactitude portant sur l'une des énonciations que les déclarations en détail doivent contenir lorsque cette irrégularité n'a aucune influence sur l'application des droits ou prohibitions ;
b) Toutes infractions aux dispositions de l'article 125 du présent code ;
c) Toutes infractions aux dispositions des articles 70, 74, 76, 80, 82, et 288 du présent code.`,
    exemple:"Un commissionnaire oublie d'indiquer le numéro de téléphone de son client sur une déclaration en détail — erreur sans conséquence sur le calcul des droits ni sur les prohibitions. Il est passible d'une amende de 100 000 à 200 000 FCFA (contravention de 1ère classe). De même, un entrepositaire qui ne tient pas correctement son registre de stock (Art. 125) encourt cette amende.",
    motscles:["contravention 1ère classe","amende 100 000 à 200 000 francs","omission inexactitude sans influence sur droits","article 125","articles 70 74 76 80 82 288"] },

  { num:386, titre:"Contravention douanière de 2ème classe — Irrégularités compromettant le recouvrement des droits", chapitre:"XV — Dispositions répressives",
    texte:`1. Est passible d'une amende égale au double des droits et taxes dus, éludés ou compromis, sans préjudice du paiement des droits et taxes exigibles, toute infraction aux dispositions des lois et règlements que l'administration des douanes est chargée d'appliquer lorsque cette irrégularité a pour but ou pour résultat d'éluder ou de compromettre le recouvrement d'un droit ou d'une taxe quelconque et qu'elle n'est pas spécialement réprimée par le présent code.
Tombent en particulier sous le coup de l'alinéa précédent :
a) les déficits dans le nombre des colis déclarés, manifestés ou transportés sous passavant ;
b) les déficits sur la quantité des marchandises placées sous un régime suspensif, en magasins et aires de dédouanement ou en magasins et aires d'exportation ;
c) la présentation à destination sous scellé rompu ou altéré ;
d) l'inexécution totale ou partielle des engagements souscrits dans les acquits-à-caution et soumissions ;
e) les excédents sur le poids, le nombre ou la mesure déclarés ;
f) l'inobservation des obligations prévues à l'article 156 ;
g) l'inobservation des interdictions ou restrictions prévues à l'article 177.
2. Sont également punies des peines contraventionnelles de 2ème classe, toutes infractions aux dispositions légales ou réglementaires concernant l'exportation préalable ou le drawback.`,
    exemple:"Un transitaire déclare 100 colis à l'entrée en entrepôt sous douane mais à la sortie, seulement 90 sont présentés. Le déficit de 10 colis (al.1a) fait présumer une évasion de droits sur ces marchandises. L'amende sera égale au double des droits qui auraient dû être acquittés sur les 10 colis manquants, en plus du paiement de ces droits. Si les droits éludés s'élèvent à 500 000 FCFA, l'amende sera de 1 000 000 FCFA.",
    motscles:["contravention 2ème classe","amende double des droits éludés","déficit colis manifeste passavant","régime suspensif déficit","scellé rompu altéré","inexécution acquit-à-caution","excédents poids déclarés","drawback exportation préalable"] },

  { num:387, titre:"Contravention douanière de 3ème classe — Contrebande de marchandises non prohibées", chapitre:"XV — Dispositions répressives",
    texte:`Sont passibles de la confiscation des marchandises litigieuses et d'une amende de 100 000 à 200 000 francs :
- Tout fait de contrebande ainsi que tout fait d'importation ou d'exportation sans déclaration lorsque l'infraction porte sur des marchandises de la catégorie de celles qui ne sont ni prohibées ou fortement taxées à l'entrée, ni soumises à des taxes intérieures, ni prohibées ou taxées à la sortie ;
- Toute fausse déclaration dans l'espèce, la valeur ou l'origine des marchandises mises à la consommation ou placées sous un régime suspensif lorsqu'elle peut avoir pour but ou pour effet qu'un droit ou une taxe quelconque se trouve éludé ou compromis ;
- Toute fausse déclaration dans la désignation du destinataire réel ou de l'expéditeur réel ;
- Toute fausse déclaration tendant à obtenir indûment le bénéfice de la franchise prévue à l'alinéa 1 de l'article 260 ;
- La présentation comme unité de plusieurs colis fermés réunis de quelque manière ;
- L'absence de manifeste ou la non-représentation de l'original du manifeste, toute omission ou différence dans la nature des marchandises manifestées.`,
    exemple:"Un commerçant importe sans déclaration des articles de ménage en plastique (marchandises ni prohibées, ni fortement taxées, ni soumises à taxes intérieures). Il encourt la confiscation des marchandises et une amende de 100 000 à 200 000 FCFA (contravention 3ème classe). De même, un importateur qui déclare 'coton brut' (faible taxe) au lieu de 'tissu imprimé' (taxe plus élevée) commet une fausse déclaration dans l'espèce, tombant sous la même sanction.",
    motscles:["contravention 3ème classe","confiscation + amende 100 000 à 200 000","contrebande non prohibées","fausse déclaration espèce valeur origine","fausse désignation destinataire expéditeur","franchise article 260","absence manifeste"] },

  { num:388, titre:"Contravention douanière de 4ème classe — Marchandises prohibées ou fortement taxées", chapitre:"XV — Dispositions répressives",
    texte:`Est passible de la confiscation des marchandises litigieuses et d'une amende égale à leur valeur sur le marché intérieur, toute infraction aux dispositions des lois et règlements que l'administration des douanes est chargée d'appliquer lorsque cette irrégularité se rapporte à des marchandises de la catégorie de celles qui sont prohibées à l'entrée ou à la sortie ou fortement taxées et qu'elle n'est pas spécialement réprimée par le présent code.`,
    exemple:"Des véhicules d'occasion dont l'importation est soumise à des taxes très élevées (fortement taxés) sont introduits sans déclaration. L'infraction n'étant pas constitutive d'un délit douanier (pas de moyens motorisés détournés, valeur en dessous du seuil délictuel), elle relève de la contravention de 4ème classe : les véhicules sont confisqués et une amende égale à leur valeur sur le marché intérieur sénégalais est prononcée. L'amende est donc proportionnelle à la valeur des marchandises, contrairement aux autres classes.",
    motscles:["contravention 4ème classe","confiscation + amende égale valeur marché intérieur","marchandises prohibées fortement taxées","sanction proportionnelle à la valeur","irrégularité non spécialement réprimée"] },

  { num:389, titre:"Contravention douanière de 5ème classe — Refus de communication, obstruction et violations spéciales", chapitre:"XV — Dispositions répressives",
    texte:`1. Sans préjudice de l'application des dispositions des articles 185, 186, 187 et 196 du code pénal, est passible d'une amende de 200 000 à 1 000 000 de francs toute infraction aux dispositions des articles 37, 47 alinéa 1, 61, 67, 69, 72 et 73 du présent code, ainsi que tout refus de communication de pièces, toute dissimulation de pièces ou d'opérations dans les cas prévus aux articles 54 et 125.
2. Tombent également sous le coup de l'alinéa 1 :
a) toute personne qui, après retrait de l'agrément de commissionnaire en douane (Art. 123), continue d'accomplir pour autrui les formalités de douane, directement ou indirectement ;
b) toute personne qui prête sciemment son nom pour soustraire aux effets du retrait d'agrément ceux qui en ont été atteints.
3. Tombent également sous le coup de l'alinéa 1, le non-respect des engagements souscrits dans le cadre des procédures simplifiées prévues aux articles 120 et 121.
4. Lorsqu'il a été rendu contre le contrevenant, dans les cinq (05) ans précédents, un premier jugement pour l'une des contraventions mentionnées à l'alinéa 1, les peines peuvent être doublées.`,
    exemple:"Un entrepositaire privé refuse de présenter ses registres à des agents des douanes venant effectuer un contrôle (refus de communication, Art. 54) : amende de 200 000 à 1 000 000 FCFA (al.1). Un ancien commissionnaire dont l'agrément a été retiré continue à signer des déclarations via un prête-nom — lui et le prête-nom tombent sous la même amende (al.2a et 2b). En cas de récidive dans les 5 ans, le montant peut être doublé : jusqu'à 2 000 000 FCFA (al.4).",
    motscles:["contravention 5ème classe","amende 200 000 à 1 000 000","refus communication dissimulation pièces","articles 37 47 61 67 69 72 73","commissionnaire sans agrément","prête-nom retrait agrément","procédures simplifiées 120 121","doublement récidive 5 ans"] },

  { num:390, titre:"Délit douanier de 1ère classe — Contrebande et import/export sans déclaration", chapitre:"XV — Dispositions répressives",
    texte:`1. Sont passibles de la confiscation de l'objet de fraude, de la confiscation des moyens de transport, de la confiscation des objets servant à masquer la fraude, indépendamment d'une amende égale à la valeur de l'objet de fraude sur le marché intérieur et d'un emprisonnement de trois (03) mois à trois (03) ans, les infractions ci-après lorsqu'elles portent sur des marchandises prohibées à l'entrée ou à la sortie ou fortement taxées à l'entrée ou soumises à des taxes intérieures ou de sortie :
- tous faits de contrebande autre que ceux visés à l'article 391 ;
- tous faits d'importation ou d'exportation sans déclaration de marchandises d'une valeur inférieure ou égale à 5 000 000 de francs.
2. La peine d'emprisonnement est de cinq (05) ans et l'amende de quatre fois la valeur de l'objet de la fraude sur le marché intérieur, lorsque :
- les faits portent sur des marchandises dangereuses pour la santé, la moralité ou la sécurité publique, contrefaisantes ou portant atteinte à la propriété intellectuelle ;
- les faits ont été commis en bande organisée.`,
    exemple:"Un importateur importe sans déclaration 4 000 000 FCFA de cigarettes fortement taxées (valeur ≤ 5 millions). Il encourt : confiscation des cigarettes + confiscation du véhicule + amende de 4 000 000 FCFA + emprisonnement de 3 mois à 3 ans (délit 1ère classe, al.1). Si ces cigarettes étaient des contrefaçons d'une marque célèbre, la peine monte à 5 ans d'emprisonnement et l'amende à 16 000 000 FCFA (4 × 4 millions, al.2).",
    motscles:["délit 1ère classe","confiscation objet fraude moyens transport","amende valeur marché intérieur","emprisonnement 3 mois à 3 ans","marchandises prohibées fortement taxées","valeur ≤ 5 millions","bande organisée 5 ans","marchandises dangereuses contrefaçons"] },

  { num:391, titre:"Délit douanier de 2ème classe — Contrebande par véhicule ou navire, import/export ≥ 5 millions", chapitre:"XV — Dispositions répressives",
    texte:`Sont passibles de la confiscation de l'objet de fraude, de la confiscation des moyens de transports, de la confiscation des objets servant à masquer la fraude, d'une amende égale au montant de la valeur sur le marché intérieur des objets confisqués et d'un emprisonnement de six (06) mois à cinq (05) ans :
- les délits de contrebande accomplis au moyen de véhicule attelé ou autopropulsé, de navire ou embarcation de mer de moins de 500 tonneaux de jauge nette, de pirogue ou bateau de rivière, d'aéronef ;
- les faits d'importation ou d'exportation sans déclaration lorsque ces infractions portent sur des marchandises prohibées à l'entrée ou à la sortie ou fortement taxées à l'entrée ou soumises à des taxes intérieures ou de sortie, et d'une valeur supérieure à 5 000 000 de francs.`,
    exemple:"Un camion (véhicule autopropulsé) est intercepté avec 15 millions FCFA de marchandises prohibées dissimulées dans sa remorque. Deux qualifications peuvent s'appliquer conjointement : (1) contrebande par véhicule motorisé ; (2) importation sans déclaration de marchandises d'une valeur supérieure à 5 millions. Le délit est de 2ème classe : confiscation du camion + confiscation des marchandises + amende de 15 millions FCFA + emprisonnement de 6 mois à 5 ans.",
    motscles:["délit 2ème classe","véhicule attelé autopropulsé","navire pirogue aéronef","emprisonnement 6 mois à 5 ans","valeur supérieure 5 millions","marchandises prohibées fortement taxées","moyen de transport confisqué"] },

  { num:392, titre:"Délit douanier de 3ème classe — Atteinte au système informatique douanier", chapitre:"XV — Dispositions répressives",
    texte:`1. Est puni de la confiscation des moyens ayant servi à commettre l'infraction, d'une amende de 10 000 000 à 20 000 000 de francs et d'un emprisonnement de cinq (05) à dix (10) ans, quiconque :
- accède ou tente d'accéder frauduleusement au système informatique douanier ;
- se maintient ou tente de se maintenir frauduleusement dans ce système ;
- entrave ou fausse le fonctionnement du système informatique douanier ;
- introduit frauduleusement des données dans ce système ;
- intercepte frauduleusement des données informatisées lors de leur transmission ;
- endommage, efface, détériore, altère ou modifie frauduleusement des données douanières informatisées ;
- produit des données contrefaites par manipulation frauduleuse du système informatique douanier ;
- obtient frauduleusement un avantage quelconque par atteinte au système informatique douanier.
2. Est puni des mêmes peines, celui qui se procure frauduleusement un avantage en s'introduisant dans le système informatique douanier.
3. Dans les cas de récidive ou de commission en bande organisée, les peines prévues à l'alinéa 1 sont doublées.`,
    exemple:"Un agent informatique introduit frauduleusement dans le GAINDE (système informatique douanier sénégalais) de fausses données de dédouanement pour un client, lui permettant d'obtenir la mainlevée de marchandises sans payer les droits. Il est passible : confiscation de son ordinateur + amende de 10 à 20 millions FCFA + emprisonnement de 5 à 10 ans (al.1). S'il récidive ou agit en réseau, les peines sont doublées : jusqu'à 40 millions FCFA d'amende et 20 ans d'emprisonnement (al.3).",
    motscles:["délit 3ème classe","système informatique douanier","accès frauduleux GAINDE","amende 10 à 20 millions","emprisonnement 5 à 10 ans","données contrefaites manipulation","interception données","récidive bande organisée doublement peines"] },

  { num:393, titre:"Définition de la contrebande", chapitre:"XV — Dispositions répressives",
    texte:`1. La contrebande s'entend des importations ou des exportations en dehors des unités de dédouanement ainsi que de toute violation des dispositions légales ou réglementaires relatives à la détention et au transport des marchandises à l'intérieur du territoire douanier.
2. Constituent, en particulier, des faits de contrebande :
a) la violation des articles 63 al.1, 65, 79, 81 al.1, 78, 83 al.1, 272, 273 et 278 ;
b) Les transbordements frauduleux ;
c) les versements ou embarquements frauduleux effectués soit dans l'enceinte des ports, soit sur les côtes, à l'exception des débarquements frauduleux visés à l'article 400 al.1 ;
d) les soustractions ou substitutions en cours de transport de marchandises expédiées sous un régime suspensif, l'inobservation sans motif légitime des itinéraires et horaires fixés, les manœuvres altérant les moyens de scellement ou d'identification et toute fraude relative au transport sous régime suspensif ;
e) la violation de prohibition d'exportation ou subordonnant l'exportation à des formalités particulières, lorsque la fraude est faite en dehors des unités de dédouanement et n'est pas spécialement réprimée.
3. Sont assimilées à des actes de contrebande les importations ou exportations sans déclaration par dissimulation dans des cachettes spécialement aménagées ou dans des cavités non destinées normalement au logement des marchandises.`,
    exemple:"a) Un pirogue accoste discrètement la nuit sur une plage de Casamance pour débarquer des marchandises : contrebande par entrée hors bureau de douane (al.1). b) Un camion-citerne de transit frauduleusement transféré vers un camion local en pleine route : transbordement frauduleux (al.2b). c) Des médicaments cachés dans des compartiments secrets d'une voiture, même passant par un bureau de douane : assimilé à contrebande par dissimulation en cachette spécialement aménagée (al.3).",
    motscles:["définition contrebande","importations exportations hors bureaux","transbordements frauduleux","embarquements côtes ports","régime suspensif fraude transport","cachettes spécialement aménagées","contrebande assimilée"] },

  { num:394, titre:"Présomption de contrebande dans la zone terrestre du rayon", chapitre:"XV — Dispositions répressives",
    texte:`Les marchandises prohibées à l'entrée ou fortement taxées ou soumises à des taxes intérieures sont réputées avoir été introduites en contrebande, et les marchandises dont la sortie est prohibée ou assujettie à des droits sont réputées faire l'objet d'une tentative d'exportation en contrebande dans les cas suivants :
1. lorsqu'elles sont trouvées dans la zone terrestre du rayon sans être munies d'un acquit de paiement, passavant ou autre expédition valable pour la route et le délai de transport, à moins qu'elles ne viennent de l'intérieur par la route conduisant directement à l'unité de douane la plus proche et soient accompagnées des documents prévus à l'article 272 alinéa 2 ;
2. lorsqu'elles ont dépassé une unité de douane de passage sans remplir l'obligation expresse de visa qui y était mentionnée ;
3. lorsqu'ayant été amenées à l'unité de douane dans le cas de l'article 273 alinéa 2, elles se trouvent dépourvues des documents de l'article 272 alinéa 2 ;
4. lorsqu'elles sont trouvées dans la zone terrestre du rayon en infraction à l'article 279.`,
    exemple:"Un camion transporte des téléphones fortement taxés et est contrôlé à 15 km de la frontière (dans la zone du rayon). Le chauffeur ne peut présenter ni acquit de paiement, ni passavant, ni aucun document de transit. Sans pouvoir prouver l'origine régulière de ces marchandises, elles sont présumées de contrebande (cas 1). Le renversement de la charge de la preuve (Art. 350) impose au détenteur de justifier de la régularité.",
    motscles:["présomption contrebande zone rayon","acquit de paiement passavant","unité de douane de passage visa","article 272 al.2 documents","article 279 infraction","marchandises prohibées fortement taxées rayon"] },

  { num:395, titre:"Présomption d'importation en contrebande hors du rayon — Justifications d'origine", chapitre:"XV — Dispositions répressives",
    texte:`Les marchandises visées à l'article 280 sont réputées avoir été importées en contrebande à défaut de justifications d'origine ou si les documents présentés sont faux, inexacts, incomplets ou non applicables.
Elles sont saisies en quelque lieu qu'elles se trouvent et les personnes visées aux alinéas 1 et 2 de l'article 280 sont poursuivies et punies conformément aux dispositions des articles 390 et 391.
Lorsqu'ils auront eu connaissance que celui qui leur a délivré les justifications d'origine ne pouvait le faire valablement ou que celui qui leur a vendu ou confié les marchandises n'était pas en mesure de justifier de leur détention régulière, les détenteurs et transporteurs seront condamnés aux mêmes peines que ci-dessus, quelles que soient les justifications qui auront pu être produites.`,
    exemple:"Un grossiste de Dakar est en possession de téléphones dont le certificat d'origine est un faux. Même hors de la zone du rayon, ces marchandises sont saisies et le grossiste est poursuivi comme s'il les avait lui-même importées en contrebande (Art. 390 ou 391). Si le grossiste savait que son fournisseur ne pouvait pas légalement justifier l'origine de la marchandise, il est condamné aux mêmes peines même s'il présente de faux documents.",
    motscles:["présomption contrebande hors rayon","article 280 justifications d'origine","documents faux inexacts incomplets","saisie en tout lieu","détenteurs transporteurs mauvaise foi","condamnation mêmes peines que contrebandiers"] },

  { num:396, titre:"Définition des importations et exportations sans déclaration", chapitre:"XV — Dispositions répressives",
    texte:`Constituent des importations et exportations sans déclaration :
1. les importations ou exportations par les unités de dédouanement, sans déclaration en détail ou sous le couvert d'une déclaration en détail non applicable aux marchandises présentées ;
2. les non-représentations, soustractions ou substitutions de marchandises sous douane ;
3. le défaut de dépôt, dans le délai imparti, des déclarations complémentaires prévues à l'article 120.`,
    exemple:"1) Un importateur passe en douane avec une déclaration en détail visant des 'outils agricoles' (faible taxe) alors qu'il présente en réalité des smartphones (taxe plus élevée) : déclaration non applicable aux marchandises réelles. 2) Des marchandises placées en entrepôt sous douane disparaissent sans déclaration de sortie (soustraction de marchandises sous douane). 3) Un opérateur économique bénéficiant d'une procédure simplifiée (Art. 120) ne dépose pas sa déclaration complémentaire dans le délai prévu.",
    motscles:["importations exportations sans déclaration","déclaration non applicable","non-représentation soustraction substitution","marchandises sous douane","déclaration complémentaire article 120","délai dépôt"] },

  { num:397, titre:"Présomptions d'importation sans déclaration — Navires et marchandises", chapitre:"XV — Dispositions répressives",
    texte:`Sont réputés faire l'objet d'une importation sans déclaration :
1. les marchandises déclarées pour transport avec emprunt du territoire étranger, exportation temporaire ou passavant de circulation, en cas de non-représentation ou de différence dans la nature ou l'espèce entre lesdites marchandises et celles présentées au départ ;

  { num:399, titre:"Délits d'importations ou exportations sans déclaration de marchandises prohibées", chapitre:"XV — Dispositions répressives",

  { num:400, titre:"Délits d'importation sans déclaration — Débarquements frauduleux et autres cas", chapitre:"XV — Dispositions répressives",

  { num:401, titre:"Délit d'exportation sans déclaration de marchandises prohibées", chapitre:"XV — Dispositions répressives",
    texte:`1. Est réputée délit d'exportation sans déclaration de marchandises prohibées toute infraction aux dispositions législatives ou réglementaires portant prohibition d'exportation ou subordonnant l'exportation ou la réexportation au paiement de droits, de taxes ou à l'accomplissement de formalités particulières lorsque la fraude a été commise ou tentée lors du passage par les unités de dédouanement et qu'elle n'est pas spécialement réprimée par une autre disposition.

    const iosBanner= document.getElementById('ios-banner');
    const btnIn    = document.getElementById('install-btn');
    const btnClose = document.getElementById('install-close');
    const iosClose = document.getElementById('ios-close');
    const offBadge = document.getElementById('offline-badge');

    // Détection iOS (iPhone/iPad)
    const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
    // Détection si déjà installé en mode standalone
    const isStandalone = window.navigator.standalone === true
                      || window.matchMedia('(display-mode: standalone)').matches;

    if (isIOS && !isStandalone) {
      // iOS : afficher le guide manuel après 2s
      setTimeout(() => iosBanner.style.display = 'block', 2000);
    }

    iosClose.addEventListener('click', () => iosBanner.style.display = 'none');

    // Android : bannière automatique via beforeinstallprompt
    let deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', e => {
      e.preventDefault();
      deferredPrompt = e;
      if (!isIOS) banner.classList.add('show');
    });

    btnIn.addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      if (outcome === 'accepted') banner.classList.remove('show');
      deferredPrompt = null;
    });

    btnClose.addEventListener('click', () => banner.classList.remove('show'));
    window.addEventListener('appinstalled', () => {
      banner.classList.remove('show');
      iosBanner.style.display = 'none';
    });

    // Badge hors ligne
    function updateOnlineStatus() {
      if (!navigator.onLine) offBadge.classList.add('show');
      else offBadge.classList.remove('show');
    }
    window.addEventListener('online',  updateOnlineStatus);
    window.addEventListener('offline', updateOnlineStatus);
    updateOnlineStatus();
  </script>
