    exemple:"Un exportateur sénégalais expédie 500 tonnes d'arachides vers Rotterdam. Deux options (al.1) : (a) mettre directement les sacs d'arachides à bord du navire au quai d'embarquement du Port de Dakar ; (b) les déposer d'abord dans un magasin ou aire d'exportation agréé (ex : entrepôt frigorifique du port) après accomplissement des formalités d'exportation, puis les charger ultérieurement. Pour l'exportation terrestre vers le Mali d'un camion de ciment (al.2), les marchandises doivent être conduites directement à la frontière malienne sans détour.",
    motscles:["exportation","mise à bord","magasin d'exportation","aire d'exportation","voies maritimes","voies fluviales","voies aériennes","voies terrestres","conduite à l'étranger"] },

  { num:93, titre:"Exportation aérienne — Obligation d'utiliser les aéroports douaniers", chapitre:"II — Exportation", section:"",
    texte:`Les aéronefs civils et militaires qui sortent du territoire douanier ne peuvent prendre le vol que dans des aéroports douaniers.`,
    exemple:"Un jet privé souhaitant quitter le Sénégal avec des passagers et du fret ne peut pas décoller d'une piste privée ou d'une airstrip non douanière — il doit impérativement utiliser l'Aéroport International Blaise Diagne ou l'aéroport de Ziguinchor (aéroports douaniers). Cette règle est symétrique à l'article 81 (import) et s'applique même aux avions militaires : un avion de chasse ou de transport militaire qui quitte le territoire doit le faire depuis un aéroport douanier agréé, sauf force majeure.",
    motscles:["exportation aérienne","aéroports douaniers","prise de vol","aéronefs civils","aéronefs militaires","sortie territoire","aéroport Blaise Diagne","piste privée interdite"] },

/* ===================== DATA: TITRE IV — ARTICLES 94–108 COMPLETS ===================== */
const TITRE4_ARTICLES = [
  { num:94, titre:"Surveillance douanière dès l'introduction dans le territoire", chapitre:"I — Introduction des marchandises dans le territoire douanier", section:"",
    texte:`Les marchandises qui sont introduites dans le territoire douanier sont, dès cette introduction, soumises à la surveillance douanière. Elles peuvent faire l'objet de contrôles de la part du service des douanes conformément aux dispositions en vigueur.`,
    exemple:"Un conteneur de téléphones chargé à Shanghai sur un navire devient soumis à la surveillance douanière sénégalaise dès le moment où le navire franchit la limite des eaux territoriales du Sénégal (12 milles marins) — bien avant d'accoster au Port de Dakar. Si les douaniers décident de monter à bord pour un contrôle en rade, ils en ont parfaitement le droit. La surveillance douanière est donc continue dès l'introduction, pas seulement au moment du dédouanement.",
    motscles:["surveillance douanière","introduction territoire douanier","contrôles","dès l'introduction","eaux territoriales"] },

  { num:95, titre:"Conduite sans délai au bureau de douane désigné", chapitre:"I — Introduction des marchandises dans le territoire douanier", section:"",
    texte:`1. Les marchandises qui sont introduites dans le territoire douanier doivent être conduites sans délai au bureau des douanes désigné par le service des douanes ou en tout autre lieu désigné ou agréé par ce dernier.\n\n2. Toute personne qui prend en charge le transport des marchandises après qu'elles ont été introduites dans le territoire douanier, même par suite d'un transbordement, devient responsable de l'exécution de l'obligation visée à l'alinéa 1.\n\n3. L'alinéa 1 ne s'applique pas aux marchandises se trouvant à bord de navires ou d'aéronefs qui traversent la mer territoriale ou l'espace aérien national et qui n'ont pas pour destination un port ou un aéroport situé dans le territoire douanier.`,
    exemple:"Un camion malien entre au Sénégal par la frontière de Kidira : il doit immédiatement se diriger vers le Bureau de Douane de Kidira sans s'arrêter en chemin (al.1). Si un transitaire prend en charge la cargaison à Tambacounda pour la conduire à Dakar, il devient lui-même responsable de la présenter à la douane (al.2). En revanche, un avion Air France Paris-Abidjan qui survole le Sénégal sans atterrir n'est pas soumis à cette obligation — il ne fait que traverser l'espace aérien national sans destination sénégalaise (al.3).",
    motscles:["conduite sans délai","bureau de douane désigné","responsabilité transport","transbordement","traversée espace aérien","mer territoriale","navires de passage"] },

  { num:96, titre:"Force majeure — Impossibilité d'exécuter l'obligation de conduite", chapitre:"I — Introduction des marchandises dans le territoire douanier", section:"",
    texte:`1. Lorsque par suite d'un cas fortuit ou de force majeure, l'obligation visée à l'article 95 alinéa 1 du présent code ne peut être exécutée, la personne tenue de cette obligation ou toute autre personne agissant en ses lieu et place informe, sans délai le service des douanes de cette situation. Lorsque ce cas fortuit ou de force majeure n'a pas entraîné la perte totale des marchandises, les agents des douanes doivent en outre être informés du lieu précis où ces marchandises se trouvent.\n\n2. Lorsqu'un navire ou un aéronef visé à l'article 95 alinéa 3 du présent code, est contraint, par suite d'un cas fortuit ou de force majeure, à faire relâche ou à stationner temporairement dans le territoire douanier sans pouvoir respecter l'obligation prévue à l'article 95 alinéa 1 du présent code, la personne qui a introduit ce navire ou cet aéronef dans le territoire douanier, ou toute autre personne agissant en ses lieu et place, informe sans délai le service des douanes de cette situation.\n\n3. L'administration des douanes détermine les mesures à observer pour permettre la surveillance douanière des marchandises visées au paragraphe 1 ainsi que de celles se trouvant à bord d'un navire ou d'un aéronef conformément à l'alinéa 2 du présent article et assurer, le cas échéant, leur conduite ultérieure à un bureau de douane ou en tout autre lieu désigné ou agréé par elle.`,
    exemple:"Un camion transportant des médicaments depuis Ziguinchor tombe en panne sur la RN1 à 80 km de Dakar — cas fortuit (al.1). Le chauffeur doit immédiatement appeler le service des douanes pour les informer de la panne ET leur indiquer le kilomètre exact où le camion est immobilisé. Les douaniers envoient un agent pour surveiller la cargaison sur place jusqu'à la réparation ou le transbordement. Autre cas : un avion Paris-Lagos dérouté d'urgence sur Dakar suite à une avarie moteur (force majeure, al.2) — le commandant informe immédiatement la douane de l'atterrissage non prévu.",
    motscles:["force majeure","cas fortuit","information sans délai","lieu précis","relâche forcée","panne","déroutement","surveillance sur place"] },

  { num:97, titre:"Présentation en douane des marchandises — Obligation et responsabilité", chapitre:"II — Présentation en douane des marchandises", section:"",
    texte:`Les marchandises qui arrivent au bureau des douanes ou en tout autre lieu désigné ou agréé par le service doivent être présentées en douane par la personne qui a introduit les marchandises dans le territoire douanier ou, le cas échéant, par la personne qui prend en charge le transport des marchandises.`,
    exemple:"Un importateur dakarois mandate un transitaire pour amener sa cargaison de climatiseurs depuis le port jusqu'au bureau de douane. C'est le transitaire — en tant que personne qui prend en charge le transport — qui a l'obligation légale de présenter les marchandises en douane (et non l'importateur resté dans son bureau). Si le transitaire ne se présente pas à la douane ou se présente avec une cargaison incomplète, c'est lui qui est juridiquement responsable, pas l'importateur. La présentation en douane est un acte formel obligatoire.",
    motscles:["présentation en douane","bureau des douanes","lieu désigné","responsabilité","transporteur","transitaire","importateur","acte formel"] },

  { num:98, titre:"Examen et prélèvements d'échantillons après présentation", chapitre:"II — Présentation en douane des marchandises", section:"",
    texte:`Dès qu'elles ont été présentées en douane, les marchandises peuvent, avec l'autorisation de l'administration des douanes, faire l'objet d'examen ou de prélèvements d'échantillons aux fins de leur donner une destination douanière.`,
    exemple:"Un importateur de produits chimiques présente sa cargaison en douane au Port de Dakar. Avant de déposer la déclaration en détail, il souhaite faire analyser les produits pour confirmer leur composition exacte et choisir le bon code SH (et donc la bonne destination douanière). Avec l'autorisation des douanes (al.1), un technicien prélève des échantillons pour analyse en laboratoire. Le résultat de l'analyse permettra de déterminer si les produits sont classés comme engrais (taux réduit) ou comme produits chimiques dangereux (réglementation stricte).",
    motscles:["examen","prélèvement échantillons","autorisation douanière","destination douanière","analyse laboratoire","code SH","présentation en douane"] },

  { num:99, titre:"Déclaration sommaire — Obligation de dépôt et délai", chapitre:"III — Déclaration sommaire et déchargement", section:"",
    texte:`Les marchandises présentées en douane doivent faire l'objet d'une déclaration sommaire. La déclaration sommaire doit être déposée dès que la présentation en douane des marchandises a eu lieu. Toutefois, les autorités douanières peuvent accorder pour ce dépôt un délai n'excédant pas vingt quatre (24) heures.\n\nLe dépôt de la déclaration sommaire est effectué soit par la personne qui transporte effectivement les marchandises sur le territoire douanier, soit par la personne qui a le commandement ou la responsabilité du moyen de transport.`,
    exemple:"Un camion arrive au Bureau de Douane de Rosso à 14h00. Le conducteur doit immédiatement déposer la déclaration sommaire (lettre de voiture). Si le commissionnaire en douane n'est pas disponible immédiatement, la douane peut accorder un délai jusqu'à 14h00 le lendemain au maximum (24h). La déclaration peut être déposée soit par le chauffeur lui-même (personne qui transporte effectivement), soit par le chef de convoi (personne ayant le commandement du moyen de transport) — pas nécessairement par le propriétaire des marchandises.",
    motscles:["déclaration sommaire","dépôt immédiat","délai 24 heures","présentation en douane","transporteur","commandement du moyen de transport","chauffeur","chef de convoi"] },

  { num:100, titre:"Déchargement et déplacement des marchandises — Autorisation préalable", chapitre:"III — Déclaration sommaire et déchargement", section:"",
    texte:`1. Les marchandises ne peuvent être déchargées ou transbordées du moyen de transport dans lequel elles se trouvent, qu'avec l'accord du service des douanes dans les lieux désignés et agréés par lui. Toutefois cette autorisation n'est pas requise en cas de péril imminent nécessitant le déchargement immédiat des marchandises, en totalité ou en partie. Dans ce cas, le service en est informé sans délai.\n\n2. Les marchandises ne peuvent être enlevées de l'endroit où elles ont été initialement placées sans l'accord de l'administration des douanes.`,
    exemple:"Un navire accoste au Port de Dakar. Le manutentionnaire ne peut pas commencer à décharger les conteneurs avant d'avoir reçu l'autorisation écrite du service des douanes (al.1). Exception : si un incendie se déclare dans la cale, le capitaine peut ordonner un déchargement d'urgence immédiat, à charge d'informer aussitôt la douane. Une fois les marchandises déchargées et placées sur le quai désigné (al.2), personne ne peut les déplacer vers un entrepôt privé ou les charger sur un camion sans un nouveau bon d'enlèvement douanier.",
    motscles:["déchargement","transbordement","accord du service des douanes","péril imminent","enlèvement marchandises","autorisation préalable","manutentionnaire","quai"] },

  { num:101, titre:"Obligation d'assigner une destination douanière", chapitre:"IV — Obligation de donner une destination douanière", section:"",
    texte:`Les marchandises présentées en douane doivent recevoir une des destinations douanières appropriées prévues à l'article 1er alinéa 7 du présent code.`,
    exemple:"Une cargaison de tissus présentée en douane au Port de Dakar ne peut pas rester indéfiniment 'en attente'. Elle doit recevoir une destination douanière précise : soit être déclarée pour la mise à la consommation (importation définitive avec paiement des droits), soit être placée en transit vers le Mali, soit être mise en entrepôt douanier, soit être déclarée en admission temporaire, etc. L'article 1 al.7 liste les trois grandes destinations possibles : assignation à un régime douanier, destruction, ou abandon au Trésor public.",
    motscles:["destination douanière","article 1 alinéa 7","régime douanier","destruction","abandon Trésor public","marchandises présentées","obligation"] },

  { num:102, titre:"Délai de 15 jours pour accomplir les formalités de destination", chapitre:"IV — Obligation de donner une destination douanière", section:"",
    texte:`Lorsque les marchandises ont fait l'objet d'une déclaration sommaire, les formalités en vue de leur donner une destination douanière doivent être remplies dans un délai ne pouvant excéder quinze (15) jours à partir de la date de dépôt de la déclaration sommaire, sauf si elles sont placées en magasins et aires de dédouanement.`,
    exemple:"Un importateur dépose la déclaration sommaire pour sa cargaison d'électroménager le 1er du mois. Il dispose de 15 jours, soit jusqu'au 16 du mois, pour déposer la déclaration en détail et choisir le régime douanier (mise à la consommation, entrepôt, transit, etc.). S'il n'agit pas dans ce délai, ses marchandises peuvent être constituées d'office en dépôt de douane. Exception : s'il place d'abord les marchandises dans un magasin ou une aire de dédouanement agréé (Art. 103), le délai de 15 jours est suspendu — elles peuvent y rester jusqu'à 30 ou 90 jours selon la décision du DGD.",
    motscles:["délai 15 jours","déclaration sommaire","destination douanière","formalités","magasins de dédouanement","aires de dédouanement","dépôt d'office","régime douanier"] },

  { num:103, titre:"Magasins et aires de dédouanement — Ouverture et agrément", chapitre:"V — Magasins et aires de dédouanement", section:"",
    texte:`1. Sauf dispositions spéciales contraires, les marchandises conduites en douane dans les conditions prévues aux articles 62 à 90 ci-dessus peuvent être placées en magasins ou en aires de dédouanement suivant les modalités fixées au présent chapitre.\n\n2. L'ouverture des magasins ou aires de dédouanement, est subordonnée à l'autorisation du Directeur général des douanes qui en agrée l'emplacement, la construction et l'aménagement.\n\n3. L'autorisation visée à l'alinéa 2 du présent article détermine les conditions auxquelles le fonctionnement des magasins ou aires de dédouanement est subordonné et fixe éventuellement les charges de l'exploitant en matière de fourniture, d'entretien et de réparation des installations nécessaires à l'exécution du service.`,
    exemple:"Un opérateur portuaire souhaite construire un entrepôt de 5 000 m² au Port de Dakar pour servir de magasin de dédouanement. Il doit adresser une demande d'autorisation au Directeur général des douanes avec les plans de construction, l'étude d'emplacement et le projet d'aménagement (al.2). Le DGD agrée (ou refuse) l'emplacement, les plans et les équipements. L'autorisation accordée précise les conditions de fonctionnement : horaires d'ouverture, équipements de surveillance CCTV obligatoires, système informatique de gestion des stocks connecté à GAINDE, nombre d'agents de sécurité requis (al.3).",
    motscles:["magasins de dédouanement","aires de dédouanement","autorisation Directeur général","agrément","emplacement","construction","aménagement","exploitant"] },

  { num:104, titre:"Admission des marchandises dans les magasins — Déclaration sommaire et responsabilité", chapitre:"V — Magasins et aires de dédouanement", section:"",
    texte:`1. L'admission des marchandises dans les magasins ou sur les aires de dédouanement est subordonnée au dépôt par l'exploitant d'une déclaration sommaire ou d'un document en tenant lieu qui peut se présenter sur support papier ou électronique.\n\n2. Cette admission a pour effet de placer les marchandises sous la responsabilité de l'exploitant vis-à-vis de l'administration des douanes.`,
    exemple:"Maersk Line confie 200 conteneurs à un magasin de dédouanement du Port de Dakar. L'exploitant du magasin doit déposer une déclaration sommaire (ou un bon d'entrée électronique via GAINDE) pour chaque lot admis dans ses locaux (al.1). À partir de ce moment, l'exploitant devient personnellement responsable de la conservation intégrale de ces marchandises vis-à-vis de la douane (al.2). Si un conteneur disparaît ou si des marchandises sont subtilisées dans son entrepôt, c'est l'exploitant qui devra payer les droits et taxes correspondants à la douane — pas l'importateur.",
    motscles:["admission magasins","déclaration sommaire","responsabilité exploitant","administration des douanes","support papier","support électronique","GAINDE","conservation"] },

  { num:105, titre:"Durée de séjour en magasins — 30 jours et prorogation à 90 jours", chapitre:"V — Magasins et aires de dédouanement", section:"",
    texte:`1. La durée maximale du séjour des marchandises en magasins ou sur les aires de dédouanement est fixée par décision du Directeur général des douanes et ne peut excéder trente (30) jours, sauf dispositions contraires.\n\n2. Lorsque les circonstances l'exigent, une décision du Directeur général des douanes peut porter à quatre-vingt-dix (90) jours le délai visé à l'alinéa précédent.\n\n3. La gestion des magasins ou aires de dédouanement peut être confiée à des concessionnaires qui acquièrent la qualité d'exploitant.\n\n4. Les marchandises placées en magasin ou aire de dédouanement ne peuvent faire l'objet de manipulations autres que celles destinées à assurer leur conservation en l'état, sans en modifier la présentation ou les caractéristiques techniques.\n\n5. À l'expiration du délai prévu aux alinéas 1 et 2 du présent article, les marchandises qui n'ont pas fait l'objet d'une déclaration leur assignant un régime douanier, sont constituées d'office en dépôt de douane.`,
    exemple:"Une cargaison de pièces automobiles est placée dans un magasin de dédouanement du Port de Dakar le 1er janvier (al.1 : délai maximum 30 jours → jusqu'au 31 janvier). L'importateur rencontre des difficultés financières pour payer les droits. Il demande une prorogation : le DGD peut accorder jusqu'à 90 jours supplémentaires (al.2), soit jusqu'au 1er avril. Pendant ce séjour, l'exploitant ne peut que nettoyer les caisses ou remplacer un emballage abîmé (conservation), mais il ne peut pas ouvrir les caisses pour inspecter les pièces ou les reconditionner (al.4 : pas de modification). Si au 1er avril aucune déclaration n'est faite, les pièces sont constituées d'office en dépôt de douane (al.5).",
    motscles:["durée séjour","30 jours","90 jours","Directeur général","prorogation","concessionnaire","exploitant","conservation en l'état","manipulation interdite","dépôt d'office"] },

  { num:106, titre:"Engagement cautionné de l'exploitant", chapitre:"V — Magasins et aires de dédouanement", section:"",
    texte:`Les obligations et responsabilités de l'exploitant font l'objet d'un engagement cautionné.`,
    exemple:"Avant d'ouvrir son magasin de dédouanement, l'exploitant doit souscrire un engagement cautionné auprès de la douane : il fournit une caution bancaire ou une garantie financière d'un montant fixé par la douane, couvrant la valeur maximale des droits et taxes susceptibles d'être dus sur les marchandises qui pourraient transiter dans ses locaux. Si des marchandises disparaissent, la douane peut immédiatement actionner la caution pour récupérer les droits dus, sans attendre un jugement civil. C'est la contrepartie de la responsabilité étendue accordée à l'exploitant par l'article 104.",
    motscles:["engagement cautionné","caution bancaire","garantie financière","obligations exploitant","responsabilités","droits et taxes","recouvrement"] },

  { num:107, titre:"Arrêté du Ministre fixant les conditions d'application", chapitre:"V — Magasins et aires de dédouanement", section:"",

    motscles:["arrêté Ministre des Finances","conditions d'application","réglementation","textes d'application","caution","sécurité magasins","formulaires"] },

  { num:108, titre:"Destruction des marchandises présentées en douane", chapitre:"VI — Autres dispositions", section:"",
    texte:`Lorsque les circonstances l'exigent ou lorsque les propriétaires ou les détenteurs en font la demande, le Directeur général des douanes peut faire procéder à la destruction des marchandises présentées en douane. Il en informe le détenteur des marchandises. Les frais relatifs à la destruction des marchandises sont à la charge de ce dernier.`,
    exemple:"Trois scénarios typiques : (1) Un conteneur de poulets congelés arrive au Port de Dakar mais le certificat sanitaire est périmé — la consommation est dangereuse. Le DGD ordonne la destruction des poulets à la demande de la Direction de l'Hygiène. (2) Un importateur reçoit une marchandise non conforme à sa commande (mauvaise couleur de textiles) et préfère les détruire plutôt que de payer les droits d'importation — il en fait la demande au DGD. Dans les deux cas, les frais d'incinération, d'équarrissage ou d'enfouissement sont à la charge du détenteur, pas de la douane.",
    motscles:["destruction marchandises","Directeur général","demande détenteur","circonstances exigent","frais à la charge","certificat sanitaire périmé","marchandises non conformes","incinération"] },
