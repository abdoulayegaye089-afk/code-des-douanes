                  <div style={{ display:"flex", flexWrap:"wrap", gap:4 }}>
                    {a.motscles.slice(0,4).map(m => (
                      <span key={m} onClick={e => { e.stopPropagation(); setSearch(m); }}
                        style={{ background:T.surface, border:`1px solid ${T.border}`, color:T.dim, fontSize:12, padding:"2px 9px", borderRadius:20, cursor:"pointer" }}
                        onMouseEnter={e => { e.currentTarget.style.color=color; e.currentTarget.style.borderColor=color+"66"; }}
                        onMouseLeave={e => { e.currentTarget.style.color=T.dim; e.currentTarget.style.borderColor=T.border; }}>
                        #{m}
                      </span>
                    ))}
                  </div>
                </div>
                <div style={{ color:T.muted, fontSize:15, flexShrink:0, marginTop:12 }}>{isOpen ? "▲" : "▼"}</div>
              </div>

              {isOpen && (
                <div style={{ borderTop:`1px solid ${T.border}` }}>
                  <div style={{ padding:"16px 18px 12px" }}>
                    <div style={{ fontSize:12, color, fontWeight:700, letterSpacing:"0.7px", marginBottom:10, display:"flex", alignItems:"center", gap:6 }}>
                      <span>📜</span> TEXTE OFFICIEL — ARTICLE {a.num}
                    </div>
                    <div style={{ background:T.surface, borderRadius:8, padding:"18px 20px", borderLeft:`3px solid ${color}` }}>
                      {a.texte.split('\n').map((line, i) => (
                        <p key={i} style={{ fontSize:15, lineHeight:2, margin:"0 0 6px",
                          color: T.text }}>
                          {line}
                        </p>
                      ))}
                    </div>
                  </div>
                  <div style={{ padding:"0 18px 16px" }}>
                    <div style={{ fontSize:12, color:T.green, fontWeight:700, letterSpacing:"0.5px", marginBottom:10, display:"flex", alignItems:"center", gap:6 }}>
                      <span>💡</span> EXEMPLE TYPIQUE
                    </div>
                    <div style={{ background:T.greenBg, borderRadius:8, padding:"14px 16px", border:`1px solid ${T.green}44` }}>
                      <p style={{ fontSize:15, color:T.text, lineHeight:1.75, margin:0 }}>{a.exemple}</p>
                    </div>
                    <div style={{ marginTop:10, display:"flex", flexWrap:"wrap", gap:5 }}>
                      {a.motscles.map(m => (
                        <span key={m} onClick={() => setSearch(m)}
                          style={{ background:color+"15", border:`1px solid ${color}33`, color, fontSize:13, padding:"3px 10px", borderRadius:20, cursor:"pointer", fontWeight:500 }}
                          onMouseEnter={e => e.currentTarget.style.background=color+"30"}
                          onMouseLeave={e => e.currentTarget.style.background=color+"15"}>
                          #{m}
                        </span>
                      ))}
                    </div>
                  </div>
                </div>
              )}
            </div>
          );
        })}
      </div>

      {filtered.length === 0 && (
        <div style={{ textAlign:"center", padding:"40px 0", color:T.muted }}>
          <div style={{ fontSize:32, marginBottom:12 }}>🔍</div>
          <div>Aucun article trouvé pour « {search} »</div>
          <button onClick={() => { setSearch(""); setFilterCh("tous"); }} style={{ ...S.btn, marginTop:12 }}>Réinitialiser</button>
        </div>
      )}
    </div>
  );
}

function App() {
  const [tab, setTab] = useState("accueil");
  const [dark, setDark] = useState(true);
  const [notifEnabled, setNotifEnabled] = useState(() => {
    try { return localStorage.getItem("douanes_notif_enabled") === "1" && "Notification" in window && Notification.permission === "granted"; }
    catch (e) { return false; }
  });

  // Update global T before each render so all components see the right palette
  Object.assign(T, dark ? DARK : LIGHT);

  const toggle = () => setDark(d => !d);

  const [rappelArticle, setRappelArticle] = useState(null);

  // ===== Rappel "Article du moment" toutes les 2 heures =====
  // 1) Affiche toujours une carte interne dans l'appli (fonctionne partout, onglet ouvert)
  // 2) Envoie en plus une notification système si l'utilisateur l'a activée et autorisée
  useEffect(() => {
    if (ALL_ARTICLES_NOTIF.length === 0) return;
    const DEUX_HEURES = 2 * 60 * 60 * 1000;

    const tirerArticle = () => ALL_ARTICLES_NOTIF[Math.floor(Math.random() * ALL_ARTICLES_NOTIF.length)];

    const declencherRappel = () => {
      const art = tirerArticle();

      // Carte interne — toujours affichée
      setRappelArticle(art);

      // Notification système — si activée et autorisée
      if (notifEnabled && "Notification" in window && Notification.permission === "granted") {
        const corps = (art.exemple || art.texte || "").replace(/\s+/g, " ").trim();
        try {
          const n = new Notification(`📜 Art. ${art.num} — ${art.titre}`, {
            body: corps.length > 200 ? corps.slice(0, 200) + "…" : corps,
            tag: "douanes-rappel-" + art.num + "-" + Date.now()
          });
          n.onclick = () => { window.focus(); };
        } catch (e) { /* notification non disponible, on ignore silencieusement */ }
      }
    };

    const verifier = () => {
      let dernier = 0;
      try { dernier = parseInt(localStorage.getItem("douanes_notif_last") || "0", 10) || 0; } catch (e) {}
      const maintenant = Date.now();
      if (maintenant - dernier >= DEUX_HEURES) {
        declencherRappel();
        try { localStorage.setItem("douanes_notif_last", String(maintenant)); } catch (e) {}
      }
    };

    verifier();
    if (notifEnabled) enregistrerSWEtPeriodicSync();
    const id = setInterval(verifier, 60 * 1000); // vérifie chaque minute si 2h sont passées
    return () => clearInterval(id);
  }, [notifEnabled]);

  const basculerNotifications = () => {
    if (!("Notification" in window)) {
      alert("Les notifications ne sont pas prises en charge par ce navigateur.");
      return;
    }
    if (notifEnabled) {
      setNotifEnabled(false);
      try { localStorage.setItem("douanes_notif_enabled", "0"); } catch (e) {}
      return;
    }
    if (Notification.permission === "granted") {
      try {
        localStorage.setItem("douanes_notif_enabled", "1");
        localStorage.setItem("douanes_notif_last", "0"); // déclenche un premier rappel immédiatement
      } catch (e) {}
      setNotifEnabled(true);
      enregistrerSWEtPeriodicSync();
    } else if (Notification.permission === "denied") {
      alert("Notifications bloquées. Autorisez-les dans les réglages du site pour recevoir un article toutes les 2 heures.");
    } else {
      Notification.requestPermission().then(perm => {
        if (perm === "granted") {
          try {
            localStorage.setItem("douanes_notif_enabled", "1");
            localStorage.setItem("douanes_notif_last", "0");
          } catch (e) {}
          setNotifEnabled(true);
          enregistrerSWEtPeriodicSync();
        }
      });
    }
  };

  // Tente d'activer les rappels même quand l'app/onglet est fermé
  // (Periodic Background Sync — Chrome/Android, app installée uniquement, meilleur effort).
  // Si non supporté, les rappels fonctionnent quand même en arrière-plan via l'effet ci-dessus,
  // tant que l'onglet reste ouvert.
  const enregistrerSWEtPeriodicSync = async () => {
    if (!("serviceWorker" in navigator)) return;
    try {
      const reg = await navigator.serviceWorker.register("./service-worker.js");
      if ("periodicSync" in reg) {
        try {
          const status = await navigator.permissions.query({ name: "periodic-background-sync" });
          if (status.state === "granted") {
            await reg.periodicSync.register("douanes-rappel-2h", { minInterval: 2 * 60 * 60 * 1000 });
          }
        } catch (e) { /* API indisponible sur ce navigateur, on ignore */ }
      }
    } catch (e) { /* fichier service-worker.js absent ou hors HTTPS : on ignore silencieusement */ }
  };

  const scrollbarCSS = dark
    ? `*{box-sizing:border-box;margin:0;padding:0}body{background:#07090F}input:focus{border-color:rgba(196,152,70,0.6)!important;outline:none}::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-track{background:#0D1022}::-webkit-scrollbar-thumb{background:#21263A;border-radius:3px}::-webkit-scrollbar-thumb:hover{background:#C4984622}`
    : `*{box-sizing:border-box;margin:0;padding:0}body{background:#F5F4EF}input:focus{border-color:rgba(139,105,20,0.5)!important;outline:none}::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-track{background:#E8E5DC}::-webkit-scrollbar-thumb{background:#C4BEB0;border-radius:3px}::-webkit-scrollbar-thumb:hover{background:#A09880}`;

  return (
    <ThemeCtx.Provider value={{ dark, toggle }}>
      <div style={S.app}>
        <style>{scrollbarCSS}</style>
        {rappelArticle && (
          <div style={{
              position:"fixed", top:16, right:16, left:16, maxWidth:420, marginLeft:"auto",
              background:T.surface, border:`1px solid ${T.borderGold}`, borderRadius:14,
              boxShadow:"0 12px 32px rgba(0,0,0,0.35)", padding:"16px 18px", zIndex:9999,
              animation:"douanesRappelIn 0.35s ease-out"
            }}>
            <style>{`@keyframes douanesRappelIn { from { opacity:0; transform:translateY(-12px); } to { opacity:1; transform:translateY(0); } }`}</style>
            <div style={{ display:"flex", alignItems:"flex-start", gap:10 }}>
              <div style={{ fontSize:22, lineHeight:1 }}>📜</div>
              <div style={{ flex:1, minWidth:0 }}>
                <div style={{ fontSize:11, fontWeight:700, letterSpacing:"0.7px", color:T.gold, marginBottom:4 }}>
                  RAPPEL · ARTICLE DU MOMENT
                </div>
                <div style={{ fontSize:14, fontWeight:700, color:T.text, marginBottom:6 }}>
                  Art. {rappelArticle.num} — {rappelArticle.titre}
                </div>
                <div style={{ fontSize:13, color:T.muted, lineHeight:1.6, maxHeight:120, overflow:"auto" }}>
                  {(rappelArticle.exemple || rappelArticle.texte || "").slice(0, 320)}
                  {(rappelArticle.exemple || rappelArticle.texte || "").length > 320 ? "…" : ""}
                </div>
              </div>
              <button onClick={() => setRappelArticle(null)}
                style={{ background:"none", border:"none", color:T.muted, fontSize:18, cursor:"pointer", lineHeight:1, padding:4 }}
                title="Fermer">✕</button>
            </div>
          </div>
        )}
        <header style={S.header}>
          <div style={S.headerInner}>
            <div style={S.logo}>
              <Flag />
              <div>
                <div style={S.logoText}>Douanes Sénégal</div>
                <div style={S.logoSub}>Plateforme de formation juridique douanière</div>
              </div>
            </div>
            <div style={{ marginLeft:"auto", display:"flex", alignItems:"center", gap:12 }}>
              <span style={S.badge}>LOI 2014-10</span>
              <button onClick={basculerNotifications}
                title={notifEnabled ? "Rappels actifs : un article au hasard toutes les 2h. Cliquez pour désactiver." : "Activer un rappel d'article au hasard toutes les 2 heures"}
                style={{ ...S.badge, cursor:"pointer", background: notifEnabled ? "rgba(34,197,94,0.14)" : T.surface, color: notifEnabled ? "#22c55e" : T.muted, border:`1px solid ${notifEnabled ? "#22c55e55" : T.border}` }}>
                {notifEnabled ? "🔔 Rappels 2h actifs" : "🔕 Activer rappels 2h"}
              </button>
              <ThemeToggle dark={dark} toggle={toggle} />
            </div>
          </div>
        </header>
        <nav style={S.nav}>
          <div style={{ ...S.navInner, overflowX:"auto" }}>
            {TABS.map(t => <TabBtn key={t.id} id={t.id} label={t.label} active={tab===t.id} onClick={setTab} />)}
          </div>
        </nav>
        <main style={S.main}>
          {tab==="accueil" && <TabAccueil setTab={setTab} />}
          {tab==="titre1" && <TabTitre1 />}
          {tab==="titre2" && <TabTitre2 />}
          {tab==="titre3" && <TabTitre3 />}
          {tab==="titre4" && <TabTitre4 />}
          {tab==="titre5" && <TabTitre5 />}
          {tab==="titre6" && <TabTitre6 />}
          {tab==="titre7" && <TabTitre7 />}
          {tab==="titre8" && <TabTitre8 />}
          {tab==="titre9" && <TabTitre9 />}
          {tab==="titre10" && <TabTitre10 />}
          {tab==="titre11" && <TabTitre11 />}
          {tab==="titre12" && <TabTitre12 />}
          {tab==="titre13" && <TabTitre13 />}
          {tab==="titre14_16" && <TabTitre14_16 />}
          {tab==="regimes" && <TabRegimes />}
          {tab==="procedures" && <TabProcedures />}
          {tab==="infractions" && <TabInfractions />}
          {tab==="fiches" && <TabFiches />}
          {tab==="quiz" && <TabQuiz />}
        </main>
        <footer style={{ borderTop:`1px solid ${T.border}`, padding:"16px 24px", textAlign:"center", background:T.surface }}>
          <p style={{ color:T.muted, fontSize:12 }}>Code des Douanes du Sénégal — Loi n°2014-10 du 28 février 2014 · Direction Générale des Douanes · Ministère de l'Économie et des Finances</p>
        </footer>
      </div>
    </ThemeCtx.Provider>
  );
}
