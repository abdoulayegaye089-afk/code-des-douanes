  { num:255, titre:"Ouverture des colis en dépôt — Présence requise", chapitre:"I — Constitution en dépôt",

/* ===================== TAB: TITRE VII COMPLET ===================== */

        a.texte.toLowerCase().includes(q) || a.exemple.toLowerCase().includes(q) ||

    <div>
      <div style={{ marginBottom:20 }}>
        <div style={{ display:"flex", alignItems:"center", gap:12, marginBottom:6 }}>

          <h2 style={{ fontSize:20, fontWeight:700, color:T.text, margin:0 }}>Dépôt de Douane — Articles 252 à 259</h2>

        <p style={{ color:T.muted, fontSize:15, margin:"0 0 16px" }}>Loi n°2014-10 du 28 février 2014 · 8 articles · Constitution en dépôt, vente aux enchères, affectation du produit</p>

        <div style={{ display:"flex", gap:10, flexWrap:"wrap", marginBottom:14 }}>
          <input placeholder="Rechercher un mot-clé, article, exemple..." value={search}

            style={{ ...S.input, maxWidth:360, flex:1 }} />
          <select value={filterCh} onChange={e => setFilterCh(e.target.value)}
            style={{ background:T.card, border:`1px solid ${T.border}`, borderRadius:8, padding:"10px 14px", color:T.text, fontSize:15, cursor:"pointer" }}>
            <option value="tous">Tous les chapitres</option>

        </div>

        <div style={{ display:"flex", flexWrap:"wrap", gap:6, marginBottom:18 }}>

            return (
              <button key={c} onClick={() => setFilterCh(filterCh===c ? "tous" : c)}

              </button>

          })}
        </div>

        {search && <div style={{ fontSize:12, color:T.muted, marginBottom:10 }}>{filtered.length} article(s) trouvé(s) pour « {search} »</div>}

        <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fit,minmax(180px,1fr))", gap:10, marginBottom:20 }}>
          {chapitres.map(c => {
            const color = chColors[c] || T.gold;

            const last = arts[arts.length-1]?.num;

              <div key={c} onClick={() => setFilterCh(filterCh===c ? "tous" : c)}

                <div style={{ fontSize:18, fontWeight:700, color }}>{arts.length}</div>
                <div style={{ fontSize:13, color:T.text, fontWeight:600, marginTop:2 }}>{trunc(c.split("—")[1], 28) || c}</div>

      </div>

                        onMouseEnter={e => { e.currentTarget.style.color=color; e.currentTarget.style.borderColor=color+"66"; }}

              </div>

              {isOpen && (
                <div style={{ borderTop:`1px solid ${T.border}` }}>
                  <div style={{ padding:"16px 18px 12px" }}>
                    <div style={{ fontSize:12, color, fontWeight:700, letterSpacing:"0.7px", marginBottom:10, display:"flex", alignItems:"center", gap:6 }}>
                      <span>📜</span> TEXTE OFFICIEL — ARTICLE {a.num}
                    </div>
                    <div style={{ background:T.surface, borderRadius:8, padding:"18px 20px", borderLeft:`3px solid ${color}` }}>
                      {a.texte.split('\n').map((line, i) => (
                        <p key={i} style={{ fontSize:15, lineHeight:2, margin:"0 0 6px",
                          color: T.text }}>
                          {line}
                        </p>
                      ))}
                    </div>
                  </div>
                  <div style={{ padding:"0 18px 16px" }}>
                    <div style={{ fontSize:12, color:T.green, fontWeight:700, letterSpacing:"0.5px", marginBottom:10, display:"flex", alignItems:"center", gap:6 }}>
                      <span>💡</span> EXEMPLE TYPIQUE
                    </div>
                    <div style={{ background:T.greenBg, borderRadius:8, padding:"14px 16px", border:`1px solid ${T.green}44` }}>
                      <p style={{ fontSize:15, color:T.text, lineHeight:1.75, margin:0 }}>{a.exemple}</p>
                    </div>
                    <div style={{ marginTop:10, display:"flex", flexWrap:"wrap", gap:5 }}>
                      {a.motscles.map(m => (
                        <span key={m} onClick={() => setSearch(m)}
                          style={{ background:color+"15", border:`1px solid ${color}33`, color, fontSize:13, padding:"3px 10px", borderRadius:20, cursor:"pointer", fontWeight:500 }}

                          onMouseLeave={e => e.currentTarget.style.background=color+"15"}>
                          #{m}
                        </span>
                      ))}
                    </div>
                  </div>
                </div>
              )}
            </div>
          );
        })}
      </div>

      {filtered.length === 0 && (
        <div style={{ textAlign:"center", padding:"40px 0", color:T.muted }}>
          <div style={{ fontSize:32, marginBottom:12 }}>🔍</div>
          <div>Aucun article trouvé pour « {search} »</div>
          <button onClick={() => { setSearch(""); setFilterCh("tous"); }} style={{ ...S.btn, marginTop:12 }}>Réinitialiser</button>
        </div>
      )}
    </div>
  );
}

          );
        })}
      </div>

      {filtered.length === 0 && (
        <div style={{ textAlign:"center", padding:"40px 0", color:T.muted }}>
          <div style={{ fontSize:32, marginBottom:12 }}>🔍</div>

          <button onClick={() => { setSearch(""); setFilterCh("tous"); }} style={{ ...S.btn, marginTop:12 }}>Réinitialiser</button>
        </div>
      )}
    </div>
  );
}

    exemple:"Un camion transportant du riz non déclaré (marchandise non prohibée) est saisi. Les agents offrent immédiatement la mainlevée du camion au transporteur : soit il fournit une caution bancaire solvable, soit il consigne la valeur du camion (par exemple 4 millions FCFA). Sa réponse — qu'il accepte ou refuse — est mentionnée dans le PV. Si les marchandises étaient prohibées (drogues, armes), aucune mainlevée ne serait offerte.",
    motscles:["mainlevée moyen de transport","caution solvable","consignation valeur","marchandises non prohibées","offre et réponse dans PV","arrêté ministre finances"] },

  { num:306, titre:"Notification du procès-verbal au saisi — Présent ou absent", chapitre:"II — Constatation des infractions",
    texte:`1. Si le saisi est présent, le procès-verbal énonce qu'il lui en a été donné lecture, qu'il a été invité à le signer et qu'il en a reçu copie sur-le-champ.
2. Lorsque le saisi est absent, ou lorsqu'il est présent mais refuse de signer, il en est fait mention au procès-verbal dont copie est affichée dans les 24 heures à la porte de l'unité de douane ou à la mairie ou au siège du chef de la circonscription administrative du lieu de rédaction.
3. Dans l'un et l'autre cas, le procès-verbal comporte citation à comparaître dans les formes et délais prévus par la loi.
4. Les procès-verbaux, citations et affichages peuvent être faits tous les jours indistinctement.`,
    exemple:"Le chauffeur du camion de riz est présent lors de la saisie à Kaolack : le PV lui est lu, il est invité à signer et reçoit une copie immédiatement (al.1). Si le propriétaire de la marchandise est absent (domicilié à Dakar), une copie du PV est affichée à la porte du bureau de douane de Kaolack dans les 24h et le PV contient une convocation (al.2 et 3). Ces formalités peuvent être accomplies même un dimanche (al.4).",
    motscles:["notification saisi présent","lecture copie sur le champ","saisi absent refus de signer","affichage 24 heures unité de douane","citation à comparaître","tous les jours indistinctement"] },

  { num:307, titre:"Saisies portant sur le faux et l'altération des documents", chapitre:"II — Constatation des infractions",
    texte:`1. Si le motif de la saisie porte sur le faux et/ou l'altération des documents, le procès-verbal énonce le genre de faux, d'altération ou de surcharge.
2. Lesdits documents et expéditions, signés et paraphés « ne varietur » par les saisissants, sont annexés au procès-verbal qui contient la sommation faite au saisi de les signer et sa réponse.`,
    exemple:"Un déclarant présente une facture commerciale falsifiée indiquant 10 000 USD au lieu de 50 000 USD pour minorer les droits. Lors de la saisie, le PV mentionne expressément : 'faux en écriture — surcharge de la valeur déclarée' (al.1). La facture falsifiée est paraphée 'ne varietur' (ne sera pas modifiée) par les deux agents saisissants, et annexée au PV. Le déclarant est sommé de signer l'annexe — il refuse : ce refus est consigné (al.2).",
    motscles:["faux altération documents","genre de faux surcharge","ne varietur saisissants","annexe au PV","sommation de signer","refus consigné"] },

  { num:308, titre:"Saisies à domicile — Régime des marchandises", chapitre:"II — Constatation des infractions",
    texte:`1. En cas de saisie à domicile, les marchandises non prohibées ne sont pas déplacées si le saisi donne caution solvable de leur valeur, auquel cas la mainlevée est offerte. Si le saisi ne fournit pas de caution, ou s'il s'agit d'objets prohibés, les marchandises sont transportées à la plus proche unité de douanes ou confiées à un tiers gardien.
2. L'officier de police judiciaire ou le représentant de l'autorité administrative intervenu n'est pas tenu d'assister à la rédaction du procès-verbal.`,
    exemple:"Un dépôt de montres de contrefaçon est découvert dans l'entrepôt privé d'un commerçant à Sandaga, Dakar. Les montres étant prohibées (contrefaçon = prohibition), elles sont immédiatement transportées au bureau de douane de Dakar-Port, sans possibilité de laisser les marchandises sur place sous caution (al.1). Si au contraire il s'agissait de riz non déclaré (non prohibé), le propriétaire pourrait fournir une caution bancaire et garder le riz en entrepôt jusqu'au jugement.",
    motscles:["saisie à domicile","marchandises non prohibées caution","marchandises prohibées transport obligatoire","tiers gardien","OPJ ne rédige pas PV","caution solvable domicile"] },

  { num:309, titre:"Saisies sur navires et bateaux pontés", chapitre:"II — Constatation des infractions",
    texte:`À l'égard des saisies faites sur les navires et bateaux pontés, lorsque le déchargement ne peut avoir lieu de suite, les saisissants apposent les scellés sur les panneaux et écoutilles des bâtiments. Le procès-verbal est dressé au fur et à mesure du déchargement et fait mention du nombre, des marques et des numéros des colis. La description en détail n'est faite qu'au bureau en présence du saisi ou après sommation d'y assister ; il lui est donné copie à chaque vacation.`,
    exemple:"Lors d'un contrôle au Port de Dakar, les agents douaniers découvrent à bord d'un cargo des caisses non manifestées. Le déchargement ne pouvant être effectué immédiatement (navire à quai pour la nuit), les agents apposent des scellés sur toutes les écoutilles et panneaux. Le lendemain, au fur et à mesure du déchargement, le PV est complété : numéros des caisses, marques, quantités. La description détaillée se fait au bureau avec le capitaine ou son représentant dûment convoqué.",
    motscles:["saisie navire bateau ponté","scellés panneaux écoutilles","déchargement progressif","PV au fur et à mesure","description détaillée au bureau","vacation copie saisi"] },

  { num:310, titre:"Saisies en dehors du rayon — Dispositions particulières", chapitre:"II — Constatation des infractions",
    texte:`1. En dehors du rayon, les dispositions des articles 300 à 310 sont applicables aux infractions relevées dans les unités de douane, entrepôts et autres lieux soumis à la surveillance des douanes.
2. Des saisies peuvent également être pratiquées en tous lieux dans le cas de poursuite à vue, d'infraction flagrante, d'infraction à l'article 280 ou de découverte inopinée de marchandises dont l'origine frauduleuse ressort manifestement des déclarations de leur détenteur ou des documents probants trouvés en sa possession.
3. En cas de saisie après poursuite à vue, le procès-verbal doit constater que les marchandises ont été suivies sans interruption depuis leur franchissement de la limite intérieure du rayon jusqu'au moment de leur saisie.`,
    exemple:"À Thiès (hors rayon des douanes), un contrôle d'entrepôt révèle des marchandises sans justification d'origine (al.1 — lieu soumis à surveillance). À Tambacounda, des agents aperçoivent un camion décharger des marchandises à la tombée de la nuit et le poursuivent sans interruption jusqu'à son immobilisation 10 km plus loin : c'est une saisie après poursuite à vue (al.2 et 3). Le PV doit expressément mentionner que la poursuite a été continue depuis le début.",
    motscles:["saisies hors rayon","poursuite à vue","infraction flagrante","article 280","découverte inopinée","poursuite sans interruption","PV constate continuité"] },

  { num:311, titre:"Transmission des procès-verbaux et arrestation des délinquants", chapitre:"II — Constatation des infractions",
    texte:`1. Les procès-verbaux constatant les infractions douanières sont transmis à la juridiction compétente par le receveur poursuivant des douanes.
2. Les agents des douanes peuvent procéder à l'arrestation et au placement en retenue douanière des responsables d'une infraction douanière, mais uniquement en cas de flagrant délit et lorsque cette mesure est justifiée par les nécessités de l'enquête douanière. Ils doivent se conformer aux dispositions du code de procédure pénale relatives à la garde à vue.
3. Les délinquants doivent être conduits devant le procureur de la République.
4. Lorsque la saisie est faite par une administration autre que les douanes, celle-là doit obligatoirement mettre le receveur poursuivant en mesure d'exercer les poursuites douanières.
5. Le procès-verbal doit parvenir en même temps que les conclusions de l'administration des douanes au parquet.`,
    exemple:"Les agents des douanes de Dakar-Port constatent en flagrant délit un agent d'une société de transit en train de soustraire des colis d'un conteneur. Ils l'interpellent et le placent en retenue douanière (al.2). Ils respectent les droits de garde à vue (avocat, durée maximale). Le PV et les conclusions du receveur des douanes sont transmis ensemble au parquet du Tribunal régional de Dakar (al.5). Si c'était la Police qui avait procédé à la saisie, elle devait informer immédiatement le receveur des douanes (al.4).",
    motscles:["transmission PV receveur poursuivant","arrestation flagrant délit","retenue douanière","code procédure pénale","procureur République","parquet conclusions douanes"] },

  { num:312, titre:"Procès-verbal de constat — Contenu et formalités", chapitre:"II — Constatation des infractions",
    texte:`1. Les résultats des contrôles opérés et, d'une manière générale, ceux des enquêtes et interrogatoires effectués par les agents des douanes sont consignés dans des procès-verbaux de constat.
2. Ces procès-verbaux énoncent : la date et le lieu des contrôles et des enquêtes effectués ; la nature des constatations faites et des renseignements recueillis ; la saisie des documents, s'il y a lieu ; les noms, qualités et résidences administratives des agents verbalisateurs ; les déclarations du ou des mis en cause. Ils indiquent que les personnes contrôlées ont été dûment informées, que sommation leur a été faite d'assister à la rédaction et qu'elles ont été invitées à le signer. Les dispositions de l'article 306 sont applicables.
3. Les procès-verbaux relatifs à la saisie des documents informatiques de l'article 303 sont soumis aux mêmes règles.`,
    exemple:"Suite à un contrôle d'écritures chez un commissionnaire en douane agréé, les agents constatent des anomalies dans les registres de facturation. Ils dressent un procès-verbal de constat (non de saisie, car les marchandises sont en libre circulation) mentionnant : date de l'enquête, nature des irrégularités comptables constatées, photocopies des pièces comptables saisies, identité des agents verbalisateurs, déclarations du commissionnaire lors de l'audition. Le commissionnaire est invité à signer ou refuse, ce qui est consigné (art. 306 applicable).",
    motscles:["procès-verbal de constat","contrôle d'écritures","enquêtes interrogatoires","agents verbalisateurs","mis en cause déclarations","invitation à signer","article 306 applicable"] },

  { num:313, titre:"Dispense de timbre et d'enregistrement pour les actes de douane", chapitre:"II — Constatation des infractions",
    texte:`Les procès-verbaux de douane ainsi que les soumissions et transactions et tous autres exploits de l'administration des douanes sont dispensés des formalités de timbre et d'enregistrement.`,
    exemple:"Un procès-verbal de saisie dressé par les agents des douanes de Kaolack n'a pas besoin d'être enregistré à la Conservation des Hypothèques ni d'être timbre-fiscalisé. Cette dispense permet à l'administration douanière d'agir rapidement sans les lourdeurs administratives des actes civils et commerciaux ordinaires.",
    motscles:["dispense timbre enregistrement","procès-verbaux douane","soumissions transactions","exploits douane","allègement procédural"] },

  { num:314, titre:"Force probante des procès-verbaux rédigés par deux agents", chapitre:"II — Constatation des infractions",
    texte:`1. Les procès-verbaux de douane rédigés par deux agents des douanes et les procès-verbaux constatant des infractions douanières rédigés par deux agents assermentés font foi jusqu'à inscription de faux des constatations matérielles qu'ils relatent.
2. Ils ne font foi que jusqu'à preuve contraire de l'exactitude et de la sincérité des aveux et déclarations qu'ils rapportent.`,
    exemple:"Un PV de saisie rédigé conjointement par l'inspecteur Diallo et le contrôleur Ndiaye mentionne que le camion contenait effectivement 500 kg de riz non déclaré. Ce fait matériel (la quantité constatée) fait foi jusqu'à inscription de faux (al.1) : le mis en cause ne peut pas simplement contester, il doit engager une procédure d'inscription de faux devant le tribunal. En revanche, si le PV rapporte qu'il a 'avoué avoir voulu frauder', cette déclaration ne fait foi que jusqu'à preuve contraire (al.2).",
    motscles:["foi jusqu'à inscription de faux","deux agents rédacteurs","constatations matérielles","aveux déclarations preuve contraire","force probante renforcée"] },

  { num:315, titre:"Force probante des procès-verbaux rédigés par un seul agent", chapitre:"II — Constatation des infractions",
    texte:`1. Les procès-verbaux de douane rédigés par un seul agent des douanes, ou un seul agent assermenté visé à l'article 301 font foi jusqu'à preuve contraire.
2. En matière d'infractions constatées par procès-verbal de constat à la suite d'un contrôle d'écritures, la preuve contraire ne peut être rapportée qu'au moyen de documents de date certaine antérieure à celle de l'enquête effectuée par les agents verbalisateurs.`,
    exemple:"Un PV de constat rédigé par un seul agent des douanes suite à un contrôle d'écritures fait foi jusqu'à preuve contraire (al.1). Si le commissionnaire en douane veut contester que ses registres montraient des anomalies au 15 mai, il doit produire des documents (ex : duplicatas comptables notariés) dont la date certaine est antérieure au 15 mai (al.2) — il ne peut pas produire un document daté du 20 mai pour contredire un constat du 15.",
    motscles:["PV un seul agent","foi jusqu'à preuve contraire","contrôle d'écritures","documents date certaine antérieure","preuve contraire limitée","un seul agent assermenté"] },

  { num:316, titre:"Nullités admissibles des procès-verbaux — Limites", chapitre:"II — Constatation des infractions",
    texte:`1. Les tribunaux ne peuvent admettre contre les procès-verbaux de douane d'autres nullités que celles résultant de l'omission des formalités prescrites par les articles 38, 301 à 310 et 312 du présent code.
2. Les procès-verbaux nuls en la forme ne valent que comme témoignages écrits.
3. Toutefois, sera nulle et de nul effet toute saisie de marchandises non prohibées à l'importation ou à l'exportation ou non fortement taxées qui auraient dépassé une unité de douane sur la façade de laquelle le tableau prévu à l'article 35 n'aurait pas été apposé.`,
    exemple:"Un PV de saisie omet la mention de l'heure de clôture (Art. 304 §1j). Le tribunal peut prononcer la nullité formelle (al.1). Mais ce PV nul conserve une valeur de témoignage écrit devant les juges (al.2) — il peut corroborer d'autres preuves. En revanche, si des marchandises ordinaires ont été saisies dans un bureau de douane ne portant pas le tableau réglementaire (Art. 35), la saisie est nulle et de nul effet, sans possibilité de la sauver (al.3).",
    motscles:["nullités admissibles PV","omission formalités articles 301-310","PV nul témoignage écrit","tableau article 35","saisie nulle et de nul effet","protection contre nullités arbitraires"] },

  { num:317, titre:"Procédure d'inscription de faux contre un procès-verbal", chapitre:"II — Constatation des infractions",
    texte:`1. Quiconque veut s'inscrire en faux contre un procès-verbal est tenu d'en faire déclaration par écrit, en personne ou par un fondé de pouvoir spécial, au plus tard à l'audience indiquée par la sommation de comparaître devant le tribunal qui doit connaître de l'infraction.
2. Il doit, dans les cinq (05) jours suivants, faire au greffe dudit tribunal le dépôt des moyens de faux et des noms et qualités des témoins qu'il veut faire entendre, sous peine de déchéance de l'inscription de faux.
3. Cette déclaration est reçue et signée par le juge et le greffier si le déclarant ne sait ni écrire ni signer.`,
    exemple:"Convoqué au Tribunal régional de Dakar pour répondre d'une contrebande, un importateur conteste la véracité du PV rédigé par deux agents (qui fait foi jusqu'à inscription de faux). À l'audience du 1er juin, il déclare verbalement vouloir s'inscrire en faux (al.1). Il a jusqu'au 6 juin pour déposer au greffe ses 'moyens de faux' (les preuves montrant que le PV est falsifié) et la liste de ses témoins (al.2). Passé ce délai, il est définitivement forclos.",
    motscles:["inscription de faux","déclaration écrite audience","fondé de pouvoir spécial","cinq jours greffe","moyens de faux témoins","déchéance forclusion","juge greffier signature"] },

  { num:318, titre:"Jugement sur le faux — Sursis à statuer", chapitre:"II — Constatation des infractions",
    texte:`1. Dans le cas d'une inscription de faux contre un procès-verbal constatant la fraude, si l'inscription est faite dans le délai et suivant la forme prescrite, il est statué sur le faux dans les formes du droit commun.
2. La juridiction saisie de l'affaire de douane décide, après avoir recueilli les observations du ministère public et des parties, s'il y a lieu ou non de surseoir jusqu'à ce qu'il ait été prononcé sur le faux par la juridiction compétente. S'il décide de surseoir, le tribunal ordonne provisoirement la vente des marchandises sujettes à dépérissement et des animaux qui ont servi au transport.`,
    exemple:"Suite à l'inscription de faux de l'importateur (Art. 317), le Tribunal régional de Dakar doit décider : soit il statue immédiatement sur la fraude douanière en attendant que la question du faux soit tranchée ; soit il sursoit à statuer (al.2). S'il sursoit, la saisie de poulets vivants qui dépériraient sera ordonnée en vente aux enchères provisoire pour préserver leur valeur. Le faux sera ensuite jugé séparément par la Chambre correctionnelle.",
    motscles:["jugement sur le faux","droit commun","sursis à statuer","observations ministère public","vente provisoire dépérissement","animaux transport"] },

  { num:319, titre:"Absence d'inscription de faux dans le délai", chapitre:"II — Constatation des infractions",
    texte:`Lorsqu'une inscription de faux n'a pas été faite dans le délai et formes déterminés par l'article 317 du présent code, il est, sans y avoir aucun égard, procédé à l'instruction et au jugement de l'affaire.`,
    exemple:"L'importateur convoqué le 1er juin avait jusqu'au 6 juin pour déposer ses moyens de faux au greffe. Il ne le fait pas. Le tribunal ignore totalement sa demande tardive d'inscription de faux et procède au jugement sur le fond de l'affaire de contrebande, en considérant le PV des deux agents comme faisant foi jusqu'à inscription de faux — qui n'a pas été valablement formée.",
    motscles:["inscription de faux hors délai","jugement sans égard","instruction affaire poursuivie","forclusion","PV maintient sa force probante"] },

  { num:320, titre:"Mesures conservatoires autorisées par les PV valant titre", chapitre:"II — Constatation des infractions",
    texte:`1. Les procès-verbaux de douane, lorsqu'ils font foi jusqu'à inscription de faux, valent titre pour obtenir l'autorisation de prendre toutes mesures conservatoires utiles à l'encontre des personnes pénalement ou civilement responsables, afin de garantir les créances douanières résultant desdits procès-verbaux.
2. Le Président du tribunal statue sur la requête présentée à cet effet par l'administration des douanes. Le montant de la saisie autorisée ne peut être inférieur au montant des droits et taxes dus retenu dans le procès-verbal. Lorsque la peine de la confiscation générale des biens est encourue, les mesures conservatoires peuvent porter sur l'intégralité des biens du délinquant.
3. La procédure est celle prévue aux articles 401 à 410 du code de procédure civile.`,
    exemple:"L'administration des douanes dispose d'un PV de deux agents (valant titre jusqu'à inscription de faux) constatant une fraude de 50 millions FCFA de droits éludés. Avant tout jugement, elle demande au Président du Tribunal régional de Dakar l'autorisation de saisir conservatoirement les comptes bancaires et immeubles du fraudeur (al.1). Le Président autorise la saisie à hauteur de 50 millions minimum. Si la peine de confiscation générale est applicable (fraude massive), tous les biens du fraudeur peuvent être frappés de mesures conservatoires (al.2).",
    motscles:["mesures conservatoires","PV valant titre","créances douanières garanties","Président du tribunal requête","montant droits taxes","confiscation générale biens","articles 401-410 CPC"] },

  { num:321, titre:"Modes de preuve des infractions douanières", chapitre:"III — Poursuites",
    texte:`Tous délits et contraventions prévus par la législation douanière peuvent être poursuivis et prouvés par toutes les voies de droit alors même qu'aucune saisie n'aurait pu être effectuée dans le rayon des douanes ou hors de ce rayon ou que les marchandises ayant fait l'objet d'une déclaration n'auraient donné lieu à aucune observation. À cet effet, il peut être valablement fait état, à titre de preuve, des renseignements, certificats, procès-verbaux et autres documents fournis ou établis par les autorités des pays étrangers.`,
    exemple:"La douane sénégalaise reçoit des renseignements des autorités douanières de Chine attestant qu'un importateur sénégalais a acheté des marchandises pour 300 000 USD, alors que sa déclaration ne mentionne que 50 000 USD. Même sans saisie sur le territoire sénégalais (les marchandises ont déjà été dédouanées et vendues), ces documents de source étrangère constituent une preuve valable pour poursuivre l'importateur pour fausse déclaration de valeur.",
    motscles:["toutes voies de droit","preuve sans saisie","documents autorités étrangères","certificats étrangers","même après dédouanement","coopération internationale douanière"] },

  { num:322, titre:"Rôle du Parquet dans les poursuites douanières", chapitre:"III — Poursuites",
    texte:`1. Le procureur de la République ou son délégué saisi d'une procédure en matière douanière dispose de l'action à exercer en vue de l'application des peines.
2. Toutefois, dans la mise en œuvre de cette action, le magistrat du Parquet retient comme base des poursuites à intenter la qualification des faits donnée par l'administration des douanes et l'évaluation des marchandises faite par le receveur poursuivant compétent.
3. Dans tous les cas, le Parquet reste lié par ces deux éléments de la procédure et par la demande de dessaisissement visée à l'article 301.
4. Le procureur de la République est tenu de faire d'office toutes les poursuites pour découvrir les entrepreneurs, assureurs et, d'une manière générale, tous les intéressés à la fraude.
5. L'action pour l'application des sanctions fiscales est exercée par l'administration des douanes. Toutefois, le Ministère public peut l'exercer accessoirement à l'action publique.`,
    exemple:"Suite à la saisie d'un conteneur de téléphones contrefaits, le receveur des douanes qualifie les faits de 'délit de contrebande de marchandises prohibées' (Art. 390) et évalue les marchandises à 80 millions FCFA. Le Procureur de Dakar est saisi : il doit retenir cette qualification et cette valorisation (al.2 et 3), même s'il aurait pu personnellement qualifié les faits différemment. Il doit également rechercher d'office qui a financé l'opération de contrebande (al.4). La douane réclame séparément les droits éludés (al.5).",
    motscles:["procureur parquet","qualification faits douanes","évaluation receveur poursuivant","Parquet lié","intéressés à la fraude","action fiscale douanes","dessaisissement article 301"] },

  { num:323, titre:"Obligation d'information de la douane par l'autorité judiciaire", chapitre:"III — Poursuites",
    texte:`Qu'il s'agisse d'une instance civile ou commerciale ou d'une information, même terminée par un non-lieu, l'autorité judiciaire informe le service des douanes de tout renseignement de nature à présumer une infraction douanière ou une manœuvre quelconque ayant eu pour but ou pour effet d'enfreindre les dispositions législatives ou réglementaires que le service des douanes est chargé d'appliquer.`,
    exemple:"Un juge d'instruction enquêtant sur une affaire de trafic de faux billets (infraction de droit commun) découvre que le réseau utilisait également des faux documents douaniers pour importer du matériel électronique. Même si l'enquête aboutit à un non-lieu sur le trafic de faux billets, le juge a l'obligation légale d'informer la douane des éléments qui pourraient constituer une infraction douanière.",
    motscles:["obligation information judiciaire","service des douanes informé","non-lieu même terminé","présomption d'infraction douanière","manœuvre contraire réglementation","coopération justice-douanes"] },

  { num:324, titre:"Action de la douane contre la succession en cas de décès du délinquant", chapitre:"III — Poursuites",
    texte:`Lorsque l'auteur d'une infraction douanière vient à décéder avant l'intervention d'un jugement définitif ou d'une transaction, l'administration des douanes est fondée à exercer contre la succession une action tendant à faire prononcer par le tribunal la confiscation des objets passibles de cette sanction ou, si ceux-ci n'ont pu être saisis, la condamnation au paiement d'une somme égale à la valeur desdits objets calculée d'après le cours sur le marché intérieur à l'époque où la fraude a été commise.`,
    exemple:"Un importateur frauduleux décède d'un accident de la route avant son jugement pour contrebande de 100 tonnes de ciment (valeur marché intérieur : 12 millions FCFA). L'administration des douanes peut encore assigner la succession (ses héritiers) devant le tribunal pour obtenir soit la confiscation des stocks de ciment restants, soit la condamnation des héritiers à payer 12 millions correspondant à la valeur des marchandises fraudées au moment de l'infraction.",
    motscles:["décès avant jugement","action contre succession","confiscation objet fraude","valeur marché intérieur","époque de la fraude","héritiers responsables"] },

  { num:325, titre:"Contrainte pour recouvrement des droits — Seuil et compétence", chapitre:"III — Poursuites",

/* ===================== TAB: TITRE XII — CONTENTIEUX (Fusion 1/2 + 2/2) ===================== */
function TabTitre12() {
  const [search, setSearch] = React.useState("");
  const [open, setOpen] = React.useState(null);
  const [filterCh, setFilterCh] = React.useState("tous");

  const chapitres = [...new Set(TITRE12_ARTICLES_DATA.map(a => a.chapitre))];
  const chColors = {
    "I — Définition de l'infraction douanière": T.red,
    "II — Constatation des infractions": T.amber,
    "III — Poursuites": T.blue,
    "IV — Procédure devant les tribunaux": T.red,
    "V — Procédure civile": T.amber,
    "VI — Procédure répressive": T.blue,
    "VII — Dispositions diverses": T.green,
    "VIII — Dispositions particulières aux instances": T.red,
    "IX — Sûretés garantissant l'exécution": T.amber,
    "X — Voies d'exécution": T.blue,
    "XI — Répartition du produit des amendes": T.green,
    "XII — Responsabilité pénale": T.red,
    "XVII — Cas particuliers d'application des peines": T.amber,
  };

  const filtered = React.useMemo(() =>
    TITRE12_ARTICLES_DATA.filter(a => {
      const matchCh = filterCh === "tous" || a.chapitre === filterCh;
      const q = search.toLowerCase();
      return matchCh && (!q || a.titre.toLowerCase().includes(q) ||
        a.texte.toLowerCase().includes(q) || a.exemple.toLowerCase().includes(q) ||
        String(a.num).includes(q) || a.motscles.some(m => m.toLowerCase().includes(q)));
    }), [search, filterCh]
  );

  return (
    <div>
      <div style={{ marginBottom:20 }}>
        <div style={{ display:"flex", alignItems:"center", gap:12, marginBottom:6 }}>
          <div style={{ background:"rgba(192,40,40,0.15)", border:"1px solid rgba(192,40,40,0.4)", borderRadius:8, padding:"4px 12px", fontSize:13, fontWeight:700, color:T.red }}>TITRE XII</div>
          <h2 style={{ fontSize:20, fontWeight:700, color:T.text, margin:0 }}>Contentieux Douanier — Articles 300 à 413</h2>
        </div>
        <p style={{ color:T.muted, fontSize:15, margin:"0 0 16px" }}>Loi n°2014-10 du 28 février 2014 · Définition des infractions, PV de saisie et de constat, poursuites, transaction, prescription, procédure devant les tribunaux, voies d'exécution, responsabilité pénale</p>

        <div style={{ display:"flex", gap:10, flexWrap:"wrap", marginBottom:14 }}>
          <input placeholder="Rechercher un mot-clé, article, exemple..." value={search}
            onChange={e => setSearch(e.target.value)}
            style={{ ...S.input, maxWidth:360, flex:1 }} />
          <select value={filterCh} onChange={e => setFilterCh(e.target.value)}
            style={{ background:T.card, border:`1px solid ${T.border}`, borderRadius:8, padding:"10px 14px", color:T.text, fontSize:15, cursor:"pointer" }}>
            <option value="tous">Tous les chapitres</option>
            {chapitres.map(c => <option key={c} value={c}>{c}</option>)}
          </select>
        </div>
        {search && <div style={{ fontSize:12, color:T.muted, marginBottom:10 }}>{filtered.length} article(s) trouvé(s) pour « {search} »</div>}
        <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fit,minmax(180px,1fr))", gap:10, marginBottom:20 }}>
          {chapitres.map(c => {
            const color = chColors[c] || T.red;
            const arts = TITRE12_ARTICLES_DATA.filter(a => a.chapitre === c);
            return (
              <div key={c} onClick={() => setFilterCh(filterCh===c ? "tous" : c)}
                style={{ background:T.card, border:`1px solid ${filterCh===c ? color : T.border}`, borderRadius:10, padding:"12px 14px", cursor:"pointer", borderTop:`3px solid ${color}` }}>
                <div style={{ fontSize:18, fontWeight:700, color }}>{arts.length}</div>
                <div style={{ fontSize:13, color:T.text, fontWeight:600, marginTop:2 }}>{trunc(c.split("—")[1], 28) || c}</div>
                <div style={{ fontSize:12, color:T.muted, marginTop:2 }}>Art. {arts[0]?.num}–{arts[arts.length-1]?.num}</div>
              </div>
            );
          })}
        </div>
      </div>
      <div style={{ display:"grid", gap:10 }}>
        {filtered.map(a => {
          const color = chColors[a.chapitre] || T.red;
          const isOpen = open === a.num;
          return (
            <div key={a.num} style={{ background:T.card, border:`1px solid ${isOpen ? color : T.border}`, borderRadius:10, overflow:"hidden", transition:"all 0.15s" }}>
              <div onClick={() => setOpen(isOpen ? null : a.num)}
                style={{ padding:"14px 18px", cursor:"pointer", display:"flex", alignItems:"flex-start", gap:14 }}
                onMouseEnter={e => e.currentTarget.style.background=T.cardHover}
                onMouseLeave={e => e.currentTarget.style.background="transparent"}>
                <div style={{ background:color+"22", color, borderRadius:8, minWidth:44, height:44, display:"flex", alignItems:"center", justifyContent:"center", fontSize:17, fontWeight:700, flexShrink:0 }}>
                  {a.num}
                </div>
                <div style={{ flex:1, minWidth:0 }}>
                  <div style={{ fontSize:16, fontWeight:600, color:T.text, marginBottom:4 }}>{a.titre}</div>
                  <div style={{ display:"flex", gap:6, flexWrap:"wrap", marginBottom:4 }}>
                    <span style={{ background:color+"18", color, fontSize:12, padding:"3px 10px", borderRadius:20, fontWeight:600 }}>{trunc(a.chapitre.split("—")[1], 36) || a.chapitre}</span>
                  </div>
                  <div style={{ display:"flex", flexWrap:"wrap", gap:4 }}>
                    {a.motscles.slice(0,4).map(m => (
                      <span key={m} onClick={e => { e.stopPropagation(); setSearch(m); }}
                        style={{ background:T.surface, border:`1px solid ${T.border}`, color:T.dim, fontSize:12, padding:"2px 9px", borderRadius:20, cursor:"pointer" }}
                        onMouseEnter={e => { e.currentTarget.style.color=color; e.currentTarget.style.borderColor=color+"66"; }}
                        onMouseLeave={e => { e.currentTarget.style.color=T.dim; e.currentTarget.style.borderColor=T.border; }}>
                        #{m}
                      </span>
                    ))}
                  </div>
                </div>
                <div style={{ color:T.muted, fontSize:15, flexShrink:0, marginTop:12 }}>{isOpen ? "▲" : "▼"}</div>
              </div>
              {isOpen && (
                <div style={{ borderTop:`1px solid ${T.border}` }}>
                  <div style={{ padding:"16px 18px 12px" }}>
                    <div style={{ fontSize:12, color, fontWeight:700, letterSpacing:"0.7px", marginBottom:10, display:"flex", alignItems:"center", gap:6 }}>
                      <span>📜</span> TEXTE OFFICIEL — ARTICLE {a.num}
                    </div>
                    <div style={{ background:T.surface, borderRadius:8, padding:"18px 20px", borderLeft:`3px solid ${color}` }}>
                      {a.texte.split('\n').map((line, i) => (
                        <p key={i} style={{ fontSize:15, lineHeight:2, margin:"0 0 6px",
                          color: T.text }}>
                          {line}
                        </p>
                      ))}
                    </div>
                  </div>
                  <div style={{ padding:"0 18px 12px" }}>
                    <div style={{ fontSize:12, color:T.amber, fontWeight:700, letterSpacing:"0.7px", marginBottom:8, display:"flex", alignItems:"center", gap:6 }}>
                      <span>💡</span> EXEMPLE PRATIQUE
                    </div>
                    <div style={{ background:"rgba(245,158,11,0.06)", borderRadius:8, padding:"16px 18px", borderLeft:"3px solid rgba(245,158,11,0.4)", fontSize:15, color:T.text, lineHeight:1.85 }}>
                      {a.exemple}
                    </div>
                  </div>
                  <div style={{ padding:"0 18px 16px" }}>
                    <div style={{ fontSize:12, color:T.dim, fontWeight:600, letterSpacing:"0.7px", marginBottom:8 }}>MOTS-CLÉS</div>
                    <div style={{ display:"flex", flexWrap:"wrap", gap:5 }}>
                      {a.motscles.map(m => (
                        <span key={m} onClick={() => setSearch(m)}
                          style={{ background:color+"14", color, fontSize:12, padding:"3px 12px", borderRadius:20, cursor:"pointer", border:`1px solid ${color}33` }}
                          onMouseEnter={e => e.currentTarget.style.background=color+"28"}
                          onMouseLeave={e => e.currentTarget.style.background=color+"14"}>
                          {m}
                        </span>
                      ))}
                    </div>
                  </div>
                </div>
              )}
            </div>
          );
        })}
        {filtered.length === 0 && (
          <div style={{ textAlign:"center", padding:"40px 0", color:T.muted }}>
            <div style={{ fontSize:32, marginBottom:12 }}>🔍</div>
            <div>Aucun article trouvé pour « {search} »</div>
            <button onClick={() => { setSearch(""); setFilterCh("tous"); }} style={{ ...S.btn, marginTop:12 }}>Réinitialiser</button>
          </div>
        )}
      </div>
    </div>
  );
}
